<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Memory Artifact 的版本演进</title>
  <desc id="desc">同一个 Memory Artifact 通过不可变 Revision 逐步增加和修订 Entry，旧版本仍可读取。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/></marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #172b4d; }
      .head { font: 700 20px sans-serif; fill: #172b4d; }
      .text { font: 16px sans-serif; fill: #344563; }
      .small { font: 14px sans-serif; fill: #52606d; }
      .rev { stroke-width: 2; rx: 16; }
      .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f7f9fc"/>
  <text x="60" y="60" class="title">Memory Artifact：稳定身份 + 不可变 Revision</text>
  <text x="60" y="94" class="small">artifact_id 保持不变；每次有效变化产生新的 Revision；历史快照仍然可读。</text>

  <rect x="70" y="155" width="285" height="340" class="rev" fill="#e8f8ef" stroke="#35a66f"/>
  <text x="105" y="205" class="head">Revision 1</text>
  <text x="105" y="240" class="text">memory / memory @ 1</text>
  <line x1="105" y1="265" x2="320" y2="265" stroke="#a7d9ba"/>
  <text x="105" y="310" class="text">Entry A</text>
  <text x="105" y="340" class="small">amount 用整数分存储</text>
  <text x="105" y="400" class="small">状态：active</text>
  <text x="105" y="450" class="small">旧版本保持不变</text>

  <rect x="455" y="155" width="285" height="340" class="rev" fill="#e9f2ff" stroke="#4c8bf5"/>
  <text x="490" y="205" class="head">Revision 2</text>
  <text x="490" y="240" class="text">memory / memory @ 2</text>
  <line x1="490" y1="265" x2="705" y2="265" stroke="#9ec1f8"/>
  <text x="490" y="310" class="text">Entry A</text>
  <text x="490" y="340" class="small">amount 用整数分存储</text>
  <text x="490" y="385" class="text">Entry B</text>
  <text x="490" y="415" class="small">坏行保留原始行号</text>
  <text x="490" y="460" class="small">新增条目，不覆盖旧正文</text>

  <rect x="840" y="155" width="285" height="340" class="rev" fill="#fff5e6" stroke="#e6a23c"/>
  <text x="875" y="205" class="head">Revision 3</text>
  <text x="875" y="240" class="text">memory / memory @ 3</text>
  <line x1="875" y1="265" x2="1090" y2="265" stroke="#f2c67a"/>
  <text x="875" y="310" class="text">Entry A v2</text>
  <text x="875" y="340" class="small">修订金额约定</text>
  <text x="875" y="385" class="text">Entry B</text>
  <text x="875" y="415" class="small">仍可沿用原版本</text>
  <text x="875" y="460" class="small">当前 head 指向 Revision 3</text>

  <path d="M355 325 C390 325 415 325 455 325" class="arrow"/>
  <path d="M740 325 C775 325 800 325 840 325" class="arrow"/>
  <text x="374" y="305" class="small">新增 Entry</text>
  <text x="758" y="305" class="small">修订 Entry</text>

  <rect x="170" y="545" width="860" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="205" y="579" class="text">精确引用：family + artifact_id + revision + entry_id + entry_version_id</text>
</svg>
