<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PowerContext 数据模型总览</title>
  <desc id="desc">Scope 包含 Source 和 Artifact，Artifact 包含 Entry 和 Revision，PreparedContext 为一次 Agent 请求提供临时上下文。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/></marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #172b4d; }
      .label { font: 700 20px sans-serif; fill: #172b4d; }
      .text { font: 16px sans-serif; fill: #344563; }
      .small { font: 14px sans-serif; fill: #52606d; }
      .box { stroke-width: 2; rx: 18; }
      .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f9fc"/>
  <text x="60" y="60" class="title">PowerContext 数据模型：从项目空间到一次 Agent 请求</text>

  <rect x="60" y="110" width="1080" height="560" class="box" fill="#e9f2ff" stroke="#4c8bf5"/>
  <text x="90" y="155" class="label">Scope：项目 / 隔离空间</text>
  <text x="90" y="184" class="text">决定数据属于哪个项目，所有读取和写入都带有 scope_id</text>

  <rect x="100" y="230" width="300" height="170" class="box" fill="#fff5e6" stroke="#e6a23c"/>
  <text x="130" y="275" class="label">Source</text>
  <text x="130" y="310" class="text">原始证据</text>
  <text x="130" y="340" class="small">文档、代码、工单、轨迹、</text>
  <text x="130" y="365" class="small">人工备注、任务结果</text>

  <rect x="455" y="210" width="365" height="245" class="box" fill="#e8f8ef" stroke="#35a66f"/>
  <text x="490" y="255" class="label">Artifact</text>
  <text x="490" y="287" class="text">可复用的上下文产物</text>
  <rect x="490" y="320" width="295" height="100" class="box" fill="#ffffff" stroke="#7bc99d"/>
  <text x="515" y="355" class="label" font-size="18">Memory Artifact</text>
  <text x="515" y="385" class="small">稳定 artifact_id + 不可变 revision</text>
  <text x="515" y="407" class="small">内部包含多个 Entry</text>

  <rect x="875" y="230" width="220" height="170" class="box" fill="#f3eefe" stroke="#8b6fd6"/>
  <text x="910" y="275" class="label">Entry</text>
  <text x="910" y="310" class="text">一条具体记忆</text>
  <text x="910" y="345" class="small">amount 用整数分</text>
  <text x="910" y="370" class="small">坏行保留行号</text>

  <path d="M400 315 C420 315 430 315 455 315" class="arrow"/>
  <text x="405" y="295" class="small">加工 / 整理</text>
  <path d="M820 315 C840 315 850 315 875 315" class="arrow"/>
  <text x="825" y="295" class="small">包含</text>

  <rect x="220" y="505" width="410" height="120" class="box" fill="#fff0f0" stroke="#dd6b7a"/>
  <text x="250" y="550" class="label">PreparedContext</text>
  <text x="250" y="582" class="text">按 query 和字节预算临时组装</text>
  <text x="250" y="607" class="small">只服务于当前 Agent turn，不是新的长期记录</text>

  <rect x="730" y="505" width="300" height="120" class="box" fill="#edf7fa" stroke="#3aa6b9"/>
  <text x="770" y="550" class="label">Agent 请求</text>
  <text x="770" y="582" class="text">system + context + user</text>
  <text x="770" y="607" class="small">模型是否采用需单独验证</text>

  <path d="M640 455 C600 480 560 490 500 505" class="arrow"/>
  <text x="540" y="475" class="small">召回</text>
  <path d="M630 565 C670 565 690 565 730 565" class="arrow"/>
  <text x="650" y="545" class="small">注入消息</text>

  <text x="90" y="710" class="small">Source 是证据；Artifact 是产物；PreparedContext 是一次请求的临时视图。</text>
</svg>
