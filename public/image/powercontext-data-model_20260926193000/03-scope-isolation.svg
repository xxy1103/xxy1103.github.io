<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Scope 隔离与显式共享</title><desc id="desc">两个 Scope 各自拥有 Memory，父子关系不自动继承，显式 context references 才表示共享。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#64748b"/></marker><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#172033}.h{font-size:20px;font-weight:700}.p{font-size:15px}.box{stroke-width:2;rx:16;ry:16}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#9333ea;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1100" height="430" fill="#f8fafc"/><text x="48" y="45" class="h">Scope 是选择上下文的边界</text>
<rect x="70" y="95" width="380" height="250" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="105" y="140" class="h">Scope A · 国内订单</text><text x="105" y="180" class="p">currency: CNY</text><text x="105" y="215" class="p">金额单位：人民币分</text><text x="105" y="275" class="p">查询 currency → 只看到 A 的 Entry</text>
<rect x="650" y="95" width="380" height="250" class="box" fill="#fef3c7" stroke="#d97706"/><text x="685" y="140" class="h">Scope B · 海外订单</text><text x="685" y="180" class="p">currency: USD</text><text x="685" y="215" class="p">金额单位：美分</text><text x="685" y="275" class="p">查询 currency → 只看到 B 的 Entry</text>
<path d="M450 205 L650 205" class="line"/><text x="495" y="185" class="p">同名关键词也不串台</text>
<rect x="345" y="365" width="410" height="42" class="box" fill="#f3e8ff" stroke="#9333ea"/><text x="380" y="392" class="p">父子关系只表达组织；context_references 才表达显式复用</text>
<path d="M260 345 L400 365" class="dash"/><path d="M840 345 L700 365" class="dash"/>
</svg>
