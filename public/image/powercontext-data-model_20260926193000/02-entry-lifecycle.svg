<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Entry 与 Artifact 生命周期</title><desc id="desc">记忆条目从新增到修订或停用，Artifact revision 单调增加，旧版本保留。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#64748b"/></marker><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#172033}.h{font-size:19px;font-weight:700}.p{font-size:14px}.box{stroke-width:2;rx:14;ry:14}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1100" height="360" fill="#f8fafc"/>
<text x="45" y="42" class="h">写入与变更：身份连续，版本前进</text>
<rect x="45" y="100" width="190" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="80" y="140" class="h">新增 Entry</text><text x="80" y="170" class="p">entry_id = E1</text><text x="80" y="192" class="p">Artifact revision = 1</text>
<rect x="315" y="100" width="190" height="110" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="350" y="140" class="h">修订 Entry</text><text x="350" y="170" class="p">仍是 E1</text><text x="350" y="192" class="p">entry_version_id 变新</text>
<rect x="585" y="100" width="190" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="620" y="140" class="h">并发检查</text><text x="620" y="170" class="p">带 citation 写入</text><text x="620" y="192" class="p">旧 citation → 409</text>
<rect x="855" y="70" width="200" height="90" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="890" y="110" class="h">停用</text><text x="890" y="138" class="p">退出 active recall</text>
<rect x="855" y="190" width="200" height="90" class="box" fill="#f3e8ff" stroke="#9333ea"/><text x="890" y="230" class="h">历史仍在</text><text x="890" y="258" class="p">精确 revision 可读取</text>
<path d="M235 155 L315 155" class="line"/><path d="M505 155 L585 155" class="line"/><path d="M775 135 L855 115" class="line"/><path d="M775 175 L855 235" class="line"/>
</svg>
