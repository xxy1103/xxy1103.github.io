<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">Video Result Agent 总览</title>
  <desc id="desc">视频预处理后由三步模型判断视频是否直接展示答案，多轮投票后将建议交给 Solver。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>
      .title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.node-title{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.node-text{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.badge{font:700 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="690" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Video Result Agent：先判断视频能不能直接回答，再让 Solver 决定</text>
  <text x="56" y="88" class="subtitle">蓝色是输入准备，紫色是模型判断，绿色是最终解题；预判结果始终只是建议。</text>
  <rect x="42" y="126" width="1196" height="176" rx="20" fill="#fff" opacity=".9"/>
  <text x="64" y="158" class="lane">视频输入准备</text>
  <rect x="116" y="175" width="208" height="92" rx="16" fill="#e6effb" filter="url(#shadow)"/>
  <circle cx="140" cy="199" r="14" fill="#356aa0"/><text x="136" y="204" class="badge">1</text><text x="166" y="204" class="node-title">原始任务</text><text x="140" y="232" class="node-text">question · knowledge</text><text x="140" y="253" class="node-text">briefing.mp4</text>
  <path d="M324 221H386" class="arrow"/>
  <rect x="388" y="175" width="232" height="92" rx="16" fill="#e6effb" filter="url(#shadow)"/>
  <circle cx="412" cy="199" r="14" fill="#356aa0"/><text x="408" y="204" class="badge">2</text><text x="438" y="204" class="node-title">视频离散化</text><text x="412" y="232" class="node-text">稳定帧 · ASR 旁白</text><text x="412" y="253" class="node-text">Hiccup 版面树</text>
  <path d="M620 221H682" class="arrow"/>
  <rect x="684" y="175" width="260" height="92" rx="16" fill="#e8f1fb" filter="url(#shadow)"/>
  <circle cx="708" cy="199" r="14" fill="#356aa0"/><text x="704" y="204" class="badge">3</text><text x="734" y="204" class="node-title">多模态时间线</text><text x="708" y="232" class="node-text">帧图 → 版面 → 对应旁白</text><text x="708" y="253" class="node-text">保留时间与幻灯片编号</text>
  <path d="M944 221H1006" class="arrow"/>
  <rect x="1008" y="175" width="176" height="92" rx="16" fill="#eef3f9" filter="url(#shadow)"/>
  <text x="1032" y="207" class="node-title">结构化侧信息</text><text x="1032" y="235" class="node-text">schema 预览</text><text x="1032" y="256" class="node-text">字段与单位</text>
  <rect x="42" y="330" width="1196" height="168" rx="20" fill="#fff" opacity=".9"/>
  <text x="64" y="362" class="lane">独立预判</text>
  <rect x="160" y="378" width="220" height="86" rx="16" fill="#f0eafb" filter="url(#shadow)"/><text x="190" y="410" class="node-title">EXTRACT</text><text x="190" y="438" class="node-text">视频是否直接展示答案？</text>
  <path d="M380 421H448" class="arrow"/>
  <rect x="450" y="378" width="220" height="86" rx="16" fill="#f0eafb" filter="url(#shadow)"/><text x="480" y="410" class="node-title">ALIGN</text><text x="480" y="438" class="node-text">列、单位、格式是否一致？</text>
  <path d="M670 421H738" class="arrow"/>
  <rect x="740" y="378" width="220" height="86" rx="16" fill="#f0eafb" filter="url(#shadow)"/><text x="770" y="410" class="node-title">DECIDE</text><text x="770" y="438" class="node-text">采用、复核还是重算？</text>
  <path d="M960 421H1028" class="arrow"/>
  <rect x="1030" y="378" width="154" height="86" rx="16" fill="#f2eafd" filter="url(#shadow)"/><text x="1058" y="410" class="node-title">5 轮投票</text><text x="1058" y="438" class="node-text">多数票汇总</text>
  <path d="M1107 464V532" class="arrow"/>
  <rect x="794" y="540" width="390" height="94" rx="18" fill="#dff3e8" stroke="#4b936d" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="824" y="575" class="node-title">Solver 拥有最终决定权</text><text x="824" y="604" class="node-text">核对视频与结构化数据，最终生成 prediction.csv</text>
  <text x="56" y="663" class="subtitle">边界：Video Result Agent 不执行 SQL、不读取 Gold、不写最终答案文件。</text>
</svg>
