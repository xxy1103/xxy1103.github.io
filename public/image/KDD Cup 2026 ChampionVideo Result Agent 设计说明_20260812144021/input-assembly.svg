<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Video Result Agent 输入装配</title>
  <desc id="desc">题目、知识、结构化 schema 与视频帧、版面和旁白被分阶段提供给三个判断步骤。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617793"/></marker>
    <style>.h1{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#27445f}.arrow{stroke:#617793;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="650" rx="24" fill="#f4f7fb"/>
  <text x="52" y="58" class="h1">同一任务，三步只接收各自需要的信息</text>
  <text x="52" y="87" class="body">视频事实集中交给 EXTRACT；结构化字段和单位从 ALIGN 开始加入，避免第一步被 SQL 思路带偏。</text>
  <rect x="52" y="126" width="330" height="410" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="80" y="165" class="h2">任务材料</text>
  <rect x="80" y="192" width="274" height="60" rx="12" fill="#e8f1fb"/><text x="100" y="218" class="code">task.json → question</text><text x="100" y="239" class="small">三步都使用</text>
  <rect x="80" y="268" width="274" height="112" rx="12" fill="#f2eafd"/><text x="100" y="294" class="code">video_input.json</text><text x="100" y="320" class="body">稳定帧 PNG</text><text x="100" y="343" class="body">Hiccup 版面树</text><text x="100" y="366" class="body">带时间戳旁白</text>
  <rect x="80" y="396" width="274" height="104" rx="12" fill="#eef3f9"/><text x="100" y="423" class="code">knowledge.md</text><text x="100" y="449" class="code">csv / json / db schema</text><text x="100" y="477" class="small">不包含 context/doc</text>
  <path d="M382 330H452" class="arrow"/>
  <rect x="454" y="126" width="360" height="410" rx="20" fill="#f0eafb" stroke="#a98ac8" stroke-width="2" filter="url(#shadow)"/>
  <text x="482" y="165" class="h2">按步骤装配消息</text>
  <rect x="482" y="192" width="304" height="84" rx="12" fill="#fff" opacity=".92"/><text x="504" y="219" class="h2">Step 1 · EXTRACT</text><text x="504" y="246" class="body">question + 帧图 + 版面 + 旁白</text>
  <rect x="482" y="294" width="304" height="94" rx="12" fill="#fff" opacity=".92"/><text x="504" y="321" class="h2">Step 2 · ALIGN</text><text x="504" y="348" class="body">question + 候选值 + knowledge</text><text x="504" y="371" class="body">+ 完整 schema 预览</text>
  <rect x="482" y="406" width="304" height="94" rx="12" fill="#fff" opacity=".92"/><text x="504" y="433" class="h2">Step 3 · DECIDE</text><text x="504" y="460" class="body">question + 前两步结果</text><text x="504" y="483" class="body">+ schema 前 6,000 字符</text>
  <path d="M814 330H884" class="arrow"/>
  <rect x="886" y="126" width="342" height="410" rx="20" fill="#e6f2fb" stroke="#7da5c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="914" y="165" class="h2">信息边界</text>
  <text x="914" y="211" class="body">✓ 图片与版面是视觉事实来源</text><text x="914" y="244" class="body">✓ 旁白用于解释与辅助定位</text><text x="914" y="277" class="body">✓ schema 用于列和单位对齐</text><text x="914" y="310" class="body">✓ 每步输出固定 JSON schema</text>
  <rect x="914" y="344" width="286" height="130" rx="14" fill="#fff" opacity=".9"/><text x="936" y="375" class="body">不会输入：</text><text x="958" y="405" class="code">gold.csv</text><text x="958" y="433" class="code">prediction.csv</text><text x="958" y="461" class="code">context/doc/*</text>
  <rect x="52" y="578" width="1176" height="42" rx="12" fill="#e8eef6"/><text x="75" y="604" class="body">关键收益：先判断“画面有没有答案”，再谈字段和单位；每一步只解决一个窄问题。</text>
</svg>
