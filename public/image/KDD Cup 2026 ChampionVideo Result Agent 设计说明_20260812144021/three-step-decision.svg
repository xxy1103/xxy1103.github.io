<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Video Result Agent 三步判断</title>
  <desc id="desc">从视频答案抽取、字段单位对齐到最终三选一决策，并展示提前重算分支。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.node-title{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.node-text{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.label{font:700 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#8195ad;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="760" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" class="title">三步判断：先确认“看到了什么”，再决定“该怎么用”</text>
  <text x="56" y="88" class="subtitle">每一步输出固定结构；第一步未发现完整答案时，直接走重算分支。</text>
  <rect x="70" y="140" width="310" height="254" rx="20" fill="#f0eafb" filter="url(#shadow)"/>
  <rect x="94" y="164" width="98" height="28" rx="14" fill="#7655a6"/><text x="114" y="184" class="label">Step 1</text>
  <text x="94" y="230" class="node-title">EXTRACT · 抽取</text><text x="94" y="264" class="node-text">识别题目目标形态与当前作用域</text><text x="94" y="292" class="node-text">跨帧按排名 / 行号 / ID 拼接</text><text x="94" y="320" class="node-text">排除旧批次、邻表和单位诱饵</text><text x="94" y="348" class="node-text">检查全部字段与全部行是否完整</text>
  <path d="M380 267H460" class="arrow"/>
  <text x="404" y="250" class="small">true</text>
  <rect x="462" y="140" width="310" height="254" rx="20" fill="#f0eafb" filter="url(#shadow)"/>
  <rect x="486" y="164" width="98" height="28" rx="14" fill="#7655a6"/><text x="506" y="184" class="label">Step 2</text>
  <text x="486" y="230" class="node-title">ALIGN · 对齐</text><text x="486" y="264" class="node-text">对应真实目标输出列</text><text x="486" y="292" class="node-text">核对 knowledge 中的业务口径</text><text x="486" y="320" class="node-text">检查亿元 / 百万元 / 百分比等单位</text><text x="486" y="348" class="node-text">必要时生成归一化候选值</text>
  <path d="M772 267H852" class="arrow"/>
  <rect x="854" y="140" width="356" height="254" rx="20" fill="#f0eafb" filter="url(#shadow)"/>
  <rect x="878" y="164" width="98" height="28" rx="14" fill="#7655a6"/><text x="898" y="184" class="label">Step 3</text>
  <text x="878" y="230" class="node-title">DECIDE · 决策</text><text x="878" y="264" class="node-text">答案完整、明确、口径一致？</text><text x="878" y="292" class="node-text">多行或跨帧是否值得 SQL 复核？</text><text x="878" y="320" class="node-text">单位不一致能否可靠归一？</text><text x="878" y="348" class="node-text">输出 decision · confidence · reason</text>
  <path d="M225 394V488" class="dash"/>
  <text x="238" y="446" class="small">false：只见规则 / 答案残缺</text>
  <rect x="70" y="500" width="310" height="118" rx="18" fill="#fff1df" stroke="#c69a5c" stroke-width="2" filter="url(#shadow)"/><text x="98" y="539" class="node-title">RECOMPUTE</text><text x="98" y="569" class="node-text">不要抄视频值，按规则回表计算</text><text x="98" y="593" class="small">Step 1 为 false 时直接到达</text>
  <path d="M1032 394V448H584V488" class="arrow"/>
  <path d="M1032 448H1018V488" class="arrow"/>
  <rect x="450" y="500" width="270" height="118" rx="18" fill="#dff3e8" stroke="#4b936d" stroke-width="2" filter="url(#shadow)"/><text x="478" y="539" class="node-title">ADOPT</text><text x="478" y="569" class="node-text">视频答案完整且明确</text><text x="478" y="593" class="small">可直接交给 Solver 使用</text>
  <rect x="760" y="500" width="340" height="118" rx="18" fill="#e6f2fb" stroke="#6f9bc3" stroke-width="2" filter="url(#shadow)"/><text x="788" y="539" class="node-title">ADOPT_AND_VERIFY</text><text x="788" y="569" class="node-text">先采纳，再用结构化 SQL 低成本复核</text><text x="788" y="593" class="small">适合多行、跨帧或轻微不确定场景</text>
  <rect x="70" y="672" width="1140" height="42" rx="12" fill="#e8eef6"/><text x="94" y="698" class="node-text">三种结果都是给 Solver 的建议，而不是强制执行命令；Solver 可以根据原始证据改判。</text>
</svg>
