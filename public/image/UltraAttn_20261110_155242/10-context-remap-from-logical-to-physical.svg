<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff;font-size:26px}.c{text-anchor:middle;dominant-baseline:central}.m{dominant-baseline:central}.s{font-size:19px;fill:#64748b}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="60" class="t">Context Remap：同样 16 个 Chunk，换一种分给节点的办法</text>
<text x="60" y="100">示意：按论文 Figure 4 的设定，序列分成 16 个 Chunk，节点层 CP = 4。颜色只表示 Chunk 归哪个节点，不表示哪些 Block 有效。</text>
<text x="128" y="190" class="h">默认：均匀顺序切分，φ(t_i) = ⌊i·CP / S⌋</text>
<rect x="128" y="230" width="80" height="70" rx="8" fill="#2563eb"/><text x="168" y="265" class="c w">0</text><rect x="212" y="230" width="80" height="70" rx="8" fill="#2563eb"/><text x="252" y="265" class="c w">1</text><rect x="296" y="230" width="80" height="70" rx="8" fill="#2563eb"/><text x="336" y="265" class="c w">2</text><rect x="380" y="230" width="80" height="70" rx="8" fill="#2563eb"/><text x="420" y="265" class="c w">3</text><rect x="464" y="230" width="80" height="70" rx="8" fill="#ea580c"/><text x="504" y="265" class="c w">4</text><rect x="548" y="230" width="80" height="70" rx="8" fill="#ea580c"/><text x="588" y="265" class="c w">5</text><rect x="632" y="230" width="80" height="70" rx="8" fill="#ea580c"/><text x="672" y="265" class="c w">6</text><rect x="716" y="230" width="80" height="70" rx="8" fill="#ea580c"/><text x="756" y="265" class="c w">7</text><rect x="800" y="230" width="80" height="70" rx="8" fill="#7c3aed"/><text x="840" y="265" class="c w">8</text><rect x="884" y="230" width="80" height="70" rx="8" fill="#7c3aed"/><text x="924" y="265" class="c w">9</text><rect x="968" y="230" width="80" height="70" rx="8" fill="#7c3aed"/><text x="1008" y="265" class="c w">10</text><rect x="1052" y="230" width="80" height="70" rx="8" fill="#7c3aed"/><text x="1092" y="265" class="c w">11</text><rect x="1136" y="230" width="80" height="70" rx="8" fill="#059669"/><text x="1176" y="265" class="c w">12</text><rect x="1220" y="230" width="80" height="70" rx="8" fill="#059669"/><text x="1260" y="265" class="c w">13</text><rect x="1304" y="230" width="80" height="70" rx="8" fill="#059669"/><text x="1344" y="265" class="c w">14</text><rect x="1388" y="230" width="80" height="70" rx="8" fill="#059669"/><text x="1428" y="265" class="c w">15</text>
<text x="128" y="325" class="s">节点 0 得到 Chunk 0 到 3，节点 1 得到 4 到 7，节点 2 得到 8 到 11，节点 3 得到 12 到 15</text>
<text x="128" y="430" class="h">重映射：φ(t_i) = ⌊i·16 / S⌋ mod 4</text>
<rect x="128" y="470" width="80" height="70" rx="8" fill="#2563eb"/><text x="168" y="505" class="c w">0</text><rect x="212" y="470" width="80" height="70" rx="8" fill="#ea580c"/><text x="252" y="505" class="c w">1</text><rect x="296" y="470" width="80" height="70" rx="8" fill="#7c3aed"/><text x="336" y="505" class="c w">2</text><rect x="380" y="470" width="80" height="70" rx="8" fill="#059669"/><text x="420" y="505" class="c w">3</text><rect x="464" y="470" width="80" height="70" rx="8" fill="#2563eb"/><text x="504" y="505" class="c w">4</text><rect x="548" y="470" width="80" height="70" rx="8" fill="#ea580c"/><text x="588" y="505" class="c w">5</text><rect x="632" y="470" width="80" height="70" rx="8" fill="#7c3aed"/><text x="672" y="505" class="c w">6</text><rect x="716" y="470" width="80" height="70" rx="8" fill="#059669"/><text x="756" y="505" class="c w">7</text><rect x="800" y="470" width="80" height="70" rx="8" fill="#2563eb"/><text x="840" y="505" class="c w">8</text><rect x="884" y="470" width="80" height="70" rx="8" fill="#ea580c"/><text x="924" y="505" class="c w">9</text><rect x="968" y="470" width="80" height="70" rx="8" fill="#7c3aed"/><text x="1008" y="505" class="c w">10</text><rect x="1052" y="470" width="80" height="70" rx="8" fill="#059669"/><text x="1092" y="505" class="c w">11</text><rect x="1136" y="470" width="80" height="70" rx="8" fill="#2563eb"/><text x="1176" y="505" class="c w">12</text><rect x="1220" y="470" width="80" height="70" rx="8" fill="#ea580c"/><text x="1260" y="505" class="c w">13</text><rect x="1304" y="470" width="80" height="70" rx="8" fill="#7c3aed"/><text x="1344" y="505" class="c w">14</text><rect x="1388" y="470" width="80" height="70" rx="8" fill="#059669"/><text x="1428" y="505" class="c w">15</text>
<text x="128" y="565" class="s">节点 0 得到 Chunk 0、4、8、12，节点 1 得到 1、5、9、13，节点 2 得到 2、6、10、14，节点 3 得到 3、7、11、15</text>
<rect x="128" y="640" width="36" height="36" rx="6" fill="#2563eb"/><text x="176" y="659" class="m">节点 0</text><rect x="428" y="640" width="36" height="36" rx="6" fill="#ea580c"/><text x="476" y="659" class="m">节点 1</text><rect x="728" y="640" width="36" height="36" rx="6" fill="#7c3aed"/><text x="776" y="659" class="m">节点 2</text><rect x="1028" y="640" width="36" height="36" rx="6" fill="#059669"/><text x="1076" y="659" class="m">节点 3</text>
<text x="128" y="715" class="s">格子里的数字是 Chunk 在原序列中的位置，两条色带的 Chunk 总数和每个节点的 Chunk 数相同，变的是谁拿到哪几个。</text>
<rect x="60" y="770" width="1480" height="90" rx="14" fill="#0f172a"/>
<text x="800" y="815" class="c w" style="font-size:26px">Context Remap 只改 Token 的初始归属，后面的 Node 层和 Device 层在新布局上重新找切分</text>
</svg>
