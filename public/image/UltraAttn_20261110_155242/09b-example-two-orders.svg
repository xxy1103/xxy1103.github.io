<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><marker id="arR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#dc2626"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.m{dominant-baseline:central}.s{font-size:19px;fill:#64748b}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="40" y="45" class="t">同样的 Kernel，只换接收顺序，整图结束时间差 10 μs</text>
<text x="40" y="82" style="font-size:20px">示意：耗时为构造数字，非论文数据。计算只有一个 Stream，A1 和 A2 不能同时算。</text>
<text x="40" y="108" style="font-size:20px">下排取 A2 先于 A1，因为反过来整图要到 70 μs。</text>
