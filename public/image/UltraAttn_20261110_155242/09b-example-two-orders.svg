ll="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="306.6666666666667" y="288" class="c b">A0</text><rect x="413.33333333333337" y="265" width="426.66666666666663" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="626.6666666666667" y="288" class="c b">A1</text><rect x="840" y="265" width="213.33333333333348" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="946.6666666666667" y="288" class="c b">A2</text><rect x="1053.3333333333335" y="345" width="213.33333333333326" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1160" y="368" class="c b">O3</text><path d="M1266.6666666666667,175 L1266.6666666666667,412" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/><text x="1276.6666666666667" y="198" style="fill:#dc2626;font-weight:700">整图结束 50 μs</text><path d="M413.33333333333337,231 L413.33333333333337,265" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)" fill="none"/><text x="423.33333333333337" y="253" class="s" style="fill:#dc2626">KV3 在 10 到达，A1 马上开始</text><path d="M840,231 L840,265" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)" fill="none"/><text x="850" y="253" class="s" style="fill:#dc2626">Q3 在 30 到达，A2 开始</text><rect x="40" y="460" width="1520" height="330" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="496" class="h">先收 Q3（Order = 1）</text><text x="70" y="548" class="m b">Recv</text><text x="70" y="628" class="m b">Comp</text><text x="70" y="708" class="m b">Send</text><path d="M200,520 L200,750" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 6"/><text x="200" y="772" class="s" text-anchor="middle">0</text><path d="M413.33333333333337,520 L413.33333333333337,750" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 6"/><text x="413.33333333333337" y="772" class="s" text-anchor="middle">10</text><path d="M626.6666666666667,520 L626.6666666666667,750" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray=