<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.s{font-size:19px;fill:#64748b}.m{dominant-baseline:central}.red{fill:#dc2626;font-weight:700}</style></defs><rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="60" class="t">一个分配方案：谁算哪个 Block，因此需要哪些 Chunk</text>
<text x="60" y="100">示意例子：P=CP=4，第 i 个 Chunk 初始在 GPU i，7 个有效 Block；分配方案为构造，非论文结果。</text>
<rect x="50" y="140" width="430" height="700" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="74" y="182" class="h">x：Block 的归属</text><text x="180" y="248" class="c b">KV0</text><text x="260" y="248" class="c b">KV1</text><text x="340" y="248" class="c b">KV2</text><text x="420" y="248" class="c b">KV3</text><text x="106" y="310" class="c b">Q0</text><rect x="143" y="273" width="74" height="74" rx="8" fill="#2563eb"/><text x="180" y="310" class="c w">G0</text><rect x="223" y="273" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="303" y="273" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="383" y="273" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="106" y="390" class="c b">Q1</text><rect x="143" y="353" width="74" height="74" rx="8" fill="#2563eb"/><text x="180" y="390" class="c w">G0</text><rect x="223" y="353" width="74" height="74" rx="8" fill="#ea580c"/><text x="260" y="390" class="c w">G1</text><rect x="303" y="353" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="383" y="353" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="106" y="470" class="c b">Q2</text><rect x="143" y="433" width="74" height="74" rx="8" fill="#7c3aed"/><text x="180" y="470" class="c w">G2</text><rect x="223" y="433" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="303" y="433" width="74" height="74" rx="8" fill="#ea580c"/><text x="340" y="470" class="c w">G1</text><rect x="383" y="433" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="106" y="550" class="c b">Q3</text><rect x="143" y="513" width="74" height="74" rx="8" fill="#7c3aed"/><text x="180" y="550" class="c w">G2</text><rect x="223" y="513" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="303" y="513" width="74" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="383" y="513" width="74" height="74" rx="8" fill="#059669"/><text x="420" y="550" class="c w">G3</text><text x="74" y="650" class="s">行：Q 的 Chunk　列：KV 的 Chunk</text><text x="74" y="682" class="s">虚线格为 Empty Block，不参与分配</text><text x="74" y="714" class="s">每个有效 Block 只属于一张 GPU</text>
<text x="74" y="770" class="b">共 7 个有效 Block，</text><text x="74" y="802" class="b">每卡 2、2、2、1 个</text><rect x="505" y="140" width="510" height="330" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="505" y="140" width="510" height="56" rx="18" fill="#2563eb"/><rect x="505" y="170" width="510" height="26" fill="#2563eb"/><text x="527" y="169" class="m w" style="font-size:26px">GPU0</text><text x="993" y="169" class="m w" style="text-anchor:end;font-size:20px">本地：Q0、KV0</text><text x="527" y="238" class="b m">算 Block</text><text x="527" y="306" class="b m">需要 Q</text><text x="527" y="374" class="b m">需要 KV</text><rect x="635" y="218" width="86" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="678" y="238" class="c w" style="font-size:20px">B0,0</text><rect x="735" y="218" width="86" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="778" y="238" class="c w" style="font-size:20px">B1,0</text><rect x="635" y="286" width="120" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="695" y="306" class="c w" style="font-size:20px">Q0 本地</text><rect x="765" y="286" width="120" height="40" rx="8" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="825" y="306" class="c red" style="font-size:20px">Q1 ←G1</text><rect x="635" y="354" width="120" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="695" y="374" class="c w" style="font-size:20px">KV0 本地</text><line x1="527" y1="414" x2="993" y2="414" stroke="#e2e8f0" stroke-width="2"/><text x="527" y="442" class="m" style="font-size:20px">远端 Q：1 份（A=1）　远端 KV：0 份（B=0）</text><rect x="1035" y="140" width="510" height="330" rx="18" fill="#fff" stroke="#ea580c" stroke-width="3"/><rect x="1035" y="140" width="510" height="56" rx="18" fill="#ea580c"/><rect x="1035" y="170" width="510" height="26" fill="#ea580c"/><text x="1057" y="169" class="m w" style="font-size:26px">GPU1</text><text x="1523" y="169" class="m w" sty