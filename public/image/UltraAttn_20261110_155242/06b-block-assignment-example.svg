20px">KV3 本地</text><line x1="1057" y1="784" x2="1523" y2="784" stroke="#e2e8f0" stroke-width="2"/><text x="1057" y="812" class="m" style="font-size:20px">远端 Q：0 份（A=0）　远端 KV：0 份（B=0）</text><text x="505" y="872" class="s">实心＝本地已有　红框＝需从箭头所指的 GPU 取　（H、V 只记录“需要”，不是传输次数）</text></svg>
