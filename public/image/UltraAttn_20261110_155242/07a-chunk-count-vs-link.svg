<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#334155"/></marker><marker id="arR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#dc2626"/></marker><marker id="arB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#2563eb"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.s{font-size:19px;fill:#64748b}.m{dominant-baseline:central}.red{fill:#dc2626;font-weight:700}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="60" class="t">只数 Chunk 的账，看不出链路差别</text><text x="60" y="100">示意：两个 Node，每个 2 张 GPU；两种方案按第四章的记账方式 MCV 都是 4，但走的链路不同。</text><rect x="60" y="140" width="710" height="560" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="182" class="h">方案甲：4 个 Chunk 都在节点内传</text><rect x="90" y="230" width="300" height="230" rx="16" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="108" y="258" class="b m">Node 0</text><circle cx="170" cy="370" r="28" fill="#2563eb"/><text x="170" y="370" class="c w">G0</text><circle cx="310" cy="370" r="28" fill="#2563eb"/><text x="310" y="370" class="c w">G1</text><rect x="440" y="230" width="300" height="230" rx="16" fill="#fff" stroke="#059669" stroke-width="3"/><text x="458" y="258" class="b m">Node 1</text><circle cx="520" cy="370" r="28" fill="#059669"/><text x="520" y="370" class="c w">G2</text><circle cx="660" cy="370" r="28" fill="#059669"/><text x="660" y="370" class="c w">G3</text><path d="M185 340 Q240 290 295 340" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arB)"/><text x="90" y="496" class="s">4 个 Chunk 走节点内链路（蓝色弧线，如 NVLink）</text><rect x="90" y="530" width="650" height="140" rx="12" fill="#f8fafc"/><text x="110" y="566" class="m">第四章的账：GPU0 发送 4 个 Chunk，MCV = 4</text><text x="110" y="608" class="m b">这 4 个 Chunk 只用节点内链路</text><text x="110" y="646" class="m s">账面上两个方案相同，实际代价不能直接比</text><rect x="830" y="140" width="710" height="560" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="854" y="182" class="h">方案乙：4 个 Chunk 要跨节点传</text><rect x="860" y="230" width="300" height="230" rx="16" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="878" y="258" class="b m">Node 0</text><circle cx="940" cy="370" r="28" fill="#2563eb"/><text x="940" y="370" class="c w">G0</text><circle cx="1080" cy="370" r="28" fill="#2563eb"/><text x="1080" y="370" class="c w">G1</text><rect x="1210" y="230" width="300" height="230" rx="16" fill="#fff" stroke="#059669" stroke-width="3"/><text x="1228" y="258" class="b m">Node 1</text><circle cx="1290" cy="370" r="28" fill="#059669"/><text x="1290" y="370" class="c w">G2</text><circle cx="1430" cy="370" r="28" fill="#059669"/><text x="1430" y="370" class="c w">G3</text><path d="M968 340 Q1130 215 1280 340" stroke="#dc2626" stroke-width="6" fill="none" marker-end="url(#arR)"/><text x="860" y="496" class="s">4 个 Chunk 经 NIC 和节点间网络（红色弧线）</text><rect x="860" y="530" width="650" height="140" rx="12" fill="#f8fafc"/><text x="880" y="566" class="m">第四章的账：GPU0 发送 4 个 Chunk，MCV = 4</text><text x="880" y="608" class="m red">这 4 个 Chunk 要过节点间链路</text><text x="880" y="646" class="m s">账面上两个方案相同，实际代价不能直接比</text><rect x="50" y="730" width="1500" height="130" rx="18" fill="#0f172a"/><text x="80" y="776" class="w">Chunk 数只有在“每个 Chunk 的传输代价大致相同”时才能代替通信开销。</text><text x="80" y="820" class="w">节点内和节点间的带宽与路径不同，多节点集群不满足这个前提（论文称为网络异构）。</text></svg>
