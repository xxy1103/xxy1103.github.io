<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.s{font-size:19px;fill:#64748b}.g{fill:#059669;font-weight:700}.r{fill:#94a3b8}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="60" class="t">Order 取 1 或 0：哪一条不等式生效，哪一条被放松</text>
<text x="60" y="100">示意：Q3 耗时 20 μs，KV3 耗时 10 μs，共用输入带宽，取 u = Q3，v = KV3。数字是构造的，非论文数据。</text>
<rect x="60" y="140" width="720" height="620" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="820" y="140" width="720" height="620" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="182" class="h">Order = 1：Q3 先，KV3 后</text>
<text x="850" y="182" class="h">Order = 0：KV3 先，Q3 后</text>
<g stroke="#94a3b8" stroke-width="2"><path d="M100,330 L740,330"/><path d="M860,330 L1500,330"/></g>
<g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6"><path d="M100,230 L100,330"/><path d="M280,230 L280,330"/><path d="M460,230 L460,330"/><path d="M640,230 L640,330"/><path d="M860,230 L860,330"/><path d="M1040,230 L1040,330"/><path d="M1220,230 L1220,330"/><path d="M1400,230 L1400,330"/></g>
<g class="s" text-anchor="middle"><text x="100" y="355">0</text><text x="280" y="355">10</text><text x="460" y="355">20</text><text x="640" y="355">30</text><text x="860" y="355">0</text><text x="1040" y="355">10</text><text x="1220" y="355">20</text><text x="1400" y="355">30</text></g>
<text x="745" y="355" class="s">μs</text><text x="1505" y="355" class="s">μs</text>
<g fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"><rect x="100" y="250" width="360" height="56" rx="6"/><rect x="460" y="250" width="180" height="56" rx="6"/><rect x="860" y="250" width="180" height="56" rx="6"/><rect x="1040" y="250" width="360" height="56" rx="6"/></g>
<g class="c b"><text x="280" y="278" class="c b">Q3  S=0，D=20</text><text x="550" y="278" class="c b">KV3  S=20</text><text x="950" y="278" class="c b">KV3  S=0</text><text x="1220" y="278" class="c b">Q3  S=10，D=20</text></g>
<text x="90" y="410" class="b">两条不等式（u = Q3，v = KV3，U_b 取很大）</text>
<text x="850" y="410" class="b">两条不等式（u = Q3，v = KV3，U_b 取很大）</text>
<rect x="90" y="430" width="640" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
<text x="110" y="465" class="g">① 生效</text><text x="200" y="465">S_u + D_u ≤ S_v + (1 − 1)·U_b</text>
<text x="110" y="505">即 S_Q3 + 20 ≤ S_KV3，所以 KV3 在 20 之后开始</text>
<rect x="90" y="560" width="640" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="110" y="595" class="r">② 被放松</text><text x="230" y="595" class="r">S_v + D_v ≤ S_u + 1·U_b</text>
<text x="110" y="635" class="r">右边加上很大的 U_b，永远成立，不起限制</text>
<rect x="850" y="430" width="640" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="870" y="465" class="r">① 被放松</text><text x="990" y="465" class="r">S_u + D_u ≤ S_v + (1 − 0)·U_b</text>
<text x="870" y="505" class="r">右边加上很大的 U_b，永远成立，不起限制</text>
<rect x="850" y="560" width="640" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
<text x="870" y="595" class="g">② 生效</text><text x="960" y="595">S_v + D_v ≤ S_u + 0·U_b</text>
<text x="870" y="635">即 S_KV3 + 10 ≤ S_Q3，所以 Q3 在 10 之后开始</text>
<text x="90" y="715" class="s">取 1 时，整段输入通信在 30 μs 时结束。</text>
<text x="850" y="715" class="s">取 0 时，KV3 在 10 μs 时就到达，后面的计算能更早开始。</text>
<rect x="60" y="790" width="1480" height="80" rx="14" fill="#0f172a"/>
<text x="800" y="830" class="c w" style="font-size:26px">Order 不是规定谁先，而是让模型在两种先后里自己选，选完只剩一条真正约束</text>
</svg>
