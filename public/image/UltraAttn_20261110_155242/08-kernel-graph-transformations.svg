<g class="c"><text x="110" y="260" class="c b">Q3</text><text x="220" y="260" class="c b">KV3,0</text><text x="335" y="260" class="c b">KV3,1</text><text x="480" y="260" class="c b">Q3</text><text x="620" y="260" class="c b">KV3</text><text x="190" y="385" class="c b">B8</text><text x="310" y="385" class="c b">B9</text><text x="550" y="385" class="c b">A2</text><text x="250" y="500" class="c b">O3</text><text x="550" y="500" class="c b">O3</text></g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M125,285 L180,358"/><path d="M135,283 L290,358"/><path d="M215,287 L190,358"/><path d="M232,285 L290,358"/><path d="M325,287 L200,358"/><path d="M335,287 L305,358"/><path d="M190,412 L235,472"/><path d="M310,412 L265,472"/><path d="M490,286 L525,358"/><path d="M610,286 L575,358"/><path d="M550,412 L550,470"/></g>
<rect x="165" y="228" width="225" height="64" rx="32" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="135" y="345" width="230" height="80" rx="10" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
<text x="278" y="214" class="red" style="font-size:20px" text-anchor="middle">P2P 合并</text>
<text x="380" y="440" class="red">计算合并</text>
<path d="M395,380 L455,380" stroke="#2563eb" stroke-width="8" fill="none" marker-end="url(#arB)"/>
<rect x="90" y="570" width="660" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="110" y="605">合并后节点更少，单个 Kernel 更大。</text>
<text x="110" y="643">代价（读图推断）：A2 要等整个 KV3 到齐才能开始，</text>
<text x="110" y="681">合并前 KV3,0 和 KV3,1 可以分别到达，重叠空间更大。</text>
<rect x="800" y="140" width="740" height="600" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="830" y="182" class="h">Greedy Transformation Selection</text>
<g fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"><rect x="830" y="205" width="430" height="70" rx="10"/><rect x="830" y="305" width="430" height="70" rx="10"/><rect x="830" y="405" width="430" height="70" rx="10"/><rect x="830" y="505" width="430" height="70" rx="10"/><rect x="830" y="605" width="430" height="70" rx="10"/></g>
<g font-size="22"><text x="850" y="232" class="b">① 匹配候选</text><text x="850" y="260" class="s">三类模板在原图上做子图匹配</text>
<text x="850" y="332" class="b">② 按 Gain 从大到小取下一个</text><text x="850" y="360" class="s">Gain = 融合前耗时之和 − 融合后耗时</text>
<text x="850" y="432" class="b">③ 检查是否适用</text><text x="850" y="460" class="s">涉及的 Kernel 已被前面的变换改过，就跳过</text>
<text x="850" y="532" class="b">④ 应用到当前图，评估整图耗时</text><text x="850" y="560" class="s">交给 Topology-aware Lowering Engine</text>
<text x="850" y="632" class="b">⑤ 比较</text><text x="850" y="660" class="s">整图耗时比应用之前更短吗？</text></g>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar)"><path d="M1045,277 L1045,303"/><path d="M1045,377 L1045,403"/><path d="M1045,477 L1045,503"/><path d="M1045,577 L1045,603"/><path d="M1260,640 L1290,615"/><path d="M1260,640 L1290,665"/></g>
<rect x="1290" y="580" width="230" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
<text x="1405" y="610" class="c b" style="fill:#059669">更短：保留新图</text>
<rect x="1290" y="650" width="230" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="1405" y="680" class="c b" style="fill:#dc2626">没更短：退回旧图</text>
<path d="M1520,610 L1535,610 L1535,340 L1262,340" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1520,680 L1535,680 L1535,610" stroke="#334155" stroke-width="2.5" fill="none"/>
<text x="1290" y="318" class="s">继续取下一个变换</text>
<rect x="60" y="770" width="1480" height="90" rx="14" fill="#0f172a"/>
<text x="800" y="815" class="c w" style="font-size:26px">Gain 只决定尝试顺序，保留与否看整图耗时；贪心不保证全局最优</text>
</svg>
