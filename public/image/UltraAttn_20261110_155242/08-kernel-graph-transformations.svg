<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#334155"/></marker><marker id="arB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#2563eb"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.s{font-size:19px;fill:#64748b}.red{fill:#dc2626;font-weight:700}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="60" class="t">Kernel-Level：先合并，再用整图耗时决定留不留</text>
<text x="60" y="100">左：Figure 5(b) 中两类合并的简化画法。右：Greedy Transformation Selection 的流程。图中没有耗时数字。</text>
<rect x="60" y="140" width="720" height="600" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="182" class="h">合并前后的依赖图（结构取自 Figure 5(b)）</text>
<text x="100" y="215" class="s">合并前</text><text x="470" y="215" class="s">合并后</text>
<g fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"><ellipse cx="110" cy="260" rx="46" ry="26"/><ellipse cx="220" cy="260" rx="52" ry="26"/><ellipse cx="335" cy="260" rx="52" ry="26"/><ellipse cx="480" cy="260" rx="46" ry="26"/><ellipse cx="620" cy="260" rx="46" ry="26"/></g>
<g fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"><rect x="150" y="360" width="80" height="50" rx="6"/><rect x="270" y="360" width="80" height="50" rx="6"/><rect x="500" y="360" width="100" height="50" rx="6"/></g>
