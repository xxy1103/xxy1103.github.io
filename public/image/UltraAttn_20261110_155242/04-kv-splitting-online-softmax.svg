<text x="470" y="275" class="c m" font-size="22">本地 KV 分片</text>
<path d="M535 215H575" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="580" y="185" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/><text x="655" y="215" class="c m b" font-size="22">Attention</text>
