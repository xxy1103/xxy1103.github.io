<marker id="arR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#dc2626"/></marker>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle}.m{dominant-baseline:central}.red{fill:#dc2626;font-weight:700}</style>
</defs><rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="60" class="t">按 KV 切分：局部摘要 (m, ℓ, u) 通过 Online Softmax 合并</text>
<text x="60" y="100">同一个 Query Q<tspan dy="7" font-size="22">r</tspan> 面对三段 KV；局部 Softmax 结果不能直接相加，要带着摘要重新缩放。</text>
<text x="85" y="150" class="b">输入</text><text x="500" y="150" class="b">① 各 GPU 局部计算</text><text x="1020" y="150" class="b">② Online Softmax 归约</text>
<g filter="url(#sh)"><rect x="60" y="300" width="150" height="130" rx="14" fill="#2563eb"/></g><rect x="60" y="300" width="150" height="130" rx="14" fill="url(#grid)"/><text x="135" y="365" class="w c m" font-size="30">Q<tspan dy="7" font-size="22">r</tspan></text>
<text x="135" y="460" class="c">同一段 Query</text><text x="135" y="490" class="c">广播给 3 张卡</text><path d="M212 365C260 365 250 250 300 250" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#ar)"/>
<rect x="305" y="170" width="620" height="160" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/>
