<text x="842" y="236" class="c m">m<tspan dy="7" font-size="22">j</tspan> 最大值</text><text x="842" y="264" class="c m">ℓ<tspan dy="7" font-size="22">j</tspan> 分母</text><text x="842" y="292" class="c m">u<tspan dy="7" font-size="22">j</tspan> 加权和</text>
<path d="M912 250C1000 250 960 480 1010 480" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#ar)"/><path d="M212 365C260 365 250 440 300 440" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#ar)"/>
<rect x="305" y="360" width="620" height="160" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/>
<path d="M325 360H395V520H325Q305 520 305 500V380Q305 360 325 360Z" fill="url(#gD)"/>
<text x="350" y="425" class="w c m" font-size="24">GPU</text><text x="350" y="460" class="w c m" font-size="24">1</text>
<rect x="415" y="375" width="115" height="60" rx="14" fill="url(#gKV)"/><rect x="415" y="375" width="115" height="60" rx="14" fill="url(#grid)"/><text x="472.5" y="405" class="w c m" font-size="24">KV<tspan dy="7" font-size="22">1</tspan></text>
<text x="470" y="465" class="c m" font-size="22">本地 KV 分片</text>
<path d="M535 405H575" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="580" y="375" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/><text x="655" y="405" class="c m b" font-size="22">Attention</text>
<path d="M735 405H770" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="775" y="370" width="135" height="140" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
<text x="842" y="394" class="c m b" font-size="22">局部摘要</text>
<text x="842" y="426" class="c m">m<tspan dy="7" font-size="22">j</tspan> 最大值</text><text x="842" y="454" class="c m">ℓ<tspan dy="7" font-size="22">j</tspan> 分母</text><text x="842" y="482" class="c m">u<tspan dy="7" font-size="22">j</tspan> 加权和</text>
<path d="M912 440C1000 440 960 480 1010 480" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#ar)"/><path d="M212 365C260 365 250 630 300 630" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#ar)"/>
<rect x="305" y="550" width="620" height="160" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/>
<path d="M325 550H395V710H325Q305 710 305 690V570Q305 550 325 550Z" fill="url(#gD)"/>
<text x="350" y="615" class="w c m" font-size="24">GPU</text><text x="350" y="650" class="w c m" font-size="24">2</text>
<rect x="415" y="565" width="115" height="60" rx="14" fill="url(#gKV)"/><rect x="415" y="565" width="115" height="60" rx="14" fill="url(#grid)"/><text x="472.5" y="595" class="w c m" font-size="24">KV<tspan dy="7" font-size="22">2</tspan></text>
<text x="470" y="655" class="c m" font-size="22">本地 KV 分片</text>
<path d="M535 595H575" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="580" y="565" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/><text x="655" y="595" class="c m b" font-size="22">Attention</text>
<path d="M735 595H770" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="775" y="560" width="135" height="140" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
<text x="842" y="584" class="c m b" font-size="22">局部摘要</text>
<text x="842" y="616" class="c m">m<tspan dy="7" font-size="22">j</tspan> 最大值</text><text x="842" y="644" class="c m">ℓ<tspan dy="7" font-size="22">j</tspan> 分母</text><text x="842" y="672" class="c m">u<tspan dy="7" font-size="22">j</tspan> 加权和</text>
<path d="M912 630C1000 630 960 480 1010 480" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#ar)"/><rect x="1015" y="190" width="530" height="500" rx="24" fill="#fff" stroke="#10b981" stroke-width="3" filter="url(#sh)"/>
<text x="1280" y="235" class="c b" font-size="26">合并三份摘要</text>
<rect x="1045" y="260" width="470" height="70" rx="12" fill="#ecfdf5"/><text x="1280" y="288" class="c m b">全局最大值</text><text x="1280" y="316" class="c m">m = max( m₀, m₁, m₂ )</text>
<path d="M1280 332V355" stroke="#047857" stroke-width="4" marker-end="url(#arG)"/>
<rect x="1045" y="360" width="470" height="110" rx="12" fill="#ecfdf5"/><text x="1280" y="388" class="c m b">按 exp(mⱼ − m) 重新缩放</text><text x="1280" y="425" class="c m">ℓ = Σ exp(mⱼ − m)·ℓⱼ</text><text x="1280" y="455" class="c m">u = Σ exp(mⱼ − m)·uⱼ</text>
<path d="M1280 472V495" stroke="#047857" stroke-width="4" marker-end="url(#arG)"/>
<rect x="1045" y="500" width="470" height="70" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1280" y="535" class="c m b" font-size="28">o = u / ℓ</text>
<path d="M1280 572V600" stroke="#047857" stroke-width="4" marker-end="url(#arG)"/>
<g><rect x="1180" y="605" width="200" height="70" rx="14" fill="url(#gO)"/><rect x="1180" y="605" width="200" height="70" rx="14" fill="url(#grid)"/><text x="1280" y="640" class="w c m" font-size="26">O<tspan dy="7" font-size="22">r</tspan> 完整输出</text></g>
<rect x="60" y="715" width="1485" height="160" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/>
<text x="90" y="755" class="b">为什么不能直接平均？分数 [1, 2] 与 [3, 4] 各算一次 Softmax：</text>
<rect x="90" y="775" width="560" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="370" y="803" class="c m red">错误：局部概率 [0.27, 0.73] 与 [0.27, 0.73] 直接平均</text><text x="370" y="835" class="c m">两段的分母各不相同，丢失了 [3,4] 整体更大的事实</text>
<rect x="690" y="775" width="830" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="1105" y="803" class="c m b">正确：保留 mⱼ，合并时统一到全局最大值 m = 4</text><text x="1105" y="835" class="c m">[3,4] 的权重缩放系数为 1，[1,2] 为 exp(2−4)≈0.14</text>
