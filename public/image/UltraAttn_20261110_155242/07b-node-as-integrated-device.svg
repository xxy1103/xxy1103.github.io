<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#334155"/></marker><marker id="arR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#dc2626"/></marker><marker id="arB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#2563eb"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.s{font-size:19px;fill:#64748b}.m{dominant-baseline:central}.red{fill:#dc2626;font-weight:700}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="60" class="t">先把 Node 当成整体设备，再分到 GPU</text><text x="60" y="100">示意：4 个 Node，每个 8 张 GPU，共 32 张。</text><rect x="50" y="140" width="640" height="560" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="74" y="182" class="h">设备层视角：32 个独立设备</text><text x="74" y="260" class="b m">Node 0</text><circle cx="215" cy="260" r="22" fill="#2563eb"/><text x="215" y="260" class="c w" style="font-size:18px">0</text><circle cx="272" cy="260" r="22" fill="#2563eb"/><text x="272" y="260" class="c w" style="font-size:18px">1</text><circle cx="329" cy="260" r="22" fill="#2563eb"/><text x="329" y="260" class="c w" style="font-size:18px">2</text><circle cx="386" cy="260" r="22" fill="#2563eb"/><text x="386" y="260" class="c w" style="font-size:18px">3</text><circle cx="443" cy="260" r="22" fill="#2563eb"/><text x="443" y="260" class="c w" style="font-size:18px">4</text><circle cx="500" cy="260" r="22" fill="#2563eb"/><text x="500" y="260" class="c w" style="font-size:18px">5</text><circle cx="557" cy="260" r="22" fill="#2563eb"/><text x="557" y="260" class="c w" style="font-size:18px">6</text><circle cx="614" cy="260" r="22" fill="#2563eb"/><text x="614" y="260" class="c w" style="font-size:18px">7</text><text x="74" y="360" class="b m">Node 1</text><circle cx="215" cy="360" r="22" fill="#ea580c"/><text x="215" y="360" class="c w" style="font-size:18px">0</text><circle cx="272" cy="360" r="22" fill="#ea580c"/><text x="272" y="360" class="c w" style="font-size:18px">1</text><circle cx="329" cy="360" r="22" fill="#ea580c"/><text x="329" y="360" class="c w" style="font-size:18px">2</text><circle cx="386" cy="360" r="22" fill="#ea580c"/><text x="386" y="360" class="c w" style="font-size:18px">3</text><circle cx="443" cy="360" r="22" fill="#ea580c"/><text x="443" y="360" class="c w" style="font-size:18px">4</text><circle cx="500" cy="360" r="22" fill="#ea580c"/><text x="500" y="360" class="c w" style="font-size:18px">5</text><circle cx="557" cy="360" r="22" fill="#ea580c"/><text x="557" y="360" class="c w" style="font-size:18px">6</text><circle cx="614" cy="360" r="22" fill="#ea580c"/><text x="614" y="360" class="c w" style="font-size:18px">7</text><text x="74" y="460" class="b m">Node 2</text><circle cx="215" cy="460" r="22" fill="#7c3aed"/><text x="215" y="460" class="c w" style="font-size:18px">0</text><circle cx="272" cy="460" r="22" fill="#7c3aed"/><text x="272" y="460" class="c w" style="font-size:18px">1</text><circle cx="329" cy="460" r="22" fill="#7c3aed"/><text x="329" y="460" class="c w" style="font-size:18px">2</text><circle cx="386" cy="460" r="22" fill="#7c3aed"/><text x="386" y="460" class="c w" style="font-size:18px">3</text><circle cx="443" cy="460" r="22" fill="#7c3aed"/><text x="443" y="460" class="c w" style="font-size:18px">4</text><circle cx="500" cy="460" r="22" fill="#7c3aed"/><text x="500" y="460" class="c w" style="font-size:18px">5</text><circle cx="557" cy="460" r="22" fill="#7c3aed"/><text x="557" y="460" class="c w" style="font-size:18px">6</text><circle cx="614" cy="460" r="22" fill="#7c3aed"/><text x="614" y="460" class="c w" style="font-size:18px">7</text><text x="74" y="560" class="b m">Node 3</text><circle cx="215" cy="560" r="22" fill="#059669"/><text x="215" y="560" class="c w" style="font-size:18px">0</text><circle cx="272" cy="560" r="22" fill="#059669"/><text x="272" y="560" class="c w" style="font-size:18px">1</text><circle cx="329" cy="560" r="22" fill="#059669"/><text x="329" y="560" class="c w" style="font-size:18px">2</text><circle cx="386" cy="560" r="22" fill="#059669"/><text x="386" y="560" class="c w" style="font-size:18px">3</text><circle cx="443" cy="560" r="22" fill="#059669"/><text x="443" y="560" class="c w" style="font-size:18px">4</text><circle cx="500" cy="560" r="22" fill="#059669"/><text x="500" y="560" class="c w" style="font-size:18px">5</text><circle cx="557" cy="560" r="22" fill="#059669"/><text x="557" y="560" class="c w" style="font-size:18px">6</text><circle cx="614" cy="560" r="22" fill="#059669"/><text x="614" y="560" class="c w" style="font-size:18px">7</text><text x="74" y="660" class="s">要同时处理所有 GPU 之间的通信关系</text><line x1="690" y1="420" x2="760" y2="420" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/><rect x="760" y="140" width="790" height="560" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="784" y="182" class="h">第一层：4 个整体设备，只决定谁负责哪部分工作</text><rect x="790" y="215" width="165" height="100" rx="14" fill="#2563eb"/><text x="872" y="250" class="c w">Node 0</text><text x="872" y="284" class="c w" style="font-size:18px">8 GPUs</text><rect x="975" y="215" width="165" height="100" rx="14" fill="#ea580c"/><text x="1057" y="250" class="c w">Node 1</text><text x="1057" y="284" class="c w" style="font-size:18px">8 GPUs</text><rect x="1160" y="215" width="165" height="100" rx="14" fill="#7c3aed"/><text x="1242" y="250" class="c w">Node 2</text><text x="1242" y="284" class="c w" style="font-size:18px">8 GPUs</text><rect x="1345" y="215" width="165" height="100" rx="14" fill="#059669"/><text x="1427" y="250" class="c w">Node 3</text><text x="1427" y="284" class="c w" style="font-size:18px">8 GPUs</text><text x="900" y="352" class="s">节点之间：Groupwise P2P（见下一节）</text><line x1="872" y1="318" x2="872" y2="396" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/><text x="790" y="424" class="b m">第二层：展开 Node 0，用第四章的方法分到 GPU</text><circle cx="830" cy="500" r="30" fill="#2563eb"/><text x="830" y="500" class="c w">G0</text><circle cx="916" cy="500" r="30" fill="#2563eb"/><text x="916" y="500" class="c w">G1</text><circle cx="1002" cy="500" r="30" fill="#2563eb"/><text x="1002" y="500" class="c w">G2</text><circle cx="1088" cy="500" r="30" fill="#2563eb"/><text x="1088" y="500" class="c w">G3</text><circle cx="1174" cy="500" r="30" fill="#2563eb"/><text x="1174" y="500" class="c w">G4</text><circle cx="1260" cy="500" r="30" fill="#2563eb"/><text x="1260" y="500" class="c w">G5</text><circle cx="1346" cy="500" r="30" fill="#2563eb"/><text x="1346" y="500" class="c w">G6</text><circle cx="1432" cy="500" r="30" fill="#2563eb"/><text x="1432" y="500" class="c w">G7</text><text x="790" y="570" class="s">节点内：GPU P2P，按第四章的 MCV 记账</text><text x="790" y="630" class="s">说明：论文只说节点层面存在按组的对称，</text><text x="790" y="658" class="s">不是说所有节点间网络性能完全相同。</text><rect x="50" y="730" width="1500" height="130" rx="18" fill="#0f172a"/><text x="80" y="776" class="w">Node-Level：每个 Node 是一个整体设备，Workload Block 是“一个 Node 上的 Distributed Attention”。</text><text x="80" y="820" class="w">Device-Level：Node 内部的 GPU 分配。两层各自处理一种拓扑。</text></svg>
