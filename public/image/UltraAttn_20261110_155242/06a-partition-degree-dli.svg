<text x="60" y="60" class="t">Partition Degree P 如何影响负载均衡</text>
<text x="60" y="100">示意：Causal Attention，CP=4；按论文公式推出，非论文实验配置。</text>
<text x="60" y="126" class="s">平均 = COMP/CP（理想的每卡计算量）　上界 = ⌈COMP/CP⌉（Block 不可拆时，单卡计算量至少要到这个值）</text>
<rect x="940" y="78" width="26" height="26" rx="5" fill="#2563eb"/><text x="974" y="92" class="m">Full ×1</text>
<rect x="1070" y="78" width="26" height="26" rx="5" fill="#fff" stroke="#94a3b8"/><polygon points="1070,78 1070,104 1096,104" fill="#ea580c"/><text x="1104" y="92" class="m">Causal ×0.5</text>
