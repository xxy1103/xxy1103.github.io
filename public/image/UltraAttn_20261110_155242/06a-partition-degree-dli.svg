t><text x="1214" y="582" class="m">平均 3.125</text><rect x="1340" y="570" width="137.5" height="24" rx="5" fill="#60a5fa"/><text x="1214" y="622" class="m">上界 4</text><rect x="1340" y="610" width="176" height="24" rx="5" fill="#fb923c"/><rect x="1214" y="654" width="312" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1370" y="679" class="c b" style="fill:#b91c1c">DLI = 0.28</text><rect x="50" y="740" width="1500" height="120" rx="18" fill="#0f172a"/><text x="80" y="786" class="w">COMP = |F|×1 + |C|×0.5　　DLI = ⌈COMP/CP⌉ ÷ (COMP/CP) − 1</text><text x="80" y="828" class="w">P=4 时恰好整除，DLI=0；P=5 又不整除，DLI 回升到 0.28。DLI 总体随 P 下降，但不严格单调。</text></svg>
