<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L12,6L0,12Z" fill="#334155"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;fill:#334155}.t{font-size:36px;font-weight:700;fill:#0f172a}.h{font-size:26px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#0f172a}.w{font-weight:700;fill:#fff}.c{text-anchor:middle;dominant-baseline:central}.s{font-size:19px;fill:#64748b}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="60" class="t">先按资源分 Stream，再定每个 Stream 里的顺序</text>
<text x="60" y="100">结构取自 Figure 5(b) 合并后的图。Stream 分组是按论文规则作的示意，论文没有给出判断资源是否共用的算法。</text>
<rect x="60" y="140" width="720" height="580" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="182" class="h">两类边：依赖边与资源冲突边</text>
<g fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"><ellipse cx="220" cy="270" rx="50" ry="28"/><ellipse cx="500" cy="270" rx="56" ry="28"/></g>
<g fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"><rect x="120" y="420" width="90" height="54" rx="6"/><rect x="360" y="420" width="90" height="54" rx="6"/><rect x="560" y="420" width="90" height="54" rx="6"/></g>
<g fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"><path d="M605,530 L650,560 L605,590 L560,560Z"/></g>
<g class="c b"><text x="220" y="270" class="c b">Q3</text><text x="500" y="270" class="c b">KV3</text><text x="165" y="447" class="c b">A0</text><text x="405" y="447" class="c b">A2</text><text x="605" y="447" class="c b">A1</text><text x="605" y="560" class="c b">O3</text></g>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar)"><path d="M240,297 L385,418"/><path d="M475,296 L420,418"/><path d="M515,297 L590,418"/><path d="M405,476 L580,540"/></g>
<path d="M272,270 L442,270" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="10 7" fill="none"/>
<text x="357" y="242" class="c" style="fill:#dc2626;font-weight:700">共用输入带宽</text>
<text x="100" y="635" class="s">实线箭头：依赖，前者完成后者才能开始。</text>
<text x="100" y="668" class="s" style="fill:#dc2626">红色虚线：资源冲突，不能同时执行，先后待定。</text>
<text x="100" y="701" class="s">A0 没有入边，用本地数据即可开始。</text>
<rect x="800" y="140" width="740" height="580" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="830" y="182" class="h">按资源分成三个 Stream</text>
<g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"><rect x="830" y="215" width="680" height="110" rx="10"/><rect x="830" y="355" width="680" height="110" rx="10"/><rect x="830" y="495" width="680" height="110" rx="10"/></g>
<text x="850" y="245" class="b">Recv Stream（输入带宽）</text>
<text x="850" y="385" class="b">Comp Stream（计算）</text>
<text x="850" y="525" class="b">Send Stream（输出带宽）</text>
<g fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"><rect x="1020" y="265" width="110" height="48" rx="6"/><rect x="1160" y="265" width="150" height="48" rx="6"/></g>
<g fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"><rect x="1020" y="405" width="90" height="48" rx="6"/><rect x="1140" y="405" width="90" height="48" rx="6"/><rect x="1260" y="405" width="90" height="48" rx="6"/></g>
<rect x="1180" y="545" width="90" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<g class="c b"><text x="1075" y="289" class="c b">Q3</text><text x="1235" y="289" class="c b">KV3</text><text x="1065" y="429" class="c b">A0</text><text x="1185" y="429" class="c b">A2</text><text x="1305" y="429" class="c b">A1</text><text x="1225" y="569" class="c b">O3</text></g>
<text x="830" y="632" class="s">不同 Stream 之间可以重叠，前提是没有依赖。</text>
<text x="830" y="664" class="s">同一个 Stream 之内按顺序执行，ILP 只决定这里的先后。</text><text x="830" y="696" class="s">图中各 Stream 内的顺序只是一种示意排法。</text>
<rect x="60" y="770" width="1480" height="90" rx="14" fill="#0f172a"/>
<text x="800" y="815" class="c w" style="font-size:26px">共用资源的放一起，不共用的放开；组内先后，才是 ILP 要解的问题</text>
</svg>
