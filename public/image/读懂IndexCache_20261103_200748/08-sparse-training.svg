<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sparse Training：共享 Top-k 位置，分别训练 Indexer 和模型其余参数</title><desc id="desc">Indexer 在全部候选位置上打分，选出 A、D、F 供四层复用。各层在这些位置上提供 Attention 目标，选中分数的 Softmax 为同一份预测 q。多层 KL 更新 Indexer，最终预测的 LM Loss 更新其余模型参数。</desc><defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#24384c}.t{font-size:36px;font-weight:700}.h{font-size:26px;font-weight:600}.b{font-size:23px}.s{font-size:20px;fill:#52667a}.ar{fill:none;stroke:#8b9cad;stroke-width:3;marker-end:url(#a)}.idx{fill:none;stroke:#c38629;stroke-width:3;marker-end:url(#o)}.line{fill:none;stroke:#c38629;stroke-width:3}.up{fill:none;stroke:#c38629;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#o)}.blue{fill:none;stroke:#668dbe;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#b)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b9cad"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c38629"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#668dbe"/></marker></defs>
<rect width="1600" height="900" fill="#f5f7fb"/><text x="64" y="73" class="t">Sparse Training：共享选中的位置，同时适配 Indexer 与模型</text><text x="64" y="117" class="b">以一个 F 服务自身及三个 S 为例 · 固定同一个 Query 位置</text>
<rect x="64" y="152" width="1472" height="429" rx="20" fill="#fff" stroke="#d6dfe8"/>
<rect x="90" y="179" width="335" height="96" rx="14" fill="#fff1d9" stroke="#dba549"/><text x="257" y="216" text-anchor="middle" class="h">Indexer 1</text><text x="257" y="252" text-anchor="middle" class="s">为全部候选历史位置打分</text>
<path d="M435 227h73" class="idx"/>
<text x="550" y="194" class="b">Top-k 选择：A、D、F</text>
<rect x="550" y="210" width="48" height="41" rx="7" fill="#fff1d9" stroke="#dba549"/><text x="574" y="239" text-anchor="middle" class="b">A</text><rect x="616" y="210" width="48" height="41" rx="7" fill="#edf1f7" stroke="#d6dfe8"/><text x="640" y="239" text-anchor="middle" class="b">B</text><rect x="682" y="210" width="48" height="41" rx="7" fill="#edf1f7" stroke="#d6dfe8"/><text x="706" y="239" text-anchor="middle" class="b">C</text><rect x="748" y="210" width="48" height="41" rx="7" fill="#fff1d9" stroke="#dba549"/><text x="772" y="239" text-anchor="middle" class="b">D</text><rect x="814" y="210" width="48" height="41" rx="7" fill="#edf1f7" stroke="#d6dfe8"/><text x="838" y="239" text-anchor="middle" class="b">E</text><rect x="880" y="210" width="48" height="41" rx="7" fill="#fff1d9" stroke="#dba549"/><text x="904" y="239" text-anchor="middle" class="b">F</text>
<text x="1020" y="218" class="b">同一份索引供四层使用</text><text x="1020" y="252" class="s">共享位置，各层独立计算注意力</text>
<path d="M740 260v44M230 304h975" class="line"/>
<rect x="90" y="333" width="280" height="145" rx="14" fill="#e8f1ff" stroke="#85a9db"/><text x="230" y="369" text-anchor="middle" class="h">Layer 1 · F</text><text x="230" y="406" text-anchor="middle" class="b">Sparse Attention</text><text x="230" y="444" text-anchor="middle" class="s">使用本层 Q/K/V</text><path d="M230 304v20" class="idx"/><path d="M230 486v33" class="ar"/><text x="230" y="550" text-anchor="middle" class="b">目标 p₁（A、D、F）</text><path d="M377 396h30" class="ar"/><rect x="415" y="333" width="280" height="145" rx="14" fill="#e8f1ff" stroke="#85a9db"/><text x="555" y="369" text-anchor="middle" class="h">Layer 2 · S</text><text x="555" y="406" text-anchor="middle" class="b">Sparse Attention</text><text x="555" y="444" text-anchor="middle" class="s">使用本层 Q/K/V</text><path d="M555 304v20" class="idx"/><path d="M555 486v33" class="ar"/><text x="555" y="550" text-anchor="middle" class="b">目标 p₂（A、D、F）</text><path d="M702 396h30" class="ar"/><rect x="740" y="333" width="280" height="145" rx="14" fill="#e8f1ff" stroke="#85a9db"/><text x="880" y="369" text-anchor="middle" class="h">Layer 3 · S</text><text x="880" y="406" text-anchor="middle" class="b">Sparse Attention</text><text x="880" y="444" text-anchor="middle" class="s">使用本层 Q/K/V</text><path d="M880 304v20" class="idx"/><path d="M880 486v33" class="ar"/><text x="880" y="550" text-anchor="middle" class="b">目标 p₃（A、D、F）</text><path d="M1027 396h30" class="ar"/><rect x="1065" y="333" width="280" height="145" rx="14" fill="#e8f1ff" stroke="#85a9db"/><text x="1205" y="369" text-anchor="middle" class="h">Layer 4 · S</text><text x="1205" y="406" text-anchor="middle" class="b">Sparse Attention</text><text x="1205" y="444" text-anchor="middle" class="s">使用本层 Q/K/V</text><path d="M1205 304v20" class="idx"/><path d="M1205 486v33" class="ar"/><text x="1205" y="550" text-anchor="middle" class="b">目标 p₄（A、D、F）</text>
<text x="1450" y="442" text-anchor="middle" class="s">→ 后续层</text>
<rect x="64" y="608" width="875" height="225" rx="18" fill="#fff" stroke="#dba549"/><text x="92" y="649" class="h">① 多层 KL → 更新 Indexer</text><text x="92" y="685" class="b">选中位置的 Indexer 分数 → Softmax → 同一份 q</text><text x="92" y="724" class="b">q 分别与 p₁、p₂、p₃、p₄ 计算 KL，再取平均</text><text x="92" y="760" class="s">预测与目标均在 A、D、F 上归一化，目标作为监督信号</text><path d="M93 792h70" class="up"/><text x="178" y="800" class="b">只更新保留的 Indexer 参数</text>
<rect x="967" y="608" width="569" height="225" rx="18" fill="#fff" stroke="#85a9db"/><text x="995" y="649" class="h">② LM Loss → 更新模型其余参数</text><text x="995" y="695" class="b">模型最终预测 ↔ 真实的下一个 Token</text><text x="995" y="739" class="s">通过预测误差，适应共享索引下的计算</text><path d="M996 792h62" class="blue"/><text x="1072" y="800" class="b">更新 Attention、FFN 等参数</text>

<text x="800" y="876" text-anchor="middle" class="s">A～F 和 Top-3 仅作示意 · 实线：前向计算；虚线：参数更新 · LM Loss 不直接穿过 Top-k 更新 Indexer</text></svg>
