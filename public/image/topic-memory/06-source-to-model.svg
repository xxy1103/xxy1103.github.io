<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1224" viewBox="0 0 1120 1224" role="img" aria-labelledby="title desc">
<title id="title">从 Source 到主题：程序与模型的五步协作</title><desc id="desc">五步主线自上而下：程序过滤，模型识别主题线索，程序检索已有主题，模型结合新旧材料提出新建或修订，程序校验并提交。以金额和部署为教学示例，标明各阶段输入与结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#668294" stroke-width="1.5"/></marker></defs>
<style>text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; } .label { letter-spacing: 1.5px; }</style>
<rect width="1120" height="1224" rx="24" fill="#F4F7FA"/>
<rect x="40" y="34" width="5" height="57" rx="2.5" fill="#087E82"/>
<text x="62" y="51" font-size="12" fill="#087E82" font-weight="600" text-anchor="start">POWERCONTEXT  /  TOPIC MEMORY  /  06</text>
<text x="62" y="89" font-size="28" fill="#142D42" font-weight="650" text-anchor="start">从 Source 到主题：程序与模型的五步协作</text>
<text x="40" y="1200" font-size="13" fill="#52697B" font-weight="400" text-anchor="start">阅读路径 · 证据 → 主题 → 精确版本</text>
<text x="1080" y="1200" font-size="13" fill="#52697B" font-weight="400" text-anchor="end">06</text>
<text x="40" y="126" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">教学示例：本批读取 Source 11～20；其中第 14 条标记为 lineage_only。</text>
<rect x="40" y="149" width="1040" height="44" rx="10" fill="#EAF0F5" stroke="#EAF0F5"/>
<text x="62" y="178" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">阅读方式：沿左侧主线向下看；右侧展示每一步的具体结果。</text>
<rect x="40" y="220" width="680" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<rect x="60" y="240" width="38" height="38" rx="10" fill="#087E82" stroke="#087E82"/>
<text x="79" y="267" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="114" y="266" font-size="23" fill="#087E82" font-weight="600" text-anchor="start">程序 · 过滤 Source</text>
<text x="62" y="302" font-size="18" fill="#142D42" font-weight="400" text-anchor="start">检查这 10 条 Source 的内部用途。</text>
<text x="62" y="331" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">排除第 14 条，给其余 9 条分配临时证据编号。</text>
<path d="M 731 284 H 768" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 756.00 278.00 L 768.0 284.0 L 756.00 290.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="780" y="220" width="300" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<text x="798" y="251" font-size="17" fill="#087E82" font-weight="600" text-anchor="start">过滤结果</text>
<text x="798" y="288" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">14：仍保存，仅供追溯</text>
<text x="798" y="318" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">其余 9 条：进入生成流程</text>
<rect x="40" y="400" width="680" height="128" rx="16" fill="#EAF0FA" stroke="#D7E2F4"/>
<rect x="60" y="420" width="38" height="38" rx="10" fill="#3262AE" stroke="#3262AE"/>
<text x="79" y="447" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="114" y="446" font-size="23" fill="#3262AE" font-weight="600" text-anchor="start">模型 · 识别主题线索</text>
<text x="62" y="482" font-size="18" fill="#142D42" font-weight="400" text-anchor="start">输入：任务说明 + 9 条证据。</text>
<text x="62" y="511" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">输出：查询线索、关键词和对应证据编号。</text>
<path d="M 731 464 H 768" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 756.00 458.00 L 768.0 464.0 L 756.00 470.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="780" y="400" width="300" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<text x="798" y="431" font-size="17" fill="#3262AE" font-weight="600" text-anchor="start">识别到的线索</text>
<text x="798" y="468" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">金额精度 ← e1、e2、e3</text>
<text x="798" y="498" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">容器部署 ← e5</text>
<rect x="40" y="580" width="680" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<rect x="60" y="600" width="38" height="38" rx="10" fill="#087E82" stroke="#087E82"/>
<text x="79" y="627" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="114" y="626" font-size="23" fill="#087E82" font-weight="600" text-anchor="start">程序 · 检索已有主题</text>
<text x="62" y="662" font-size="18" fill="#142D42" font-weight="400" text-anchor="start">用线索在当前 Scope 检索，读取相关主题。</text>
<text x="62" y="691" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">检索结果作为候选，交给下一步模型判断。</text>
<path d="M 731 644 H 768" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 756.00 638.00 L 768.0 644.0 L 756.00 650.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="780" y="580" width="300" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<text x="798" y="611" font-size="17" fill="#087E82" font-weight="600" text-anchor="start">本例检索结果</text>
<text x="798" y="648" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">金额：找到「金额处理」@1</text>
<text x="798" y="678" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">部署：未找到合适候选</text>
<rect x="40" y="760" width="680" height="128" rx="16" fill="#EAF0FA" stroke="#D7E2F4"/>
<rect x="60" y="780" width="38" height="38" rx="10" fill="#3262AE" stroke="#3262AE"/>
<text x="79" y="807" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="114" y="806" font-size="23" fill="#3262AE" font-weight="600" text-anchor="start">模型 · 提出新建或修订</text>
<text x="62" y="842" font-size="18" fill="#142D42" font-weight="400" text-anchor="start">输入：本批新证据 + 检索到的已有主题内容。</text>
<text x="62" y="871" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">生成标题、摘要、详情，注明证据与更新目标。</text>
<path d="M 731 824 H 768" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 756.00 818.00 L 768.0 824.0 L 756.00 830.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="780" y="760" width="300" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<text x="798" y="791" font-size="17" fill="#3262AE" font-weight="600" text-anchor="start">本例生成提案</text>
<text x="798" y="828" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">修订「金额处理」，补充 Decimal</text>
<text x="798" y="858" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">新建「容器部署」主题</text>
<rect x="40" y="940" width="680" height="128" rx="16" fill="#FFFFFF" stroke="#DCE5EC"/>
<rect x="60" y="960" width="38" height="38" rx="10" fill="#087E82" stroke="#087E82"/>
<text x="79" y="987" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<text x="114" y="986" font-size="23" fill="#087E82" font-weight="600" text-anchor="start">程序 · 校验并提交</text>
<text x="62" y="1022" font-size="18" fill="#142D42" font-weight="400" text-anchor="start">检查证据引用、更新目标和版本是否冲突。</text>
<text x="62" y="1051" font-size="18" fill="#52697B" font-weight="400" text-anchor="start">通过后，一起提交主题、索引和处理进度。</text>
<path d="M 731 1004 H 768" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 756.00 998.00 L 768.0 1004.0 L 756.00 1010.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="780" y="940" width="300" height="128" rx="16" fill="#E4F3EF" stroke="#CDE8E0"/>
<text x="798" y="971" font-size="17" fill="#087E82" font-weight="600" text-anchor="start">本例提交结果</text>
<text x="798" y="1008" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">金额主题 @2；部署主题 @1</text>
<text x="798" y="1038" font-size="16" fill="#142D42" font-weight="400" text-anchor="start">Cursor：10 → 20</text>
<path d="M 380 358 V 390" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 386.00 378.00 L 380.0 390.0 L 374.00 378.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="380" font-size="16" fill="#52697B" font-weight="400" text-anchor="start">9 条可用证据 + 任务说明</text>
<path d="M 380 538 V 570" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 386.00 558.00 L 380.0 570.0 L 374.00 558.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="560" font-size="16" fill="#52697B" font-weight="400" text-anchor="start">主题线索 + 对应证据编号</text>
<path d="M 380 718 V 750" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 386.00 738.00 L 380.0 750.0 L 374.00 738.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="740" font-size="16" fill="#52697B" font-weight="400" text-anchor="start">本批新证据 + 已有主题内容</text>
<path d="M 380 898 V 930" fill="none" stroke="#668294" stroke-width="2" stroke-linejoin="round"/>
<path d="M 386.00 918.00 L 380.0 930.0 L 374.00 918.00" fill="none" stroke="#668294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="920" font-size="16" fill="#52697B" font-weight="400" text-anchor="start">完整主题提案 + 引用 + 更新目标</text>
<rect x="40" y="1100" width="1040" height="70" rx="12" fill="#FFF5E5" stroke="#F0E3CD"/>
<text x="62" y="1129" font-size="19" fill="#A66A18" font-weight="550" text-anchor="start">也可能没有可发布内容：成功处理后仍可推进 Cursor。</text>
<text x="62" y="1156" font-size="17" fill="#52697B" font-weight="400" text-anchor="start">五步表示职责与数据流；材料较多时，内部可能拆分为更多模型调用。</text>
</svg>
