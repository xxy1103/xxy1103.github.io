<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SI 的预算划分与 HFA 执行</title><desc id="desc">固定 Sink 和滑动窗口，加上从中间区域动态选择的位置，共同组成预算。窗口由连续分支计算，动态位置由稀疏分支计算，再按 Softmax 统计合并。下方分支示意省略 Sink，与论文算子分析口径一致。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.t{font-size:34px;font-weight:650}.h{font-size:26px;font-weight:600}.b{font-size:23px}.s{font-size:21px;fill:#64748b}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f8fafc"/><text x="60" y="70" class="t">SI：固定连续区域 + 动态检索 → 两类访问分别计算</text><text x="60" y="112" class="s">上方是位置选择与真实预算；下方按论文 HFA 分析口径，省略小预算 Sink，展示两条主要分支。</text>
<rect x="60" y="150" width="1480" height="295" rx="20" fill="white" stroke="#dce3ec"/><text x="90" y="195" class="h">一个 Query 可见的历史前缀</text>
<rect x="90" y="235" width="155" height="75" rx="10" fill="#dcece5" stroke="#78a48e"/><text x="167" y="282" text-anchor="middle" class="b">Sink 16</text>
<rect x="265" y="235" width="795" height="75" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<rect x="310" y="247" width="25" height="51" rx="4" fill="#dfaa64"/><rect x="430" y="247" width="25" height="51" rx="4" fill="#dfaa64"/><rect x="480" y="247" width="25" height="51" rx="4" fill="#dfaa64"/><rect x="690" y="247" width="25" height="51" rx="4" fill="#dfaa64"/><rect x="840" y="247" width="25" height="51" rx="4" fill="#dfaa64"/><rect x="990" y="247" width="25" height="51" rx="4" fill="#dfaa64"/>
<rect x="1080" y="235" width="425" height="75" rx="10" fill="#dcecf9" stroke="#7fa7ca"/><text x="1292" y="282" text-anchor="middle" class="b">最近的 Window：1024</text>
<text x="655" y="350" text-anchor="middle" class="b">中间区域：由 Indexer 动态选出 1008 个位置</text>
<text x="90" y="404" class="s">最终预算：16 + 1024 + 1008 = 2048；上图按区域示意，不按 Token 数量比例绘制。</text>
<rect x="60" y="465" width="680" height="246" rx="18" fill="#edf4fc" stroke="#9bb7d4"/>
<text x="90" y="505" class="h">SWA：连续 Window 分支（A）</text><text x="90" y="540" class="s">连续读取 KV · Stream A</text>
<rect x="85" y="560" width="630" height="125" rx="12" fill="white" stroke="#9bb7d4"/>
<text x="105" y="594" class="b" font-weight="600">输出 O<tspan baseline-shift="sub" font-size="17">A</tspan>：区域内 Softmax 加权后的 Value 向量</text>
<text x="105" y="631" class="b" font-weight="600">保留 Z<tspan baseline-shift="sub" font-size="17">A</tspan>：区域内未归一化权重总量</text>
<text x="105" y="666" class="s">一个是“信息汇总”，一个用于确定合并占比</text>
<rect x="860" y="465" width="680" height="246" rx="18" fill="#fff6e9" stroke="#d9b17d"/>
<text x="890" y="505" class="h">SFA：动态 Sparse 分支（B）</text><text x="890" y="540" class="s">按索引读取离散 KV · Stream B</text>
<rect x="885" y="560" width="630" height="125" rx="12" fill="white" stroke="#d9b17d"/>
<text x="905" y="594" class="b" font-weight="600">输出 O<tspan baseline-shift="sub" font-size="17">B</tspan>：区域内 Softmax 加权后的 Value 向量</text>
<text x="905" y="631" class="b" font-weight="600">保留 Z<tspan baseline-shift="sub" font-size="17">B</tspan>：区域内未归一化权重总量</text>
<text x="905" y="666" class="s">一个是“信息汇总”，一个用于确定合并占比</text>
<text x="800" y="548" text-anchor="middle" class="s">重叠</text><text x="800" y="579" text-anchor="middle" class="s">执行</text>
<path d="M400 711 V736 H650 V758 M1200 711 V736 H950 V758" class="a"/>
<rect x="340" y="758" width="920" height="88" rx="14" fill="#f0edfa" stroke="#b4a7d0"/>
<text x="800" y="792" text-anchor="middle" class="h">按两个区域的权重总量，对局部输出加权平均</text>
<text x="800" y="827" text-anchor="middle" class="b">O = (Z<tspan baseline-shift="sub" font-size="17">A</tspan> O<tspan baseline-shift="sub" font-size="17">A</tspan> + Z<tspan baseline-shift="sub" font-size="17">B</tspan> O<tspan baseline-shift="sub" font-size="17">B</tspan>) / (Z<tspan baseline-shift="sub" font-size="17">A</tspan> + Z<tspan baseline-shift="sub" font-size="17">B</tspan>)</text>
<text x="60" y="880" class="s">Z 表示数学上的总量；实际保存数值稳定的等价统计，由 Online Softmax 合并。下方分支示意省略 Sink。</text></svg>
