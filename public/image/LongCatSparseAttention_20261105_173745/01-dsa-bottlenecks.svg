<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">DSA 的执行流程与两个效率瓶颈</title>
<desc id="desc">单层中，当前隐藏状态生成索引查询与注意力查询。Lightning Indexer 对可见历史打分，Top-K 选择位置，Sparse Attention 按位置读取本层 KV 并输出。瓶颈一为全前缀打分和 Top-K 且每层重复，瓶颈二为离散 KV 读取及反向梯度写回冲突。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
<marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d2574d" stroke-width="1.5"/></marker>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:36px;font-weight:650}.h{font-size:26px;font-weight:600}.body{font-size:23px}.small{font-size:20px;fill:#64748b}.label{font-size:22px;font-weight:600}.wire{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.redwire{fill:none;stroke:#d2574d;stroke-width:2.5;marker-end:url(#redarrow)}</style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="64" y="74" class="title">DSA：先选位置，再读取 KV 计算注意力</text>
<text x="66" y="112" class="small">一个 Attention 层、一个 Query 的示意；所有层都独立执行这条流程</text>
<rect x="60" y="145" width="1480" height="465" rx="22" fill="white" stroke="#e2e8f0" stroke-width="2"/>
<rect x="310" y="185" width="610" height="185" rx="18" fill="#fff7ed" stroke="#ea9949" stroke-width="2"/>
<text x="335" y="220" class="small" style="fill:#a15b17">Lightning Indexer</text>
<rect x="85" y="253" width="175" height="103" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="172" y="293" text-anchor="middle" class="label">当前隐藏状态</text><text x="172" y="326" text-anchor="middle" class="small">生成本层查询</text>
<rect x="340" y="248" width="295" height="98" rx="12" fill="white" stroke="#f1c18c"/>
<text x="487" y="287" text-anchor="middle" class="label">对可见历史逐位置打分</text><text x="487" y="321" text-anchor="middle" class="small">输出 L 个 Indexer Scores</text>
<rect x="695" y="248" width="195" height="98" rx="12" fill="white" stroke="#f1c18c"/>
<text x="792" y="287" text-anchor="middle" class="label">Top-K 选择</text><text x="792" y="321" text-anchor="middle" class="small">输出位置索引</text>
<path d="M260 280 H340" class="wire"/><text x="275" y="264" class="small">qᴵ</text>
<path d="M635 295 H695" class="wire"/>
<rect x="1010" y="248" width="300" height="108" rx="14" fill="#eff6ff" stroke="#77a9d7" stroke-width="2"/>
<text x="1160" y="289" text-anchor="middle" class="h">Sparse Attention</text><text x="1160" y="326" text-anchor="middle" class="small">仅在选中位置上归一化、聚合</text>
<path d="M890 280 H1010" class="wire"/><text x="930" y="265" class="small">索引</text>
<path d="M260 330 H285 V403 H1160 V356" class="wire"/>
<rect x="635" y="385" width="275" height="34" rx="8" fill="white"/><text x="772" y="409" text-anchor="middle" class="small">本层 Attention Query</text>
<path d="M1310 300 H1380" class="wire"/><text x="1400" y="307" class="label">输出</text>
<rect x="935" y="429" width="385" height="51" rx="12" fill="#fff1ef" stroke="#eab3ad"/>
<text x="1127" y="462" text-anchor="middle" class="label" style="fill:#b94f45">按索引 Gather：跨位置读取 KV</text>
<path d="M1127 429 V366" class="redwire"/>
<text x="85" y="498" class="label">本层可见历史</text><text x="85" y="528" class="small">按序列位置排列</text>
<text x="347" y="465" class="small">索引 Key：参与历史打分</text><path d="M485 488 V349" class="wire"/>
<rect x="345" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="384" y="498" width="30" height="53" rx="5" fill="#e6a49b" stroke="#ca6b60"/><rect x="423" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="462" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="501" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="540" y="498" width="30" height="53" rx="5" fill="#e6a49b" stroke="#ca6b60"/><rect x="579" y="498" width="30" height="53" rx="5" fill="#e6a49b" stroke="#ca6b60"/><rect x="618" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="657" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="696" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="735" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="774" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="813" y="498" width="30" height="53" rx="5" fill="#e6a49b" stroke="#ca6b60"/><rect x="852" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="891" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="930" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="969" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="1008" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="1047" y="498" width="30" height="53" rx="5" fill="#e6a49b" stroke="#ca6b60"/><rect x="1086" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="1125" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="1164" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="1203" y="498" width="30" height="53" rx="5" fill="#e6a49b" stroke="#ca6b60"/><rect x="1242" y="498" width="30" height="53" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/>
<path d="M401 497 V482 H1127 M557 497 V482 M596 497 V482 M830 497 V482 M1064 497 V482 M1220 497 V482" fill="none" stroke="#d2574d" stroke-width="2"/>
<text x="347" y="586" class="small">红色位置：Top-K 选中的 KV，可能分散在整个前缀中（仅作示意）</text>
<circle cx="895" cy="194" r="23" fill="#c77727"/><text x="895" y="202" text-anchor="middle" style="fill:white;font-size:24px;font-weight:600">1</text>
<circle cx="1313" cy="433" r="23" fill="#c75f53"/><text x="1313" y="441" text-anchor="middle" style="fill:white;font-size:24px;font-weight:600">2</text>
<rect x="60" y="640" width="720" height="190" rx="18" fill="#fff7ed" stroke="#f1c18c"/>
<text x="87" y="681" class="h" style="fill:#a15b17">① 索引成本高：找位置仍要处理长历史</text>
<text x="87" y="723" class="body">全前缀打分 + Top-K，而且每层重新执行。</text>
<text x="87" y="761" class="body">单步 Decode 随 L 增长；长上下文中占比上升。</text>
<text x="87" y="801" class="small">LSA 的对应改进：CLI 跨层复用 / HI 粗到细筛选</text>
<rect x="800" y="640" width="740" height="190" rx="18" fill="#fff1ef" stroke="#eab3ad"/>
<text x="827" y="681" class="h" style="fill:#b94f45">② KV 访问离散：选得少，仍可能读得慢</text>
<text x="827" y="723" class="body">跳跃读取难以合并，HBM 有效带宽利用不足。</text>
<text x="827" y="761" class="body">反向向离散 KV 累加梯度，还可能产生写冲突。</text>
<text x="827" y="801" class="small">LSA 的对应改进：SI 固定连续区域 + 混合执行</text>
<text x="65" y="870" class="small">依据论文 Section 2.2–2.3 绘制；Indexer Key 与 Attention KV 表示用途不同，图中合并展示其历史位置。</text>
</svg>
