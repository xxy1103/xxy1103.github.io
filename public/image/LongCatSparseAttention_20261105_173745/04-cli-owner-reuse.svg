<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CLI：一次位置选择供相邻两层使用</title><desc id="desc">Owner Indexer 输出位置集合，Owner 和 Reuse 层各自用本层 Query、KV 完成 Attention，层间前向顺序执行。跨层监督训练 Owner 同时关注组内各层。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.t{font-size:34px;font-weight:650}.h{font-size:27px;font-weight:600}.b{font-size:24px}.s{font-size:22px;fill:#64748b}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f8fafc"/><text x="60" y="70" class="t">CLI：一次选择，两层各自计算 Attention</text><text x="60" y="112" class="s">同一个 Token 位置 t · 默认组大小 N = 2 · 索引在层间复用，Attention 输出逐层计算</text>
<rect x="60" y="155" width="1480" height="180" rx="20" fill="#fff6e9" stroke="#d9b17d"/>
<text x="90" y="203" class="h">Owner Layer 的 Indexer</text><text x="90" y="246" class="b">依据 Owner 层表示打分、选择</text><text x="90" y="292" class="s">本组只执行这一次索引</text>
<path d="M570 245 H790" class="a"/><text x="625" y="224" class="s">输出</text>
<rect x="820" y="187" width="680" height="115" rx="14" fill="white" stroke="#d9b17d"/><text x="850" y="230" class="h">位置集合 Sₜ</text><text x="850" y="273" class="b">例如 {1, 2, …, 8000, …, t}，仅表示去哪里取 KV</text>
<path d="M1140 302 V365 H405 V402 M1140 365 H1190 V402" class="a"/>
<rect x="60" y="402" width="690" height="266" rx="18" fill="#edf3fd" stroke="#9bb4db"/><text x="90" y="448" class="h">Owner Layer l</text><text x="90" y="496" class="b">本层 Query + 本层 KV[Sₜ]</text><text x="90" y="542" class="b">→ 本层 Attention 权重与输出</text><text x="90" y="593" class="s">读取第 8000 个位置时，使用第 l 层 KV</text><text x="90" y="635" class="s">随后继续完成本层其余计算</text>
<rect x="850" y="402" width="690" height="266" rx="18" fill="#f2effb" stroke="#b6a9d2"/><text x="880" y="448" class="h">Reuse Layer l + 1</text><text x="880" y="496" class="b">下一层 Query + 下一层 KV[Sₜ]</text><text x="880" y="542" class="b">→ 下一层 Attention 权重与输出</text><text x="880" y="593" class="s">读取第 8000 个位置时，使用第 l+1 层 KV</text><text x="880" y="635" class="s">不再运行 Indexer，继续使用同一组位置</text>
<path d="M750 535 H850" class="a"/><text x="800" y="475" text-anchor="middle" class="s">层间</text><text x="800" y="508" text-anchor="middle" class="s">前向</text>
<rect x="60" y="710" width="1480" height="127" rx="18" fill="white" stroke="#dce3ec"/><text x="90" y="754" class="h">训练时：让 Owner Indexer 同时学习两层各自的 Attention 分布</text><text x="90" y="799" class="b">单层监督：为自己选位置 → 跨层蒸馏：为组内多层选位置；推理时仍只索引一次</text>
<text x="60" y="881" class="s">示意依据论文 Section 3.2。位置相同不代表 KV、Attention 权重或输出相同；图中不展开训练计算图。</text></svg>
