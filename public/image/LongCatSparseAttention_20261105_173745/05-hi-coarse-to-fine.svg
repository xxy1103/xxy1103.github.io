<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">HI：Page 粗筛与 Token 精筛</title><desc id="desc">每页128个Token，分为16个8Token子块，均值Indexer Key用于Page粗筛。选1024页，在约128K候选Token中用原始Key精筛1008个动态位置，再与固定区域合并。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.t{font-size:34px;font-weight:650}.h{font-size:27px;font-weight:600}.b{font-size:24px}.s{font-size:21px;fill:#64748b}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="900" fill="#f8fafc"/><text x="60" y="70" class="t">HI：先找重要 Page，再从候选页里选择 Token</text><text x="60" y="112" class="s">示例：1M 可见前缀 · P = 128 Token / Page · B = 8 Token / Sub-block · M = 1024 候选 Page</text>
<rect x="60" y="150" width="1480" height="220" rx="18" fill="white" stroke="#dce3ec"/><text x="90" y="192" class="h">① 为粗筛准备代表 Key：平均的是 Indexer Key，不是 Attention KV</text>
<rect x="90" y="220" width="720" height="105" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="110" y="252" class="b">一个 Page：128 个 Token = 16 个 Sub-block</text>
<rect x="110" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="152" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="194" y="272" width="34" height="30" rx="4" fill="#dfaa64"/><rect x="236" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="278" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="320" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="362" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="404" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="446" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="488" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="530" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="572" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="614" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="656" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="698" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/><rect x="740" y="272" width="34" height="30" rx="4" fill="#cbd5e1"/>
<path d="M810 270 H900" class="a"/>
<text x="925" y="247" class="b">每个 Sub-block 的 8 个 Key 取均值</text><text x="925" y="288" class="b">→ 每页保留 16 个代表 Key 用于打分</text><text x="925" y="331" class="s">代表 Key 可以预计算并缓存</text>
<rect x="60" y="400" width="700" height="220" rx="18" fill="#fff6e9" stroke="#d9b17d"/><text x="90" y="445" class="h">② Page 粗筛：在页之间做选择</text><text x="90" y="491" class="b">Query 与代表 Key 打分 → 聚合 Page Score</text><text x="90" y="537" class="b">8192 个 Page → Top-M → 1024 个候选页</text><text x="90" y="584" class="s">输出：候选页的位置，覆盖最多约 128K Token</text>
<path d="M760 510 H840" class="a"/>
<rect x="840" y="400" width="700" height="220" rx="18" fill="#edf3fd" stroke="#9bb4db"/><text x="870" y="445" class="h">③ Token 精筛：在候选页内做选择</text><text x="870" y="491" class="b">使用原始 Token Key，重新进行精细打分</text><text x="870" y="537" class="b">候选 Token → Top-K → 1008 个动态位置</text><text x="870" y="584" class="s">输出：动态位置集合；只选因果可见、非固定位置</text>
<path d="M1190 620 V683 H1000 V723" class="a"/>
<rect x="60" y="700" width="600" height="115" rx="16" fill="#edf8f2" stroke="#91bda6"/><text x="90" y="744" class="h">SI 的固定区域：Sink 16 + Window 1024</text><text x="90" y="786" class="s">始终保留，不依赖粗筛是否召回其所在 Page</text>
<path d="M660 758 H790" class="a"/>
<rect x="790" y="723" width="750" height="92" rx="16" fill="#f2effb" stroke="#b6a9d2"/><text x="1165" y="760" text-anchor="middle" class="h">最终位置集合：16 + 1024 + 1008 = 2048</text><text x="1165" y="796" text-anchor="middle" class="s">交给本层 Attention，并供组内 Reuse Layer 使用</text>
<text x="60" y="875" class="s">示意采用足够长的可见前缀。粗筛只限制动态检索范围；未召回的页不参与动态精筛，完整历史 KV 仍需保存。</text></svg>
