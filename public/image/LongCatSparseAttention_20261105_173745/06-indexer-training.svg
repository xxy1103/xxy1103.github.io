<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">LSA 稀疏训练的监督与参数更新</title><desc id="desc">Owner Indexer 的输入从主模型分离，输出分数和位置集合。主模型逐层计算 Attention，各层权重作为固定教师监督共享 Indexer。蒸馏损失只更新 Indexer，语言模型损失只更新主模型。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.t{font-size:34px;font-weight:650}.h{font-size:26px;font-weight:600}.b{font-size:23px}.s{font-size:21px;fill:#64748b}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f8fafc"/><text x="60" y="65" class="t">稀疏训练：主模型学预测，Indexer 学选位置</text><text x="60" y="106" class="s">两层一组示意 · 实线为前向数据流，虚线为教师监督 · 下方标注各损失更新的参数</text>
<rect x="60" y="145" width="690" height="595" rx="20" fill="#edf3fd" stroke="#9bb4db"/><text x="90" y="189" class="h">主模型：按顺序计算各层 Attention</text>
<rect x="100" y="230" width="590" height="65" rx="12" fill="white" stroke="#9bb4db"/><text x="395" y="271" text-anchor="middle" class="b">Owner 层输入隐藏状态</text>
<path d="M395 295 V343" class="a"/>
<rect x="100" y="343" width="590" height="95" rx="12" fill="white" stroke="#9bb4db"/><text x="130" y="381" class="b">Owner Attention：本层 Query、KV[Sₜ]</text><text x="130" y="416" class="s">产生本层输出与教师分布 p⁽ˡ⁾</text>
<path d="M395 438 V484" class="a"/>
<rect x="100" y="484" width="590" height="95" rx="12" fill="white" stroke="#9bb4db"/><text x="130" y="522" class="b">Reuse Attention：下一层 Query、KV[Sₜ]</text><text x="130" y="557" class="s">产生下一层输出与教师分布 p⁽ˡ⁺¹⁾</text>
<path d="M395 579 V626" class="a"/>
<rect x="100" y="626" width="590" height="75" rx="12" fill="white" stroke="#9bb4db"/><text x="395" y="657" text-anchor="middle" class="b">后续层 → 下一 Token 预测损失</text><text x="395" y="687" text-anchor="middle" class="s">反向：更新主模型参数</text>
<rect x="850" y="145" width="690" height="595" rx="20" fill="#fff6e9" stroke="#d9b17d"/><text x="880" y="189" class="h">Owner Indexer：学习组内各层的需求</text>
<path d="M690 261 H925" class="a"/><rect x="722" y="235" width="160" height="36" rx="6" fill="#f8fafc"/><text x="802" y="260" text-anchor="middle" class="s">输入 Detach</text>
<rect x="925" y="280" width="540" height="90" rx="12" fill="white" stroke="#d9b17d"/><text x="1195" y="314" text-anchor="middle" class="b">Indexer 分数 I</text><text x="1195" y="349" text-anchor="middle" class="s">历史输入同样与主模型梯度分离</text>
<path d="M1195 370 V410" class="a"/><text x="1195" y="405" text-anchor="middle" class="s">分数归一化为分布 r</text>
<rect x="1000" y="425" width="465" height="110" rx="12" fill="white" stroke="#d9b17d"/><text x="1232" y="467" text-anchor="middle" class="b">KL(p⁽ˡ⁾ ∥ r) + KL(p⁽ˡ⁺¹⁾ ∥ r)</text><text x="1232" y="507" text-anchor="middle" class="s">每个层各提供一项监督</text>
<path d="M690 391 H960 V458 H1000" class="d"/>
<path d="M690 534 H930 V505 H1000" class="d"/>
<path d="M988 450 L1000 458 L988 466 Z M988 497 L1000 505 L988 513 Z" fill="#64748b"/>
<text x="800" y="475" text-anchor="middle" class="s">教师目标</text><text x="800" y="506" text-anchor="middle" class="s">不回传梯度</text>
<path d="M1232 535 V626" class="a"/>
<rect x="925" y="626" width="540" height="75" rx="12" fill="white" stroke="#d9b17d"/><text x="1195" y="657" text-anchor="middle" class="b">跨层蒸馏损失</text><text x="1195" y="687" text-anchor="middle" class="s">反向：只更新 Owner Indexer 参数</text>
<rect x="60" y="775" width="1480" height="90" rx="16" fill="white" stroke="#dce3ec"/><text x="90" y="811" class="b">位置选择路径（为清晰单列）：Indexer 分数 → Top-K 动态位置 + SI 固定区域 → Sₜ → 两层 Attention</text><text x="90" y="848" class="s">Top-K 是离散选择；不通过它把预测损失反传给 Indexer。Dense Warm-up 则冻结主模型，用完整 Attention 提供监督。</text></svg>
