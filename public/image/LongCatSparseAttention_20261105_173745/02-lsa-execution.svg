<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">LSA 的一次完整执行</title><desc id="desc">512K Prefill 的一个查询在已启用 HI 的 Owner Layer 中保留固定区域，先筛 Page 再选动态 Token。最终位置集合供相邻两个层各自计算 Attention，复用位置而不共享 KV 或输出。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.t{font-size:34px;font-weight:650}.h{font-size:26px;font-weight:600}.b{font-size:23px}.s{font-size:21px;fill:#64748b}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f8fafc"/><text x="60" y="70" class="t">LSA：选哪些位置、怎样选择、由哪些层复用</text><text x="60" y="110" class="s">512K Prefill 中一个 Query 的示意 · 选择已启用 HI 的 Owner Layer · 默认两层一组</text>
<rect x="60" y="150" width="1480" height="365" rx="20" fill="white" stroke="#dce3ec"/>
<text x="90" y="193" class="h">Owner Layer：生成本 Query 的选择集合</text>
<rect x="90" y="225" width="330" height="100" rx="14" fill="#edf8f2" stroke="#91bda6"/><text x="255" y="265" text-anchor="middle" class="h">SI：直接保留固定区域</text><text x="255" y="300" text-anchor="middle" class="b">Sink 16 + Window 1024</text>
<rect x="90" y="370" width="330" height="100" rx="14" fill="#fff6e9" stroke="#d9b17d"/><text x="255" y="410" text-anchor="middle" class="h">其余可见历史位置</text><text x="255" y="445" text-anchor="middle" class="s">动态预算：1008 个 Token</text>
<rect x="490" y="370" width="245" height="100" rx="14" fill="#fff6e9" stroke="#d9b17d"/><text x="612" y="410" text-anchor="middle" class="h">HI：Page 粗筛</text><text x="612" y="445" text-anchor="middle" class="s">最多 1024 个候选页</text>
<rect x="800" y="370" width="260" height="100" rx="14" fill="#fff6e9" stroke="#d9b17d"/><text x="930" y="410" text-anchor="middle" class="h">Token 精筛</text><text x="930" y="445" text-anchor="middle" class="s">最终选出 1008 个位置</text>
<path d="M420 420 H490 M735 420 H800" class="a"/>
<text x="645" y="329" class="s">候选约 128K Token，仍需进一步选择</text>
<rect x="1170" y="240" width="330" height="210" rx="16" fill="#edf3fd" stroke="#9bb4db"/><text x="1335" y="288" text-anchor="middle" class="h">最终位置集合</text><text x="1335" y="332" text-anchor="middle" class="b">16 + 1024 + 1008</text><text x="1335" y="370" text-anchor="middle" class="h">共 2048 个位置</text><text x="1335" y="414" text-anchor="middle" class="s">集合中只有位置，没有 KV 值</text>
<path d="M420 275 H1170 M1060 420 H1170" class="a"/>
<rect x="60" y="555" width="710" height="245" rx="18" fill="#edf3fd" stroke="#9bb4db"/><text x="90" y="601" class="h">Owner Layer 的 Attention</text><text x="90" y="650" class="b">本层 Query + 本层所选位置的 KV</text><text x="90" y="694" class="s">连续窗口与动态稀疏区域分别计算，再合并</text><text x="90" y="753" class="h">→ 得到 Owner Layer 的输出</text>
<rect x="810" y="555" width="730" height="245" rx="18" fill="#f2effb" stroke="#b6a9d2"/><text x="840" y="601" class="h">Reuse Layer 的 Attention</text><text x="840" y="650" class="b">下一层 Query + 下一层同一组位置的 KV</text><text x="840" y="694" class="s">CLI：不再执行 Indexer，Attention 仍独立计算</text><text x="840" y="753" class="h">→ 得到 Reuse Layer 的输出</text>
<path d="M1335 450 V535 H420 V555 M1335 535 V555" class="a"/><rect x="635" y="519" width="420" height="34" rx="8" fill="#f8fafc"/><text x="845" y="544" text-anchor="middle" class="s">CLI：同一位置集合，供两层使用</text>
<text x="60" y="850" class="s">下方两框表示位置集合的两个使用者，层间前向仍按顺序执行；较短上下文可关闭 HI，直接做 Token 级选择。</text>
<text x="60" y="881" class="s">根据论文 Section 3 绘制。示例假定历史足够长，固定区域互不重叠；图中数量不表示 KV Cache 被压缩。</text>
</svg>
