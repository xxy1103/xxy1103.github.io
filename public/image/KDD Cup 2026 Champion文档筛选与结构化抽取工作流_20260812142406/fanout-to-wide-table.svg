<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
  <title id="title">文档属性分块到宽表</title>
  <desc id="desc">同一批实体的基本信息和季度收益分散在两个文档区块，两个 worker 分别抽取子表，再按 record_id 外连接为宽表。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.th{font:700 12px "Microsoft YaHei",sans-serif;fill:#fff}.td{font:400 12px "Microsoft YaHei",sans-serif;fill:#3d5369}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="710" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">Fan-out：先按属性块抽子表，再按 record_id 拼回完整记录</text>
  <text x="52" y="88" class="body">适合“同一批实体在文档不同段落重复出现、每段只描述一组属性”的叙事结构。</text>

  <rect x="42" y="128" width="318" height="474" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="68" y="165" class="h2">原始文档（带行号）</text>
  <rect x="68" y="190" width="266" height="154" rx="13" fill="#e8f1fb"/>
  <text x="88" y="218" class="code">0001  基本信息</text><text x="88" y="247" class="body">0002  P01：Alpha，股票型</text><text x="88" y="276" class="body">0003  P02：Beta，债券型</text><text x="88" y="315" class="small">Section 1：名称与类型</text>
  <rect x="68" y="366" width="266" height="184" rx="13" fill="#f0eafb"/>
  <text x="88" y="394" class="code">0005  季度收益</text><text x="88" y="423" class="body">0006  P01：3.2%，1.8%</text><text x="88" y="452" class="body">0007  P02：1.1%，1.4%</text><text x="88" y="491" class="small">Section 2：Q1 与 Q2 收益</text><text x="88" y="526" class="small">record_universe = [P01, P02]</text>

  <path d="M360 258 H420" class="arrow"/><path d="M360 458 H420" class="arrow"/>
  <rect x="422" y="128" width="350" height="474" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="448" y="165" class="h2">并行 section 子表</text>
  <text x="448" y="198" class="small">Worker 1：基本信息</text>
  <rect x="448" y="216" width="298" height="126" rx="10" fill="#eef4fa"/>
  <rect x="448" y="216" width="298" height="31" rx="10" fill="#356aa0"/><text x="461" y="236" class="th">line</text><text x="503" y="236" class="th">id</text><text x="553" y="236" class="th">name</text><text x="652" y="236" class="th">type</text>
  <text x="461" y="276" class="td">2</text><text x="503" y="276" class="td">P01</text><text x="553" y="276" class="td">Alpha</text><text x="652" y="276" class="td">股票型</text>
  <text x="461" y="315" class="td">3</text><text x="503" y="315" class="td">P02</text><text x="553" y="315" class="td">Beta</text><text x="652" y="315" class="td">债券型</text>
  <text x="448" y="385" class="small">Worker 2：季度收益</text>
  <rect x="448" y="403" width="298" height="126" rx="10" fill="#f5f0fa"/>
  <rect x="448" y="403" width="298" height="31" rx="10" fill="#7655a6"/><text x="461" y="423" class="th">line</text><text x="503" y="423" class="th">id</text><text x="553" y="423" class="th">q1</text><text x="652" y="423" class="th">q2</text>
  <text x="461" y="463" class="td">6</text><text x="503" y="463" class="td">P01</text><text x="553" y="463" class="td">3.2%</text><text x="652" y="463" class="td">1.8%</text>
  <text x="461" y="502" class="td">7</text><text x="503" y="502" class="td">P02</text><text x="553" y="502" class="td">1.1%</text><text x="652" y="502" class="td">1.4%</text>
  <text x="448" y="570" class="small">每张子表都必须覆盖全部 ID</text>

  <path d="M772 365 H842" class="arrow"/>
  <rect x="844" y="176" width="386" height="378" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="214" class="h2">按 record_id 合并后的宽表</text>
  <rect x="870" y="244" width="334" height="148" rx="10" fill="#fff"/>
  <rect x="870" y="244" width="334" height="34" rx="10" fill="#356aa0"/>
  <text x="884" y="266" class="th">id</text><text x="924" y="266" class="th">name</text><text x="995" y="266" class="th">type</text><text x="1061" y="266" class="th">q1</text><text x="1124" y="266" class="th">q2</text>
  <text x="884" y="310" class="td">P01</text><text x="924" y="310" class="td">Alpha</text><text x="995" y="310" class="td">股票型</text><text x="1061" y="310" class="td">3.2%</text><text x="1124" y="310" class="td">1.8%</text>
  <text x="884" y="356" class="td">P02</text><text x="924" y="356" class="td">Beta</text><text x="995" y="356" class="td">债券型</text><text x="1061" y="356" class="td">1.1%</text><text x="1124" y="356" class="td">1.4%</text>
  <rect x="870" y="420" width="334" height="92" rx="12" fill="#fff" opacity=".94"/>
  <text x="892" y="450" class="body">业务表：不含 __src_line</text>
  <text x="892" y="478" class="body">provenance：保留每个 section 的来源行</text>
  <text x="892" y="500" class="small">P01 → section 1: line 2, section 2: line 6</text>

  <rect x="42" y="628" width="1188" height="42" rx="12" fill="#e8eef6"/>
  <text x="68" y="654" class="body">关键约束：每个 worker 都输出完整实体全集；没有数据时填 NULL，因此合并后不会因为局部缺值丢掉整条记录。</text>
</svg>
