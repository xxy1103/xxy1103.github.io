<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Doc Relevance Agent 多轮投票与安全兜底</title>
  <desc id="desc">默认并发收集五个成功轮次，逐文档多数投票，平票、遗漏和全部失败都按召回优先处理。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.yes{font:700 14px "Microsoft YaHei",sans-serif;fill:#3f805d}.no{font:700 14px "Microsoft YaHei",sans-serif;fill:#a05a5a}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="680" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">五轮投票降低抖动，失败时优先“不漏文档”</text>
  <text x="54" y="88" class="subtitle">每轮独立输出整份 doc 清单；聚合时按文档分别计票，而不是给 task 做一个总判断。</text>

  <rect x="50" y="130" width="340" height="414" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="78" y="168" class="h2">并发收集成功轮次</text>
  <text x="78" y="195" class="small">目标：5 个成功轮；失败/超时会有限补跑</text>
  <g>
    <rect x="78" y="222" width="284" height="46" rx="11" fill="#f0eafb"/><text x="98" y="251" class="body">Round 1　产品档案 ✓　月报 ✗</text>
    <rect x="78" y="280" width="284" height="46" rx="11" fill="#f0eafb"/><text x="98" y="309" class="body">Round 2　产品档案 ✓　月报 ✗</text>
    <rect x="78" y="338" width="284" height="46" rx="11" fill="#f0eafb"/><text x="98" y="367" class="body">Round 3　产品档案 ✓　月报 ✗</text>
    <rect x="78" y="396" width="284" height="46" rx="11" fill="#f0eafb"/><text x="98" y="425" class="body">Round 4　产品档案 ✓　月报 ✓</text>
    <rect x="78" y="454" width="284" height="46" rx="11" fill="#f0eafb"/><text x="98" y="483" class="body">Round 5　产品档案 ✓　月报 ✗</text>
  </g>

  <path d="M390 337 H470" class="arrow"/>
  <rect x="472" y="130" width="330" height="414" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="168" class="h2">逐 doc 聚合</text>
  <rect x="500" y="204" width="274" height="108" rx="14" fill="#fff" opacity=".94"/>
  <text x="522" y="236" class="h2">产品档案</text><text x="522" y="266" class="yes">5 / 5 → relevant</text><text x="522" y="291" class="small">多数理由中选择一致的一条</text>
  <rect x="500" y="328" width="274" height="108" rx="14" fill="#fff" opacity=".94"/>
  <text x="522" y="360" class="h2">行业月报</text><text x="522" y="390" class="no">1 / 5 → skipped</text><text x="522" y="415" class="small">4 票认为解题不需要</text>
  <text x="500" y="478" class="body">判定公式：yes × 2 ≥ 有效票数</text>
  <text x="500" y="507" class="small">因此平票也会判 relevant</text>

  <path d="M802 337 H882" class="arrow"/>
  <rect x="884" y="130" width="344" height="414" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="912" y="168" class="h2">安全兜底</text>
  <rect x="912" y="204" width="288" height="70" rx="13" fill="#fff1dc"/><text x="934" y="232" class="body">某轮遗漏某 doc</text><text x="934" y="255" class="small">该轮弃权，不当作 false</text>
  <rect x="912" y="290" width="288" height="82" rx="13" fill="#fff1dc"/><text x="934" y="318" class="body">所有成功轮都遗漏</text><text x="934" y="342" class="small">0/0（默认相关）</text>
  <rect x="912" y="388" width="288" height="82" rx="13" fill="#f8e6e6"/><text x="934" y="416" class="body">所有模型调用失败</text><text x="934" y="440" class="small">全部相关，退回抽取所有 doc</text>
  <text x="912" y="508" class="small">代价取舍：多抽取低代价，漏关键文档高代价</text>

  <rect x="50" y="588" width="1178" height="48" rx="13" fill="#dff3e8"/>
  <text x="78" y="618" class="body">最终只把 relevant_docs 传给 doc_prepare；任何异常都不会让当前 task 因“筛选器失灵”而失去全部文档。</text>
</svg>
