<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Doc Prepare 校验、重试与降级</title>
  <desc id="desc">Planner、section 表和字段归一化分别经过确定性检查，并按不同粒度重试或保留原值。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.ok{font:700 14px "Microsoft YaHei",sans-serif;fill:#3f805d}.warn{font:700 14px "Microsoft YaHei",sans-serif;fill:#a36b29}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="700" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">正确性保障按三层执行：计划、子表、格式转换</text>
  <text x="54" y="88" class="subtitle">程序负责检查可判定的结构事实；模型负责理解文档语义。失败只影响最小必要范围。</text>

  <rect x="48" y="130" width="360" height="468" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="76" y="168" class="h2">① Planner JSON</text>
  <rect x="76" y="196" width="304" height="180" rx="14" fill="#e8f1fb"/>
  <text x="98" y="226" class="body">✓ sections / universe / schema 齐全</text>
  <text x="98" y="258" class="body">✓ record_id 存在且 ID 不重复</text>
  <text x="98" y="290" class="body">✓ 列名为 snake_case</text>
  <text x="98" y="322" class="body">✓ 行号范围和列定义有效</text>
  <text x="98" y="354" class="small">当前不强制验证跨 section 全覆盖</text>
  <path d="M228 376 V420" class="arrow"/>
  <rect x="76" y="422" width="304" height="114" rx="14" fill="#fff1dc"/>
  <text x="98" y="452" class="warn">失败 → 带错误重试一次</text>
  <text x="98" y="483" class="body">再次失败：当前文档失败</text>
  <text x="98" y="512" class="small">其他文档和主流程继续</text>

  <rect x="460" y="130" width="360" height="468" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="488" y="168" class="h2">② Section Markdown 表</text>
  <rect x="488" y="196" width="304" height="180" rx="14" fill="#f0eafb"/>
  <text x="510" y="226" class="body">✓ 未被 max_tokens 截断</text>
  <text x="510" y="258" class="body">✓ 表头、列数严格匹配</text>
  <text x="510" y="290" class="body">✓ 行数 = 实体全集大小</text>
  <text x="510" y="322" class="body">✓ 无缺失、额外、重复 ID</text>
  <text x="510" y="354" class="small">__src_line 可缺，但业务表不能因此失败</text>
  <path d="M640 376 V420" class="arrow"/>
  <rect x="488" y="422" width="304" height="114" rx="14" fill="#fff1dc"/>
  <text x="510" y="452" class="warn">失败 → 只重跑该 section</text>
  <text x="510" y="483" class="body">再次失败：保留尽力结果</text>
  <text x="510" y="512" class="small">n_failed_sections 记录风险</text>

  <rect x="872" y="130" width="360" height="468" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="900" y="168" class="h2">③ Column normalize</text>
  <rect x="900" y="196" width="304" height="180" rx="14" fill="#e8f1fb"/>
  <text x="922" y="226" class="body">✓ 只处理 plan 声明的业务列</text>
  <text x="922" y="258" class="body">✓ 用全量 distinct 原值试跑</text>
  <text x="922" y="290" class="body">✓ 生成代码隔离在子进程</text>
  <text x="922" y="322" class="body">✓ 超时、异常、返回类型受控</text>
  <text x="922" y="354" class="small">空值和 NULL 不进入转换</text>
  <path d="M1052 376 V420" class="arrow"/>
  <rect x="900" y="422" width="304" height="114" rx="14" fill="#dff3e8"/>
  <text x="922" y="452" class="ok">失败 → 当前 cell 保留原值</text>
  <text x="922" y="483" class="body">其他行、列和文档继续</text>
  <text x="922" y="512" class="small">normalize_stats 记录错误与样例</text>

  <rect x="48" y="626" width="1184" height="42" rx="12" fill="#e8eef6"/>
  <text x="74" y="652" class="body">边界：这些校验能保证形状、覆盖和运行安全，但不能证明 Planner 的语义理解或每个抽取值必然正确；关键结果仍需沿 provenance 回查原文。</text>
</svg>
