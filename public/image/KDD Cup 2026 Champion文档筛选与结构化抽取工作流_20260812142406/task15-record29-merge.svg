<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">task_15 record 29 的四段合并</title>
  <desc id="desc">record 29 的公司、交易、转让方和受让方信息分散在文档四个区块，四个 worker 分别抽取后按 record_id 合并，并保存来源行号。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">record 29：四个相距很远的自然段，最后合并成一行</text>
  <text x="52" y="88" class="body">每个 worker 都看全文，但只抽自己的属性块；record_id 是跨 section 的连接键。</text>

  <rect x="48" y="126" width="446" height="502" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="76" y="164" class="h2">lc_sharetransfer.md</text>
  <rect x="76" y="190" width="390" height="82" rx="13" fill="#e8f1fb"/>
  <text x="96" y="216" class="code">line 3 · 基础信息</text><text x="96" y="242" class="body">威唐工业 · 300707 · internal 237318</text><text x="96" y="261" class="small">另含一段办公流程噪音</text>
  <rect x="76" y="292" width="390" height="82" rx="13" fill="#f0eafb"/>
  <text x="96" y="318" class="code">line 107 · 交易规模</text><text x="96" y="344" class="body">2018-11-14 · 300,000 股</text><text x="96" y="363" class="small">占转让方持股 0.122864 · 总股本 0.001910</text>
  <rect x="76" y="394" width="390" height="96" rx="13" fill="#fff1dc"/>
  <text x="96" y="420" class="code">line 211 · 转让方</text><text x="96" y="446" class="body">无锡国经精益制造投资企业</text><text x="96" y="468" class="body">2,441,732 股 / 1.55% → 2,141,732 / 1.36%</text>
  <rect x="76" y="510" width="390" height="82" rx="13" fill="#eef2f6"/>
  <text x="96" y="536" class="code">line 315 · 受让方</text><text x="96" y="562" class="body">受让方身份和持股数据未提供</text><text x="96" y="581" class="small">业务字段 NULL，噪音句单独隔离</text>

  <path d="M494 376 H570" class="arrow"/>
  <rect x="572" y="158" width="274" height="438" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="196" class="h2">按 record_id = 29 合并</text>
  <text x="600" y="235" class="code">secucode</text><text x="735" y="235" class="body">300707</text>
  <text x="600" y="270" class="code">tran_date</text><text x="735" y="270" class="body">2018-11-14</text>
  <text x="600" y="305" class="code">share_qty</text><text x="735" y="305" class="body">300000</text>
  <text x="600" y="340" class="code">transferor</text><text x="600" y="365" class="small">无锡国经精益制造投资企业</text>
  <text x="600" y="405" class="code">sum_before</text><text x="735" y="405" class="body">2441732</text>
  <text x="600" y="440" class="code">pct_before</text><text x="735" y="440" class="body">1.55</text>
  <text x="600" y="475" class="code">sum_after</text><text x="735" y="475" class="body">2141732</text>
  <rect x="600" y="510" width="218" height="58" rx="11" fill="#fff"/>
  <text x="616" y="535" class="code">provenance</text><text x="616" y="557" class="small">1:3 · 2:107 · 3:211 · 4:315</text>

  <path d="M846 376 H922" class="arrow"/>
  <rect x="924" y="212" width="306" height="330" rx="20" fill="#dff3e8" stroke="#4b936d" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="952" y="250" class="h2">SQLite 中的一行</text>
  <rect x="952" y="278" width="250" height="184" rx="13" fill="#fff" opacity=".94"/>
  <text x="972" y="308" class="body">一行 = 一次股权转让记录</text>
  <text x="972" y="341" class="body">可直接按 secucode 过滤</text>
  <text x="972" y="374" class="body">可选出让前数量与比例</text>
  <text x="972" y="407" class="body">无需 solver 再读 427 行原文</text>
  <text x="972" y="440" class="small">有疑问时仍可沿行号回查</text>
  <text x="952" y="505" class="code">SELECT ... WHERE</text>
  <text x="952" y="528" class="code">secucode = '300707'</text>

  <rect x="48" y="656" width="1182" height="38" rx="12" fill="#e8eef6"/>
  <text x="74" y="681" class="body">Fan-out 的价值不是“多调用几个模型”，而是先把同一实体散落在不同属性块中的事实对齐到同一个 record_id。</text>
</svg>
