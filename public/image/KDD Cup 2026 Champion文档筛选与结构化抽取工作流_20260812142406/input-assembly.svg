<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Doc Relevance Agent 输入装配</title>
  <desc id="desc">question、knowledge、视频文本和逐文档预览被组织成一次结构化判断输入。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="650" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">模型看到的是“任务依据 + 全部候选文档的短预览”</text>
  <text x="52" y="88" class="body">一次横向比较全部 doc，避免逐份孤立判断时看不清哪份才是必要的数据入口。</text>

  <rect x="52" y="130" width="320" height="420" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="80" y="168" class="h2">输入来源</text>
  <rect x="80" y="194" width="264" height="54" rx="12" fill="#e8f1fb"/><text x="100" y="218" class="code">task.json.question</text><text x="100" y="238" class="small">题目目标</text>
  <rect x="80" y="262" width="264" height="70" rx="12" fill="#e8f1fb"/><text x="100" y="286" class="code">context/knowledge.md</text><text x="100" y="307" class="small">最多 8,000 字符</text>
  <rect x="80" y="346" width="264" height="84" rx="12" fill="#f0eafb"/><text x="100" y="371" class="code">video_input.json</text><text x="100" y="393" class="body">旁白 + hiccup 版面文字</text><text x="100" y="414" class="small">最多 6,000 字符</text>
  <rect x="80" y="444" width="264" height="78" rx="12" fill="#fff1dc"/><text x="100" y="469" class="code">context/doc/*</text><text x="100" y="491" class="body">每 stem 前 40 行预览</text><text x="100" y="512" class="small">单行最多 400 字符</text>

  <path d="M372 340 H448" class="arrow"/>
  <rect x="450" y="112" width="410" height="456" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="478" y="150" class="h2">拼成一条 user_input</text>
  <rect x="478" y="176" width="354" height="350" rx="14" fill="#fff" opacity=".94"/>
  <text x="500" y="207" class="code">## task question</text><text x="500" y="231" class="body">统计产品 P1001 的季度收益率</text>
  <text x="500" y="274" class="code">## knowledge</text><text x="500" y="298" class="body">外部代码需映射到内部 ID</text>
  <text x="500" y="341" class="code">## 视频口径</text><text x="500" y="365" class="body">先查产品档案，再查收益</text>
  <text x="500" y="408" class="code">## 候选 doc 清单</text><text x="500" y="432" class="body">产品档案：代码 ↔ ID</text><text x="500" y="456" class="body">行业月报：市场趋势</text>
  <text x="500" y="497" class="small">每份文档以原 stem 标识</text>

  <path d="M860 340 H936" class="arrow"/>
  <rect x="938" y="164" width="290" height="352" rx="20" fill="#f0eafb" stroke="#a98ac8" stroke-width="2" filter="url(#shadow)"/>
  <text x="966" y="204" class="h2">结构化判定</text>
  <text x="966" y="244" class="code">doc_name</text><text x="1065" y="244" class="body">原 stem</text>
  <text x="966" y="281" class="code">reason</text><text x="1065" y="281" class="body">先说明依据</text>
  <text x="966" y="318" class="code">relevant</text><text x="1065" y="318" class="body">再给 true/false</text>
  <rect x="966" y="356" width="234" height="112" rx="13" fill="#fff" opacity=".92"/>
  <text x="986" y="385" class="body">产品档案 → true</text>
  <text x="986" y="415" class="body">行业月报 → false</text>
  <text x="986" y="446" class="small">必须覆盖全部候选 doc</text>

  <rect x="52" y="588" width="1176" height="38" rx="12" fill="#e8eef6"/>
  <text x="77" y="613" class="body">注意：这里只读取短预览，不会在相关性阶段创建数据库、执行 SQL 或抽取完整文档。</text>
</svg>
