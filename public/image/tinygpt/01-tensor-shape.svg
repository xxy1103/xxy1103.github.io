<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">拆开 [B,T,d]</title><desc id="desc">B为序列数量，T为每条序列的位置数，d为每个位置的数字数量。左侧选第一条序列，中间查看三行四列的矩阵，右侧放大第二行向量。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53758c"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c50}.t{font-size:44px;font-weight:700}.h{font-size:32px;font-weight:600}.b{font-size:28px}.s{font-size:26px}.arrow{fill:none;stroke:#53758c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="80" class="t" text-anchor="start">[B,T,d]：先选序列，再选位置，最后选分量</text><text x="64" y="132" class="b" text-anchor="start">示例 shape = [2,3,4]，共有 2 × 3 × 4 = 24 个数。</text><rect x="64" y="190" width="330" height="90" rx="16" fill="#e9e8f7" stroke="none" stroke-width="2"/><text x="88" y="229" class="h" text-anchor="start">B = 2</text><text x="88" y="266" class="s" text-anchor="start">两条序列</text><rect x="470" y="190" width="570" height="90" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="494" y="229" class="h" text-anchor="start">T = 3</text><text x="494" y="266" class="s" text-anchor="start">每条三个位置</text><rect x="1120" y="190" width="416" height="90" rx="16" fill="#fff0df" stroke="none" stroke-width="2"/><text x="1144" y="229" class="h" text-anchor="start">d = 4</text><text x="1144" y="266" class="s" text-anchor="start">每个位置四个数</text><rect x="64" y="330" width="330" height="150" rx="16" fill="#fff" stroke="#b3a9d4" stroke-width="2"/><text x="88" y="373" class="h" text-anchor="start">序列 1</text><text x="88" y="435" class="b" text-anchor="start">我 / 今天 / 想</text><rect x="64" y="520" width="330" height="150" rx="16" fill="#fff" stroke="#b3a9d4" stroke-width="2"/><text x="88" y="563" class="h" text-anchor="start">序列 2</text><text x="88" y="625" class="b" text-anchor="start">你 / 明天 / 去</text><path d="M394 406H454" class="arrow"/><text x="470" y="327" class="h" text-anchor="start">展开第一条序列：[3,4]</text><rect x="470" y="365" width="570" height="82" rx="16" fill="#fff" stroke="#a8c4b5" stroke-width="2"/><text x="493" y="416" class="b" text-anchor="start">我</text><text x="654" y="416" class="b" text-anchor="middle">0.2</text><text x="752" y="416" class="b" text-anchor="middle">0.8</text><text x="850" y="416" class="b" text-anchor="middle">−0.1</text><text x="948" y="416" class="b" text-anchor="middle">0.5</text><rect x="470" y="465" width="570" height="82" rx="16" fill="#d7eadd" stroke="#a8c4b5" stroke-width="2"/><text x="493" y="516" class="b" text-anchor="start">今天</text><text x="654" y="516" class="b" text-anchor="middle">0.7</text><text x="752" y="516" class="b" text-anchor="middle">0.1</text><text x="850" y="516" class="b" text-anchor="middle">0.4</text><text x="948" y="516" class="b" text-anchor="middle">0.9</text><rect x="470" y="565" width="570" height="82" rx="16" fill="#fff" stroke="#a8c4b5" stroke-width="2"/><text x="493" y="616" class="b" text-anchor="start">想</text><text x="654" y="616" class="b" text-anchor="middle">0.3</text><text x="752" y="616" class="b" text-anchor="middle">0.6</text><text x="850" y="616" class="b" text-anchor="middle">0.8</text><text x="948" y="616" class="b" text-anchor="middle">0.2</text><text x="470" y="704" class="s" text-anchor="start">每行 = 一个位置的向量</text><path d="M1040 506H1100" class="arrow"/><text x="1120" y="376" class="h" text-anchor="start">取第二个位置：[4]</text><rect x="1120" y="425" width="92" height="80" rx="16" fill="#fff0df" stroke="#d8b990" stroke-width="2"/><text x="1166" y="476" class="b" text-anchor="middle">0.7</text><rect x="1224" y="425" width="92" height="80" rx="16" fill="#fff0df" stroke="#d8b990" stroke-width="2"/><text x="1270" y="476" class="b" text-anchor="middle">0.1</text><rect x="1328" y="425" width="92" height="80" rx="16" fill="#fff0df" stroke="#d8b990" stroke-width="2"/><text x="1374" y="476" class="b" text-anchor="middle">0.4</text><rect x="1432" y="425" width="92" height="80" rx="16" fill="#fff0df" stroke="#d8b990" stroke-width="2"/><text x="1478" y="476" class="b" text-anchor="middle">0.9</text><text x="1120" y="565" class="b" text-anchor="start">[0.7, 0.1, 0.4, 0.9]</text><text x="1120" y="616" class="s" text-anchor="start">这里的数字是教学示例。</text><rect x="64" y="771" width="1472" height="73" rx="16" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="91" y="818" class="b" text-anchor="start">x[0] → 一条序列 [3,4]     x[0,1] → 一个向量 [4]     x[0,1,2] → 一个数</text></svg>