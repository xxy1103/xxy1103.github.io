<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Embedding：编号选行，向量按输入顺序排列</title><desc id="desc">输入编号1、2、1，从六行四列的Embedding表分别取出行1、2、1。相同编号取相同行，输出为三行四列。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53758c"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c50}.t{font-size:44px;font-weight:700}.h{font-size:32px;font-weight:600}.b{font-size:28px}.s{font-size:26px}.arrow{fill:none;stroke:#53758c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="80" class="t" text-anchor="start">Embedding：根据编号取出对应行，再按输入顺序排列</text><text x="64" y="133" class="b" text-anchor="start">参数表保存所有 token 的向量；本次输出只取输入需要的那些行。</text><text x="64" y="224" class="h" text-anchor="start">输入编号 [1,2,1]</text><text x="480" y="224" class="h" text-anchor="start">Embedding 表 [6,4]</text><text x="1110" y="224" class="h" text-anchor="start">输出向量 [3,4]</text><rect x="64" y="285" width="275" height="95" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="90" y="324" class="s" text-anchor="start">位置 1</text><text x="90" y="362" class="h" text-anchor="start">1：我</text><rect x="64" y="425" width="275" height="95" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="90" y="464" class="s" text-anchor="start">位置 2</text><text x="90" y="502" class="h" text-anchor="start">2：今天</text><rect x="64" y="565" width="275" height="95" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="90" y="604" class="s" text-anchor="start">位置 3</text><text x="90" y="642" class="h" text-anchor="start">1：我</text><rect x="480" y="264" width="555" height="62" rx="8" fill="#fff" stroke="#b8c9d3" stroke-width="2"/><text x="497" y="305" class="s" text-anchor="start">0 米饭</text><text x="683" y="305" class="s" text-anchor="middle">0.1</text><text x="778" y="305" class="s" text-anchor="middle">0.2</text><text x="873" y="305" class="s" text-anchor="middle">0.3</text><text x="968" y="305" class="s" text-anchor="middle">0.4</text><rect x="480" y="337" width="555" height="62" rx="8" fill="#e8f1f9" stroke="#b8c9d3" stroke-width="2"/><text x="497" y="378" class="s" text-anchor="start">1 我</text><text x="683" y="378" class="s" text-anchor="middle">0.2</text><text x="778" y="378" class="s" text-anchor="middle">0.8</text><text x="873" y="378" class="s" text-anchor="middle">−0.1</text><text x="968" y="378" class="s" text-anchor="middle">0.5</text><rect x="480" y="410" width="555" height="62" rx="8" fill="#e5f1ec" stroke="#b8c9d3" stroke-width="2"/><text x="497" y="451" class="s" text-anchor="start">2 今天</text><text x="683" y="451" class="s" text-anchor="middle">0.7</text><text x="778" y="451" class="s" text-anchor="middle">0.1</text><text x="873" y="451" class="s" text-anchor="middle">0.4</text><text x="968" y="451" class="s" text-anchor="middle">0.9</text><rect x="480" y="483" width="555" height="62" rx="8" fill="#fff" stroke="#b8c9d3" stroke-width="2"/><text x="497" y="524" class="s" text-anchor="start">3 想</text><text x="683" y="524" class="s" text-anchor="middle">0.3</text><text x="778" y="524" class="s" text-anchor="middle">0.6</text><text x="873" y="524" class="s" text-anchor="middle">0.8</text><text x="968" y="524" class="s" text-anchor="middle">0.2</text><rect x="480" y="556" width="555" height="62" rx="8" fill="#fff" stroke="#b8c9d3" stroke-width="2"/><text x="497" y="597" class="s" text-anchor="start">4 吃</text><text x="683" y="597" class="s" text-anchor="middle">0.4</text><text x="778" y="597" class="s" text-anchor="middle">0.2</text><text x="873" y="597" class="s" text-anchor="middle">0.1</text><text x="968" y="597" class="s" text-anchor="middle">0.7</text><rect x="480" y="629" width="555" height="62" rx="8" fill="#fff" stroke="#b8c9d3" stroke-width="2"/><text x="497" y="670" class="s" text-anchor="start">5 火锅</text><text x="683" y="670" class="s" text-anchor="middle">0.8</text><text x="778" y="670" class="s" text-anchor="middle">0.3</text><text x="873" y="670" class="s" text-anchor="middle">0.5</text><text x="968" y="670" class="s" text-anchor="middle">0.1</text><rect x="1110" y="285" width="426" height="95" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="1130" y="324" class="s" text-anchor="start">取表中 ID 1 的行</text><text x="1130" y="362" class="s" text-anchor="start">[0.2, 0.8, −0.1, 0.5]</text><rect x="1110" y="425" width="426" height="95" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="1130" y="464" class="s" text-anchor="start">取表中 ID 2 的行</text><text x="1130" y="502" class="s" text-anchor="start">[0.7, 0.1, 0.4, 0.9]</text><rect x="1110" y="565" width="426" height="95" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="1130" y="604" class="s" text-anchor="start">取表中 ID 1 的行</text><text x="1130" y="642" class="s" text-anchor="start">[0.2, 0.8, −0.1, 0.5]</text><path d="M339 331H403V370H470" class="arrow"/><path d="M339 471H423V443H470" class="arrow"/><path d="M339 611H383V370H470" class="arrow"/><path d="M1035 370H1065V331H1100" class="arrow"/><path d="M1035 443H1078V471H1100" class="arrow"/><path d="M1065 370V611H1100" class="arrow"/><rect x="64" y="770" width="1472" height="80" rx="16" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="90" y="820" class="b" text-anchor="start">加上批维度后：[B,T] → [B,T,d]；表的大小始终是 [V_vocab,d]。</text></svg>