<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">temperature 与 top-k：一个改变概率，一个划定资格</title>
<desc id="desc">同一组五个候选：很、在、开、猫、山。temperature 为 2 时概率分布更平，为 1 时保持原样，为 0.5 时更尖，但五个候选都仍有概率。top-k 取 3 时，只保留前三名并重新计算概率，猫和山被直接排除，不会被抽到。</desc>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#23374a}.title{font-size:42px;font-weight:700}.head{font-size:29px;font-weight:600}.body{font-size:24px}.small{font-size:21px}.lab{font-size:30px;font-weight:600;text-anchor:middle}.val{font-size:21px;text-anchor:middle}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#657c92"/></marker></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="70" y="75" class="title">两个旋钮：谁更容易被抽到，谁有资格被抽</text>
<text x="70" y="120" class="body">同一组候选：“小兔子”之后，五个字的原始分数依次为 4、3、2、1、0。条越高，被抽到的概率越大。</text>
<rect x="50" y="150" width="1500" height="345" rx="24" fill="#e8f1f9"/>
<text x="80" y="195" class="head">temperature：改变谁更容易被抽到 —— 五个候选都还在</text>
<rect x="80" y="215" width="450" height="265" rx="16" fill="white" stroke="#c3d3e1" stroke-width="2"/>
<text x="100" y="250" class="head">temperature = 2</text>
<rect x="108" y="355.0" width="58" height="45.0" rx="6" fill="#4f8fc4"/>
<text x="137" y="347.0" class="val">0.43</text>
<text x="137" y="430" class="lab">很</text>
<rect x="191" y="372.7" width="58" height="27.3" rx="6" fill="#4f8fc4"/>
<text x="220" y="364.7" class="val">0.26</text>
<text x="220" y="430" class="lab">在</text>
<rect x="274" y="383.4" width="58" height="16.6" rx="6" fill="#4f8fc4"/>
<text x="303" y="375.4" class="val">0.16</text>
<text x="303" y="430" class="lab">开</text>
<rect x="357" y="390.0" width="58" height="10.0" rx="6" fill="#4f8fc4"/>
<text x="386" y="382.0" class="val">0.10</text>
<text x="386" y="430" class="lab">猫</text>
<rect x="440" y="393.9" width="58" height="6.1" rx="6" fill="#4f8fc4"/>
<text x="469" y="385.9" class="val">0.06</text>
<text x="469" y="430" class="lab">山</text>
<text x="305" y="468" class="small" style="text-anchor:middle">差距被压缩，分布更平</text>
<rect x="570" y="215" width="450" height="265" rx="16" fill="white" stroke="#c3d3e1" stroke-width="2"/>
<text x="590" y="250" class="head">temperature = 1</text>
<rect x="598" y="333.2" width="58" height="66.8" rx="6" fill="#4f8fc4"/>
<text x="627" y="325.2" class="val">0.64</text>
<text x="627" y="430" class="lab">很</text>
<rect x="681" y="375.4" width="58" height="24.6" rx="6" fill="#4f8fc4"/>
<text x="710" y="367.4" class="val">0.23</text>
<text x="710" y="430" class="lab">在</text>
<rect x="764" y="391.0" width="58" height="9.0" rx="6" fill="#4f8fc4"/>
<text x="793" y="383.0" class="val">0.09</text>
<text x="793" y="430" class="lab">开</text>
<rect x="847" y="396.0" width="58" height="4.0" rx="6" fill="#4f8fc4"/>
<text x="876" y="388.0" class="val">0.03</text>
<text x="876" y="430" class="lab">猫</text>
<rect x="930" y="396.0" width="58" height="4.0" rx="6" fill="#4f8fc4"/>
<text x="959" y="388.0" class="val">0.01</text>
<text x="959" y="430" class="lab">山</text>
<text x="795" y="468" class="small" style="text-anchor:middle">保持原样</text>
<rect x="1060" y="215" width="450" height="265" rx="16" fill="white" stroke="#c3d3e1" stroke-width="2"/>
<text x="1080" y="250" class="head">temperature = 0.5</text>
<rect x="1088" y="309.2" width="58" height="90.8" rx="6" fill="#4f8fc4"/>
<text x="1117" y="301.2" class="val">0.86</text>
<text x="1117" y="430" class="lab">很</text>
<rect x="1171" y="387.7" width="58" height="12.3" rx="6" fill="#4f8fc4"/>
<text x="1200" y="379.7" class="val">0.12</text>
<text x="1200" y="430" class="lab">在</text>
<rect x="1254" y="396.0" width="58" height="4.0" rx="6" fill="#4f8fc4"/>
<text x="1283" y="388.0" class="val">0.02</text>
<text x="1283" y="430" class="lab">开</text>
<rect x="1337" y="396.0" width="58" height="4.0" rx="6" fill="#4f8fc4"/>
<text x="1366" y="388.0" class="val">&lt;0.01</text>
<text x="1366" y="430" class="lab">猫</text>
<rect x="1420" y="396.0" width="58" height="4.0" rx="6" fill="#4f8fc4"/>
<text x="1449" y="388.0" class="val">&lt;0.01</text>
<text x="1449" y="430" class="lab">山</text>
<text x="1285" y="468" class="small" style="text-anchor:middle">差距被放大，分布更尖</text>
<rect x="50" y="515" width="1500" height="335" rx="24" fill="#fff0df"/>
<text x="80" y="560" class="head">top-k（这里取 k = 3）：改变谁有资格被抽 —— 资格外的直接排除</text>
<rect x="80" y="580" width="560" height="255" rx="16" fill="white" stroke="#e7ccaa" stroke-width="2"/>
<text x="100" y="613" class="body">按分数排名，只留前 3 名</text>
<rect x="105" y="677.3" width="62" height="82.7" rx="6" fill="#d99a3d"/>
<text x="136" y="669.3" class="val">0.64</text>
<text x="136" y="792" class="lab">很</text>
<rect x="210" y="729.6" width="62" height="30.4" rx="6" fill="#d99a3d"/>
<text x="241" y="721.6" class="val">0.23</text>
<text x="241" y="792" class="lab">在</text>
<rect x="315" y="748.8" width="62" height="11.2" rx="6" fill="#d99a3d"/>
<text x="346" y="740.8" class="val">0.09</text>
<text x="346" y="792" class="lab">开</text>
<rect x="420" y="755.9" width="62" height="4.1" rx="6" fill="#e4e8ec" stroke="#aab8c5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="451" y="747.9" class="val">0.03</text>
<text x="451" y="792" class="lab" style="fill:#98a6b3">猫</text>
<rect x="525" y="756.0" width="62" height="4.0" rx="6" fill="#e4e8ec" stroke="#aab8c5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="556" y="748.0" class="val">0.01</text>
<text x="556" y="792" class="lab" style="fill:#98a6b3">山</text>
<path d="M640 705H715" stroke="#657c92" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="678" y="678" text-anchor="middle" class="small">排除</text>
<text x="678" y="740" text-anchor="middle" class="small">重算</text>
<rect x="720" y="580" width="780" height="255" rx="16" fill="white" stroke="#e7ccaa" stroke-width="2"/>
<text x="740" y="613" class="body">只在 3 个有资格的候选里重新分配概率，总和仍为 1</text>
<rect x="765" y="673.5" width="62" height="86.5" rx="6" fill="#d99a3d"/>
<text x="796" y="665.5" class="val">0.67</text>
<text x="796" y="792" class="lab">很</text>
<rect x="855" y="728.2" width="62" height="31.8" rx="6" fill="#d99a3d"/>
<text x="886" y="720.2" class="val">0.24</text>
<text x="886" y="792" class="lab">在</text>
<rect x="945" y="748.3" width="62" height="11.7" rx="6" fill="#d99a3d"/>
<text x="976" y="740.3" class="val">0.09</text>
<text x="976" y="792" class="lab">开</text>
<text x="1066" y="740" class="lab" style="fill:#b45a4a;font-size:38px">✕</text>
<text x="1066" y="792" class="lab" style="fill:#98a6b3">猫</text>
<text x="1156" y="740" class="lab" style="fill:#b45a4a;font-size:38px">✕</text>
<text x="1156" y="792" class="lab" style="fill:#98a6b3">山</text>
<text x="1215" y="680" class="body">“猫”“山”不会再被抽到</text>
<text x="1215" y="722" class="body">前三名仍按概率抽，</text>
<text x="1215" y="758" class="body">不是永远取“很”</text>
<text x="800" y="880" text-anchor="middle" class="small">本章实际使用：先把分数除以 0.8，再只保留前 40 名，最后对它们做 Softmax 并抽样。下半部分以 temperature = 1 的概率为例，上图为 5 个候选的示意。</text>
</svg>
