<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">训练、验证、测试：哪些结果会改变模型？</title>
<desc id="desc">训练集让模型预测并计算误差，通过反向传播更新参数，形成训练循环。训练过程中定期用验证集检查已保存的模型，根据验证成绩选择一个版本，不更新参数。选定模型后使用测试集做最终评估，不更新参数，也不用测试成绩重新挑选版本。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#667c90"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#268163"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#23374a}.title{font-size:42px;font-weight:700}.head{font-size:28px;font-weight:600}.body{font-size:25px}.small{font-size:23px}.box{fill:white;stroke:#c6d4df;stroke-width:2}.arrow{fill:none;stroke:#667c90;stroke-width:3;marker-end:url(#a)}.loop{fill:none;stroke:#268163;stroke-width:3;marker-end:url(#g)}</style>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="70" y="75" class="title">训练、验证、测试：哪些结果会改变模型？</text>
<text x="70" y="122" class="body">训练负责修改参数；验证负责选择版本；测试负责最后检查。</text>
<rect x="60" y="165" width="1480" height="215" rx="22" fill="#e5f1eb"/>
<text x="90" y="207" class="head">① 平时练习：训练集</text>
<rect x="90" y="230" width="260" height="70" rx="14" class="box"/><text x="220" y="274" text-anchor="middle" class="body">训练故事与正确答案</text>
<path d="M350 265H420" class="arrow"/>
<rect x="435" y="230" width="250" height="70" rx="14" class="box"/><text x="560" y="274" text-anchor="middle" class="body">当前模型做预测</text>
<path d="M685 265H755" class="arrow"/>
<rect x="770" y="230" width="275" height="70" rx="14" class="box"/><text x="907" y="274" text-anchor="middle" class="body">与答案比较，计算误差</text>
<path d="M1045 265H1115" class="arrow"/>
<rect x="1130" y="230" width="375" height="70" rx="14" fill="#268163"/><text x="1317" y="274" text-anchor="middle" class="body" style="fill:white">反向传播 → 更新参数</text>
<path d="M1317 300V345H560V305" class="loop"/>
<rect x="755" y="322" width="365" height="38" rx="12" fill="#e5f1eb"/><text x="937" y="349" text-anchor="middle" class="small" style="fill:#217354">更新后的模型，继续下一轮练习</text>
<rect x="60" y="400" width="1480" height="205" rx="22" fill="#e8f1f9"/>
<text x="90" y="442" class="head">② 阶段测验：验证集（训练过程中定期使用）</text>
<rect x="90" y="465" width="260" height="70" rx="14" class="box"/><text x="220" y="509" text-anchor="middle" class="body">验证故事与正确答案</text>
<path d="M350 500H420" class="arrow"/>
<rect x="435" y="465" width="250" height="70" rx="14" class="box"/><text x="560" y="509" text-anchor="middle" class="body">各次保存的模型</text>
<path d="M685 500H755" class="arrow"/>
<rect x="770" y="465" width="275" height="70" rx="14" class="box"/><text x="907" y="509" text-anchor="middle" class="body">比较验证误差</text>
<path d="M1045 500H1115" class="arrow"/>
<rect x="1130" y="465" width="375" height="70" rx="14" fill="#d4e6f5"/><text x="1317" y="509" text-anchor="middle" class="body">选择验证表现最好的版本</text>
<text x="90" y="577" class="small">只检查，不更新参数。选择已有的模型版本，不是用验证故事再训练一遍。</text>
<rect x="60" y="625" width="1480" height="205" rx="22" fill="#fff0df"/>
<text x="90" y="667" class="head">③ 最终考试：测试集（选定模型后使用）</text>
<rect x="90" y="690" width="260" height="70" rx="14" class="box"/><text x="220" y="734" text-anchor="middle" class="body">测试故事与正确答案</text>
<path d="M350 725H420" class="arrow"/>
<rect x="435" y="690" width="250" height="70" rx="14" class="box"/><text x="560" y="734" text-anchor="middle" class="body">已经选定的模型</text>
<path d="M685 725H755" class="arrow"/>
<rect x="770" y="690" width="275" height="70" rx="14" class="box"/><text x="907" y="734" text-anchor="middle" class="body">计算测试误差</text>
<path d="M1045 725H1115" class="arrow"/>
<rect x="1130" y="690" width="375" height="70" rx="14" fill="#f4dfc2"/><text x="1317" y="734" text-anchor="middle" class="body">报告面对新故事的预测表现</text>
<text x="90" y="802" class="small">只检查，不更新参数。测试成绩不用于重新挑选模型，保留最终评估的意义。</text>
</svg>
