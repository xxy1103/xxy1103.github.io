<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Linear 对每个位置使用同一套参数</title><desc id="desc">输入为B乘T乘4。示意一条序列的三行，每行分别乘同一个4乘6权重矩阵并加同一个偏置，得到B乘T乘6。行之间不混合，参数共30个。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53758c"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c50}.t{font-size:44px;font-weight:700}.h{font-size:32px;font-weight:600}.b{font-size:28px}.s{font-size:26px}.arrow{fill:none;stroke:#53758c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="80" class="t" text-anchor="start">Linear：每个位置用同一套参数，变换最后一维</text><text x="64" y="133" class="b" text-anchor="start">[B,T,4] → Linear(4,6) → [B,T,6]</text><rect x="64" y="181" width="1472" height="76" rx="16" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="91" y="229" class="b" text-anchor="start">下面只展开一条序列的 3 个位置；其他序列也使用相同的 W 和 b。</text><text x="64" y="320" class="h" text-anchor="start">输入：每行 4 个数</text><text x="650" y="320" class="h" text-anchor="start">同一套 W、b</text><text x="1090" y="320" class="h" text-anchor="start">输出：每行 6 个数</text><text x="64" y="414" class="s" text-anchor="start">位置 1</text><rect x="170" y="366" width="53" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="235" y="366" width="53" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="300" y="366" width="53" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="365" y="366" width="53" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><path d="M434 402H632" class="arrow"/><rect x="650" y="366" width="307" height="72" rx="16" fill="#fff" stroke="#91aabd" stroke-width="2"/><text x="803" y="413" class="h" text-anchor="middle">× W  ＋ b</text><path d="M957 402H1070" class="arrow"/><rect x="1090" y="366" width="61" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="1163" y="366" width="61" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="1236" y="366" width="61" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="1309" y="366" width="61" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="1382" y="366" width="61" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><rect x="1455" y="366" width="61" height="72" rx="8" fill="#e5edf9" stroke="#a7bdcc" stroke-width="2"/><text x="64" y="540" class="s" text-anchor="start">位置 2</text><rect x="170" y="492" width="53" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="235" y="492" width="53" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="300" y="492" width="53" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="365" y="492" width="53" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><path d="M434 528H632" class="arrow"/><rect x="650" y="492" width="307" height="72" rx="16" fill="#fff" stroke="#91aabd" stroke-width="2"/><text x="803" y="539" class="h" text-anchor="middle">× W  ＋ b</text><path d="M957 528H1070" class="arrow"/><rect x="1090" y="492" width="61" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="1163" y="492" width="61" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="1236" y="492" width="61" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="1309" y="492" width="61" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="1382" y="492" width="61" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><rect x="1455" y="492" width="61" height="72" rx="8" fill="#e5f1ec" stroke="#a7bdcc" stroke-width="2"/><text x="64" y="666" class="s" text-anchor="start">位置 3</text><rect x="170" y="618" width="53" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="235" y="618" width="53" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="300" y="618" width="53" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="365" y="618" width="53" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><path d="M434 654H632" class="arrow"/><rect x="650" y="618" width="307" height="72" rx="16" fill="#fff" stroke="#91aabd" stroke-width="2"/><text x="803" y="665" class="h" text-anchor="middle">× W  ＋ b</text><path d="M957 654H1070" class="arrow"/><rect x="1090" y="618" width="61" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="1163" y="618" width="61" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="1236" y="618" width="61" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="1309" y="618" width="61" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="1382" y="618" width="61" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><rect x="1455" y="618" width="61" height="72" rx="8" fill="#fff0df" stroke="#a7bdcc" stroke-width="2"/><text x="64" y="777" class="b" text-anchor="start">序列数 B 不变，位置数 T 不变；每个位置从 4 个数变成 6 个数。</text><text x="64" y="835" class="s" text-anchor="start">W：[4,6]，b：[6]，共 4 × 6 + 6 = 30 个参数；参数量与 B、T 无关。</text></svg>