<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">下一个token预测：输入与目标错开一位</title><desc id="desc">四列输入为我、今天、想、吃，目标分别为今天、想、吃、火锅。预测各自使用截至当前位置的前缀。放大最后位置：六个候选中火锅分数2，其余0，火锅概率约0.5964，loss约0.5168。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53758c"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c50}.t{font-size:44px;font-weight:700}.h{font-size:32px;font-weight:600}.b{font-size:28px}.s{font-size:26px}.arrow{fill:none;stroke:#53758c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="80" class="t" text-anchor="start">每个输入位置，都预测自己的下一个 token</text><text x="64" y="133" class="b" text-anchor="start">例句：我 / 今天 / 想 / 吃 / 火锅；取前四个作输入，后四个作目标。</text><text x="64" y="241" class="h" text-anchor="start">输入</text><text x="64" y="406" class="h" text-anchor="start">目标</text><rect x="240" y="190" width="280" height="92" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="380" y="249" class="h" text-anchor="middle">我</text><path d="M380 282V347" class="arrow"/><rect x="240" y="355" width="280" height="92" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="380" y="414" class="h" text-anchor="middle">今天</text><text x="380" y="493" class="s" text-anchor="middle">前缀：我</text><rect x="566" y="190" width="280" height="92" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="706" y="249" class="h" text-anchor="middle">今天</text><path d="M706 282V347" class="arrow"/><rect x="566" y="355" width="280" height="92" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="706" y="414" class="h" text-anchor="middle">想</text><text x="706" y="493" class="s" text-anchor="middle">前缀：我 今天</text><rect x="892" y="190" width="280" height="92" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="1032" y="249" class="h" text-anchor="middle">想</text><path d="M1032 282V347" class="arrow"/><rect x="892" y="355" width="280" height="92" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="1032" y="414" class="h" text-anchor="middle">吃</text><text x="1032" y="493" class="s" text-anchor="middle">前缀：我 今天 想</text><rect x="1218" y="190" width="280" height="92" rx="16" fill="#e8f1f9" stroke="none" stroke-width="2"/><text x="1358" y="249" class="h" text-anchor="middle">吃</text><path d="M1358 282V347" class="arrow"/><rect x="1218" y="355" width="280" height="92" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="1358" y="414" class="h" text-anchor="middle">火锅</text><text x="1358" y="493" class="s" text-anchor="middle">前缀：我 今天 想 吃</text><rect x="64" y="545" width="1472" height="192" rx="16" fill="#fff0e5" stroke="none" stroke-width="2"/><text x="91" y="587" class="h" text-anchor="start">放大最后一个位置：目标是“火锅”</text><text x="91" y="638" class="b" text-anchor="start">六个候选分数：</text><text x="91" y="686" class="b" text-anchor="start">[0,0,0,0,0,2]</text><path d="M405 659H467" class="arrow"/><text x="490" y="638" class="b" text-anchor="start">Softmax 后，“火锅”的概率：</text><text x="490" y="686" class="b" text-anchor="start">exp(2) / (5 + exp(2)) ≈ 0.5964</text><path d="M1035 659H1090" class="arrow"/><text x="1114" y="638" class="b" text-anchor="start">这个位置的 loss：</text><text x="1114" y="686" class="b" text-anchor="start">−ln(0.5964) ≈ 0.5168</text><text x="64" y="802" class="b" text-anchor="start">每列各有一组词表分数，各算一个 loss；本例对四个位置取平均。</text><text x="64" y="849" class="s" text-anchor="start">训练：可同时计算多个位置（须挡住未来）；生成：取最后位置的预测继续追加。</text></svg>