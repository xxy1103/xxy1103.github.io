<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Attention：从匹配到加权读取</title><desc id="desc">同一份输入经三套Linear得到Q、K、V。吃位置的Query与四个Key匹配，缩放分数为0、ln2、0、ln2，Softmax权重为六分之一、六分之二、六分之一、六分之二。四个Value分别为1和0、0和1、2和0、0和2，加权得到0.5和1。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53758c"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c50}.t{font-size:44px;font-weight:700}.h{font-size:32px;font-weight:600}.b{font-size:28px}.s{font-size:26px}.arrow{fill:none;stroke:#53758c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="78" class="t" text-anchor="start">Attention：先决定读多少，再汇总读取的内容</text><text x="64" y="130" class="b" text-anchor="start">只追踪最后一个位置“吃”；它可以读取“我 / 今天 / 想 / 吃”四个位置。</text><rect x="64" y="168" width="1472" height="68" rx="16" fill="#edf2f8"/>
<text x="800" y="212" class="h" text-anchor="middle">同一份输入 X [T,d]：我 / 今天 / 想 / 吃，每个位置一个向量</text>
<path d="M800 236V256H298V284" class="arrow"/>
<path d="M800 256V284" class="arrow"/>
<path d="M800 256H1302V284" class="arrow"/>
<circle cx="800" cy="256" r="5" fill="#53758c"/>
<rect x="64" y="290" width="468" height="100" rx="16" fill="#e8edf9"/>
<text x="88" y="329" class="h">Q：用来查询</text>
<text x="88" y="369" class="s">Q = XW<tspan baseline-shift="sub" font-size="19">Q</tspan> + b<tspan baseline-shift="sub" font-size="19">Q</tspan>　形状 [T,D]</text>
<rect x="566" y="290" width="468" height="100" rx="16" fill="#e5f1ec"/>
<text x="590" y="329" class="h">K：供匹配</text>
<text x="590" y="369" class="s">K = XW<tspan baseline-shift="sub" font-size="19">K</tspan> + b<tspan baseline-shift="sub" font-size="19">K</tspan>　形状 [T,D]</text>
<rect x="1068" y="290" width="468" height="100" rx="16" fill="#fff0df"/>
<text x="1092" y="329" class="h">V：提供内容</text>
<text x="1092" y="369" class="s">V = XW<tspan baseline-shift="sub" font-size="19">V</tspan> + b<tspan baseline-shift="sub" font-size="19">V</tspan>　形状 [T,D]</text>
<text x="64" y="421" class="h" text-anchor="start">“吃”的 Query 匹配四个 Key → 缩放 → Softmax → 四个权重</text><rect x="64" y="451" width="1472" height="53" rx="8" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="88" y="487" class="s" text-anchor="start">来源位置</text><text x="400" y="487" class="s" text-anchor="start">缩放分数</text><text x="738" y="487" class="s" text-anchor="start">读取权重</text><text x="1100" y="487" class="s" text-anchor="start">该位置的 Value</text><text x="88" y="543" class="b" text-anchor="start">我</text><text x="400" y="543" class="b" text-anchor="start">0</text><text x="738" y="543" class="b" text-anchor="start">1/6</text><text x="1100" y="543" class="b" text-anchor="start">[1,0]</text><text x="88" y="591" class="b" text-anchor="start">今天</text><text x="400" y="591" class="b" text-anchor="start">ln 2</text><text x="738" y="591" class="b" text-anchor="start">2/6</text><text x="1100" y="591" class="b" text-anchor="start">[0,1]</text><text x="88" y="639" class="b" text-anchor="start">想</text><text x="400" y="639" class="b" text-anchor="start">0</text><text x="738" y="639" class="b" text-anchor="start">1/6</text><text x="1100" y="639" class="b" text-anchor="start">[2,0]</text><text x="88" y="687" class="b" text-anchor="start">吃</text><text x="400" y="687" class="b" text-anchor="start">ln 2</text><text x="738" y="687" class="b" text-anchor="start">2/6</text><text x="1100" y="687" class="b" text-anchor="start">[0,2]</text><rect x="64" y="735" width="1472" height="116" rx="16" fill="#e5f1ec" stroke="none" stroke-width="2"/><text x="88" y="777" class="b" text-anchor="start">“吃”所在位置的输出 = (1/6)[1,0] + (2/6)[0,1] + (1/6)[2,0] + (2/6)[0,2]</text><text x="88" y="823" class="b" text-anchor="start">                                  = [0.5,1]　　权重决定拿多少；Value 决定拿什么。</text></svg>