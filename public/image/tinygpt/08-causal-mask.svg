ss="s" text-anchor="middle">1/3</text><rect x="1322" y="558" width="72" height="72" rx="8" fill="#e7f1eb" stroke="#fff" stroke-width="2"/><text x="1358" y="604" class="s" text-anchor="middle">1/6</text><rect x="1401" y="558" width="72" height="72" rx="8" fill="#e7f1eb" stroke="#fff" stroke-width="2"/><text x="1437" y="604" class="s" text-anchor="middle">1/3</text><path d="M451 467H561" class="arrow"/><path d="M973 467H1083" class="arrow"/><rect x="64" y="696" width="1472" height="145" rx="16" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="89" y="741" class="b" text-anchor="start">以“想”这一行为例：只读取“我 / 今天 / 想”，不能读取后面的“吃”。</text><text x="89" y="786" class="b" text-anchor="start">[0, ln2, 0, ln2] → [0, ln2, 0, −∞] → [1/4, 1/2, 1/4, 0]</text><text x="89" y="826" class="s" text-anchor="start">禁止位置权重为 0；每行允许位置的权重总和为 1。</text></svg>