<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Causal Mask：挡住未来，再逐行分配权重</title><desc id="desc">左边四行缩放分数都为0、ln2、0、ln2。中间把严格上三角设为负无穷。右边逐行Softmax权重分别为1 0 0 0；1/3 2/3 0 0；1/4 1/2 1/4 0；1/6 1/3 1/6 1/3。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53758c"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c50}.t{font-size:44px;font-weight:700}.h{font-size:32px;font-weight:600}.b{font-size:28px}.s{font-size:26px}.arrow{fill:none;stroke:#53758c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="78" class="t" text-anchor="start">Causal Mask：先挡住未来，再对允许的位置分配权重</text><text x="64" y="130" class="b" text-anchor="start">每行是一个 Query；每列是一个 Key / Value 的来源位置。</text><text x="65" y="225" class="h" text-anchor="start">① 缩放后的分数</text><text x="155" y="284" class="s" text-anchor="middle">我</text><text x="234" y="284" class="s" text-anchor="middle">今天</text><text x="313" y="284" class="s" text-anchor="middle">想</text><text x="392" y="284" class="s" text-anchor="middle">吃</text><text x="108" y="340" class="s" text-anchor="end">我</text><rect x="120" y="306" width="72" height="72" rx="8" fill="#e7f1eb" stroke="#fff" stroke-width="2"/><text x="156" y="352" class="s" text-anchor="middle">0</text><rect x="199" y="306" width="72" height="72" rx="8" fill="#e7f1eb" stroke="#fff" stroke-width="2"/><text x="235" y="352" class="s" text-anchor="middle">ln2</text><rect x="278" y="306" width="72" height="72" rx="8" fill="#e7f1eb" stroke="#fff" stroke-width="2"/><text x="314" y="352" class="s" text-anchor="middle">0</text><rect x="357" y="306" width="72" height="72" rx="8" fill="#e7f1eb" stroke="#fff" stroke-width="2"/><text x="393" y="352" class="s" text-anchor="middle">ln2</text><text x="108" y="424" class="s" t