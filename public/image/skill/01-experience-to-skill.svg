<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">把一次实践，整理成下次可用的方法</title><desc id="desc">左侧 Experience 保留实践和证据，右侧 Skill 整理适用场景、操作与验证要求。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#718798" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
<rect width="1000" height="760" rx="24" fill="#F5F8FB"/>
<rect x="36" y="32" width="5" height="58" rx="2" fill="#087E82"/>
<text x="58" y="48" font-size="12" fill="#087E82" font-weight="600" text-anchor="start">POWERCONTEXT  /  SKILL  /  01</text>
<text x="58" y="86" font-size="30" fill="#183249" font-weight="650" text-anchor="start">把一次实践，整理成下次可用的方法</text>
<path d="M 36 703 L 964 703" fill="none" stroke="#D6E1E9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="732" font-size="15" fill="#566B7D" font-weight="400" text-anchor="start">内容边界 · 操作说明保留证据范围；验证要求需要实际执行</text>
<text x="964" y="732" font-size="15" fill="#087E82" font-weight="600" text-anchor="end">01</text>
<text x="36" y="130" font-size="19" fill="#566B7D" font-weight="400" text-anchor="start">同一个金额精度案例，两种阅读目的</text>
<rect x="36" y="166" width="410" height="360" rx="16" fill="#EDF4FD" stroke="#D6E1E9"/>
<text x="58" y="201" font-size="23" fill="#2464B3" font-weight="600" text-anchor="start">Experience · 理解这次实践</text>
<text x="58" y="244" font-size="18" fill="#2464B3" font-weight="600" text-anchor="start">遇到问题</text>
<text x="58" y="276" font-size="18" fill="#183249" font-weight="400" text-anchor="start">金额文本先转 float，结果出现误差</text>
<text x="58" y="330" font-size="18" fill="#2464B3" font-weight="600" text-anchor="start">采取行动</text>
<text x="58" y="362" font-size="18" fill="#183249" font-weight="400" text-anchor="start">从原始文本解析 Decimal</text>
<text x="58" y="416" font-size="18" fill="#2464B3" font-weight="600" text-anchor="start">观察结果</text>
<text x="58" y="448" font-size="18" fill="#183249" font-weight="400" text-anchor="start">原失败输入得到预期结果</text>
<rect x="554" y="166" width="410" height="360" rx="16" fill="#EAF6F4" stroke="#D6E1E9"/>
<text x="576" y="201" font-size="23" fill="#087E82" font-weight="600" text-anchor="start">Skill · 指导后续操作</text>
<text x="576" y="244" font-size="18" fill="#087E82" font-weight="600" text-anchor="start">什么时候适用</text>
<text x="576" y="276" font-size="18" fill="#183249" font-weight="400" text-anchor="start">金额文本转整数分时出现精度问题</text>
<text x="576" y="330" font-size="18" fill="#087E82" font-weight="600" text-anchor="start">按什么步骤做</text>
<text x="576" y="362" font-size="18" fill="#183249" font-weight="400" text-anchor="start">检查转换路径，按条件修改</text>
<text x="576" y="416" font-size="18" fill="#087E82" font-weight="600" text-anchor="start">怎样检查结果</text>
<text x="576" y="448" font-size="18" fill="#183249" font-weight="400" text-anchor="start">运行原失败用例，核对整数分</text>
<path d="M 455 345 L 545 345" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="318" font-size="18" fill="#566B7D" font-weight="600" text-anchor="middle">提炼</text>
<rect x="36" y="566" width="928" height="102" rx="16" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="58" y="601" font-size="23" fill="#183249" font-weight="600" text-anchor="start">证据支持多大范围，方法就保留多大范围</text>
<text x="58" y="638" font-size="20" fill="#183249" font-weight="400" text-anchor="start">只验证一个输入，就保留其他精度与舍入边界仍需确认的限制。</text>
</svg>
