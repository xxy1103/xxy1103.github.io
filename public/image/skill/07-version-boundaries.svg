<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc">
<title id="title">三个版本，分别推进</title><desc id="desc">Experience、正式 Skill 和 Agent 安装版本独立变化；每一步更新都需要对应提案审核或交付。</desc>
