<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Dream：先建立运行，再取得提案</title><desc id="desc">调用方提交精确 Experience，取得 run_id 后后台组织证据并派生 Skill，根据结果决定是否进入审核。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#718798" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
<rect width="1000" height="900" rx="24" fill="#F5F8FB"/>
<rect x="36" y="32" width="5" height="58" rx="2" fill="#087E82"/>
<text x="58" y="48" font-size="12" fill="#087E82" font-weight="600" text-anchor="start">POWERCONTEXT  /  SKILL  /  04</text>
<text x="58" y="86" font-size="30" fill="#183249" font-weight="650" text-anchor="start">Dream：先建立运行，再取得提案</text>
<path d="M 36 843 L 964 843" fill="none" stroke="#D6E1E9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="872" font-size="15" fill="#566B7D" font-weight="400" text-anchor="start">两个身份 · run_id 用于查运行；candidate_id 用于读提案和审核</text>
<text x="964" y="872" font-size="15" fill="#087E82" font-weight="600" text-anchor="end">04</text>
<text x="36" y="130" font-size="19" fill="#566B7D" font-weight="400" text-anchor="start">derive_skill 从所选 Experience 派生新 Skill</text>
<rect x="36" y="164" width="444" height="126" rx="16" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="58" y="199" font-size="23" fill="#183249" font-weight="600" text-anchor="start">选定精确 Experience</text>
<text x="58" y="236" font-size="20" fill="#183249" font-weight="400" text-anchor="start">可补充 Source</text>
<text x="58" y="266" font-size="20" fill="#183249" font-weight="400" text-anchor="start">不接受 Skill 更新 target</text>
<rect x="520" y="164" width="444" height="126" rx="16" fill="#EDF4FD" stroke="#D6E1E9"/>
<text x="542" y="199" font-size="23" fill="#2464B3" font-weight="600" text-anchor="start">提交 Dream 请求</text>
<text x="542" y="236" font-size="20" fill="#183249" font-weight="400" text-anchor="start">取得 run_id</text>
<text x="542" y="266" font-size="20" fill="#183249" font-weight="400" text-anchor="start">之后可查询运行结果</text>
<path d="M 482 225 L 512 225" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 292 L 742 334" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="342" width="928" height="135" rx="16" fill="#EAF6F4" stroke="#D6E1E9"/>
<text x="58" y="377" font-size="23" fill="#087E82" font-weight="600" text-anchor="start">后台组织证据，再交给模型</text>
<text x="58" y="414" font-size="20" fill="#183249" font-weight="400" text-anchor="start">保留根来源关系，避免把重复转述当作独立验证。</text>
<text x="58" y="444" font-size="20" fill="#183249" font-weight="400" text-anchor="start">模型返回完整内容和实际使用的证据编号。</text>
<path d="M 500 479 L 500 526" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="519" font-size="18" fill="#566B7D" font-weight="600" text-anchor="middle">查询运行结果</text>
<rect x="36" y="553" width="292" height="151" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="58" y="588" font-size="23" fill="#A56613" font-weight="600" text-anchor="start">proposed</text>
<text x="58" y="625" font-size="20" fill="#183249" font-weight="400" text-anchor="start">有有效提案</text>
<text x="58" y="655" font-size="20" fill="#183249" font-weight="400" text-anchor="start">取得 candidate_id</text>
<rect x="354" y="553" width="292" height="151" rx="16" fill="#F0F4F7" stroke="#D6E1E9"/>
<text x="376" y="588" font-size="23" fill="#566B7D" font-weight="600" text-anchor="start">no_change</text>
<text x="376" y="625" font-size="20" fill="#183249" font-weight="400" text-anchor="start">没有值得派生的内容</text>
<text x="376" y="655" font-size="20" fill="#183249" font-weight="400" text-anchor="start">保留运行原因</text>
<rect x="672" y="553" width="292" height="151" rx="16" fill="#F0F4F7" stroke="#D6E1E9"/>
<text x="694" y="588" font-size="23" fill="#566B7D" font-weight="600" text-anchor="start">needs_evidence</text>
<text x="694" y="625" font-size="20" fill="#183249" font-weight="400" text-anchor="start">缺少必要证据</text>
<text x="694" y="655" font-size="20" fill="#183249" font-weight="400" text-anchor="start">补充材料后再判断</text>
<path d="M 500 534 H 182 V 546" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 500 534 H 500 V 546" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 500 534 H 818 V 546" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="36" y="752" font-size="18" fill="#566B7D" font-weight="400" text-anchor="start">运行异常另记为 failed，可查询错误信息。</text>
<path d="M 182 706 L 182 782" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="792" width="928" height="43" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="500" y="820" font-size="20" fill="#A56613" font-weight="600" text-anchor="middle">有 Candidate → 读取完整内容和证据 → 进入审核</text>
</svg>
