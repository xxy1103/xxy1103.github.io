<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Grader complete 与 Gold Complete Evidence 的差距</title>
  <desc id="desc">四十二道 Grader 判定完成的题中只有十道达到 Gold 完整证据；十七道达到最大跳数的题中有两道实际上已经达到 Gold 完整证据。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.value{font:700 28px Consolas,"Microsoft YaHei",sans-serif;fill:#183153}.arrow{stroke:#60758e;stroke-width:2.6;fill:none;marker-end:url(#arrow)}</style>
  </defs>

  <rect width="1280" height="680" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">Agent 的“我完成了”，必须再经过外部 Gold 验证</text>
  <text x="54" y="90" class="subtitle">内部终止原因描述流程判断，Complete Evidence@10 检查全部标注事实是否真的进入 Top-10。</text>

  <text x="70" y="148" class="lane">Agent 内部判断</text>
  <text x="754" y="148" class="lane">Gold 外部检查</text>

  <rect x="66" y="176" width="330" height="158" rx="20" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="218" class="h2">termination = complete</text>
  <text x="92" y="264" class="body">Grader 认为全部需求已有证据</text>
  <text x="354" y="312" text-anchor="end" class="value">42 题</text>

  <path d="M396 226 H544 V192 H722" class="arrow"/>
  <path d="M396 286 H544 V306 H722" class="arrow"/>
  <rect x="724" y="166" width="490" height="82" rx="16" fill="#dff3e8" filter="url(#shadow)"/>
  <text x="750" y="208" class="h2">Gold 也确认完整</text><text x="1176" y="212" text-anchor="end" class="value">10</text>
  <rect x="724" y="268" width="490" height="82" rx="16" fill="#fde9e7" filter="url(#shadow)"/>
  <text x="750" y="310" class="h2">Gold 仍发现缺失事实</text><text x="1176" y="314" text-anchor="end" class="value">32</text>

  <rect x="66" y="400" width="330" height="158" rx="20" fill="#fff1dc" stroke="#c99a52" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="442" class="h2">termination = max_hops</text>
  <text x="92" y="488" class="body">三跳后仍未被 Grader 判定完成</text>
  <text x="354" y="536" text-anchor="end" class="value">17 题</text>

  <path d="M396 450 H544 V416 H722" class="arrow"/>
  <path d="M396 510 H544 V530 H722" class="arrow"/>
  <rect x="724" y="390" width="490" height="82" rx="16" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="750" y="432" class="h2">Gold 其实已经完整</text><text x="1176" y="436" text-anchor="end" class="value">2</text>
  <rect x="724" y="492" width="490" height="82" rx="16" fill="#e8eef6" filter="url(#shadow)"/>
  <text x="750" y="534" class="h2">Gold 同样确认不完整</text><text x="1176" y="538" text-anchor="end" class="value">15</text>

  <rect x="180" y="606" width="920" height="48" rx="14" fill="#f0eafb"/>
  <text x="640" y="636" text-anchor="middle" class="body">主要问题是过早完成：需求拆解或证据语义判断仍需校准</text>
</svg>
