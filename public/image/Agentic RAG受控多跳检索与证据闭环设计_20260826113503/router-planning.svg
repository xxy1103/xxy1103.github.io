<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Query Router 的输入、判断与结构化输出</title>
  <desc id="desc">原始问题进入 Router，Router 判断单跳或多跳，并输出首跳查询、原因和证据需求清单，随后经过确定性校验。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 16px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="620" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">Router 规划“先查什么”和“最终必须证明什么”</text>
  <text x="54" y="88" class="subtitle">它只看到原始问题，不读取检索结果，也不填写最终答案。</text>

  <rect x="54" y="150" width="278" height="174" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="78" y="184" class="h2">输入 · 原始问题</text>
  <text x="78" y="224" class="body">创办 A 公司的人</text><text x="78" y="250" class="body">后来领导了哪家机构？</text>
  <text x="78" y="292" class="small">AgenticState.question</text>
  <path d="M332 237 H400" class="arrow"/>

  <rect x="402" y="126" width="410" height="224" rx="20" fill="#f0eafb" stroke="#8b76b5" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="162" class="h2">Query Router · LLM 判断</text>
  <text x="430" y="202" class="body">① 一次检索能否直接回答？</text>
  <text x="430" y="232" class="body">② 是否需要先发现中间实体？</text>
  <text x="430" y="262" class="body">③ 完整答案依赖哪些原子事实？</text>
  <text x="430" y="292" class="body">④ 首跳应该使用什么查询？</text>
  <rect x="430" y="312" width="250" height="24" rx="8" fill="#e8eef6"/><text x="444" y="329" class="small">不检索 · 不回答 · 不补充常识</text>
  <path d="M812 237 H876" class="arrow"/>

  <rect x="878" y="126" width="348" height="224" rx="20" fill="#dff3e8" filter="url(#shadow)"/>
  <text x="904" y="162" class="code">RouteDecision</text>
  <text x="904" y="198" class="body">route</text><text x="1035" y="198" class="small">multi_hop</text>
  <text x="904" y="226" class="body">query</text><text x="1035" y="226" class="small">A 公司创办者是谁？</text>
  <text x="904" y="254" class="body">reason</text><text x="1035" y="254" class="small">需要中间实体</text>
  <text x="904" y="282" class="body">requirements</text><text x="1035" y="282" class="small">R1 · R2</text>
  <text x="904" y="322" class="small">query 是首跳，不是最终问题的改写</text>

  <rect x="180" y="420" width="920" height="176" rx="20" fill="#fff" opacity=".96"/>
  <text x="208" y="456" class="h2">确定性 validator</text>
  <rect x="208" y="484" width="190" height="58" rx="12" fill="#e8f1fb"/><text x="303" y="508" text-anchor="middle" class="body">route 枚举合法</text><text x="303" y="528" text-anchor="middle" class="small">single / multi</text>
  <rect x="428" y="484" width="190" height="58" rx="12" fill="#e8f1fb"/><text x="523" y="508" text-anchor="middle" class="body">query / reason 非空</text><text x="523" y="528" text-anchor="middle" class="small">控制信号可执行</text>
  <rect x="648" y="484" width="190" height="58" rx="12" fill="#e8f1fb"/><text x="743" y="508" text-anchor="middle" class="body">需求 ID 唯一</text><text x="743" y="528" text-anchor="middle" class="small">数组不得为空</text>
  <rect x="868" y="484" width="204" height="58" rx="12" fill="#fff1dc"/><text x="970" y="508" text-anchor="middle" class="body">multi_hop ≥ 2 需求</text><text x="970" y="528" text-anchor="middle" class="small">否则结构校验失败</text>
  <text x="208" y="576" class="small">校验失败 → 将错误反馈给 LLM 重试；仍失败 → router_failed → finalize</text>
</svg>
