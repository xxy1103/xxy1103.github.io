<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">六十道题在 Agentic 流程中的路由与终止分布</title>
  <desc id="desc">独立展示 Router 的四十五道多跳和十五道单跳决策，以及四十二道完成、十七道达到最大跳数和一道路由失败的终止分布。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.panel{font:700 22px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.h2{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.value{font:700 28px Consolas,"Microsoft YaHei",sans-serif;fill:#183153}</style>
  </defs>

  <rect width="1280" height="680" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">60 道题平均运行 2.2 跳，主要循环来自“继续下一跳”</text>
  <text x="54" y="90" class="subtitle">路由分布与终止分布分别统计，不表示某一种路由必然对应某一种终止原因。</text>

  <rect x="48" y="126" width="570" height="360" rx="20" fill="#fff" opacity=".96"/>
  <text x="78" y="166" class="panel">Router 怎样理解问题</text>
  <rect x="78" y="208" width="320" height="112" rx="17" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="104" y="248" class="h2">multi_hop</text><text x="360" y="250" text-anchor="end" class="value">45</text>
  <text x="104" y="282" class="body">75% · 需要多步检索计划</text>
  <rect x="78" y="342" width="320" height="112" rx="17" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="104" y="382" class="h2">single_hop</text><text x="360" y="384" text-anchor="end" class="value">15</text>
  <text x="104" y="416" class="body">25% · 一次查询可能覆盖多项事实</text>
  <rect x="430" y="208" width="156" height="246" rx="17" fill="#e8eef6"/>
  <text x="508" y="258" text-anchor="middle" class="small">实际运行</text>
  <text x="508" y="304" text-anchor="middle" class="value">2.2</text>
  <text x="508" y="334" text-anchor="middle" class="body">平均跳数</text>
  <line x1="456" y1="360" x2="560" y2="360" stroke="#bdc8d4" stroke-width="1.5"/>
  <text x="508" y="396" text-anchor="middle" class="value">2</text>
  <text x="508" y="426" text-anchor="middle" class="body">发生纠错的题</text>

  <rect x="662" y="126" width="570" height="360" rx="20" fill="#fff" opacity=".96"/>
  <text x="692" y="166" class="panel">Agent 最后为什么停止</text>
  <rect x="692" y="208" width="510" height="74" rx="15" fill="#dff3e8" filter="url(#shadow)"/>
  <text x="718" y="250" class="h2">Grader 判定 complete</text><text x="1166" y="252" text-anchor="end" class="value">42</text>
  <rect x="692" y="302" width="510" height="74" rx="15" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="718" y="344" class="h2">达到 max_hops</text><text x="1166" y="346" text-anchor="end" class="value">17</text>
  <rect x="692" y="396" width="510" height="58" rx="15" fill="#fde9e7" filter="url(#shadow)"/>
  <text x="718" y="432" class="h2">router_failed</text><text x="1166" y="434" text-anchor="end" class="value">1</text>

  <rect x="168" y="544" width="944" height="88" rx="18" fill="#e8eef6"/>
  <text x="640" y="576" text-anchor="middle" class="h2">怎样理解这些过程指标</text>
  <text x="640" y="608" text-anchor="middle" class="body">它们说明 Agent 如何运行；不能代替 Gold 指标判断证据是否真的完整</text>
</svg>
