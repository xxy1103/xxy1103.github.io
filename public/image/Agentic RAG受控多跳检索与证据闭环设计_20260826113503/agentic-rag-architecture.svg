<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG LangGraph 状态转化图</title>
  <desc id="desc">Route、Retrieve、Grade 和 Finalize 构成主线；Grader 根据 complete、continue 和 insufficient 分别结束、进入下一跳或纠正查询，后两条路径回到 Retrieve。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 16px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.line{stroke:#60758e;stroke-width:2.6;fill:none}</style>
  </defs>

  <rect width="1280" height="690" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">LangGraph 状态转化：节点读取同一份 State，只写回变化字段</text>
  <text x="54" y="90" class="subtitle">主线负责规划、检索和验收；Grader 的 verdict 决定结束、进入下一跳还是纠错重试。</text>

  <rect x="58" y="188" width="228" height="140" rx="18" fill="#f0eafb" stroke="#8b76b5" stroke-width="2" filter="url(#shadow)"/>
  <text x="172" y="226" text-anchor="middle" class="code">route_query</text>
  <text x="172" y="258" text-anchor="middle" class="body">分析原始问题</text>
  <line x1="84" y1="276" x2="260" y2="276" stroke="#c6b9df" stroke-width="1.5"/>
  <text x="172" y="304" text-anchor="middle" class="small">写入：计划 · 首跳 query · hop=1</text>

  <path d="M286 258 H354" class="arrow"/>
  <rect x="356" y="174" width="250" height="168" rx="18" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/>
  <text x="481" y="214" text-anchor="middle" class="code">retrieve_hop</text>
  <text x="481" y="248" text-anchor="middle" class="body">执行 Hybrid-Rerank</text>
  <line x1="382" y1="270" x2="580" y2="270" stroke="#a8cdb8" stroke-width="1.5"/>
  <text x="481" y="298" text-anchor="middle" class="small">写入：latest_hits</text>
  <text x="481" y="322" text-anchor="middle" class="small">accumulated_hits_by_hop</text>

  <path d="M606 258 H670" class="arrow"/>
  <rect x="672" y="174" width="264" height="168" rx="18" fill="#f0eafb" stroke="#8b76b5" stroke-width="2" filter="url(#shadow)"/>
  <text x="804" y="214" text-anchor="middle" class="code">grade_evidence</text>
  <text x="804" y="248" text-anchor="middle" class="body">验收累计证据</text>
  <line x1="698" y1="270" x2="910" y2="270" stroke="#c6b9df" stroke-width="1.5"/>
  <text x="804" y="298" text-anchor="middle" class="small">写入：assessments · verdict</text>
  <text x="804" y="322" text-anchor="middle" class="small">traces</text>

  <path d="M936 258 H1012" class="arrow"/>
  <text x="950" y="244" class="small">complete</text>
  <rect x="1014" y="188" width="214" height="140" rx="18" fill="#fff1dc" stroke="#c99a52" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121" y="226" text-anchor="middle" class="code">finalize</text>
  <text x="1121" y="258" text-anchor="middle" class="body">结束状态图</text>
  <line x1="1040" y1="276" x2="1202" y2="276" stroke="#d8b77f" stroke-width="1.5"/>
  <text x="1121" y="304" text-anchor="middle" class="small">写入：final_hits · 终止原因</text>

  <path d="M766 342 V390 H570 V428" class="arrow"/>
  <text x="588" y="380" class="small">continue · 仍缺下一项事实</text>
  <rect x="438" y="430" width="264" height="120" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="570" y="470" text-anchor="middle" class="code">prepare_next_hop</text>
  <text x="570" y="504" text-anchor="middle" class="body">hop + 1</text>
  <text x="570" y="530" text-anchor="middle" class="small">current_query = next_query</text>

  <path d="M846 342 V390 H892 V428" class="arrow"/>
  <text x="860" y="380" class="small">insufficient · 当前查询无进展</text>
  <rect x="760" y="430" width="264" height="120" rx="18" fill="#fde9e7" filter="url(#shadow)"/>
  <text x="892" y="470" text-anchor="middle" class="code">correct_query</text>
  <text x="892" y="504" text-anchor="middle" class="body">hop 不变 · correction + 1</text>
  <text x="892" y="530" text-anchor="middle" class="small">current_query = corrected_query</text>

  <path d="M570 550 V580 H330" class="line"/>
  <path d="M892 550 V610 H330" class="line"/>
  <path d="M330 610 V366 H481 V344" class="arrow"/>
  <text x="344" y="594" class="small">更新查询后，重新进入同一个 retrieve_hop</text>

  <rect x="176" y="632" width="928" height="42" rx="13" fill="#e8eef6"/>
  <text x="640" y="659" text-anchor="middle" class="body">预算耗尽或节点失败时不再回环，直接进入 finalize，并在 State 中记录终止原因</text>
</svg>
