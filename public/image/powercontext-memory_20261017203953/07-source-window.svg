<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><rect width="1200" height="330" rx="18" fill="#f7f9fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#24334b"><text x="48" y="48" font-size="25" font-weight="700">一次只整理游标后的一段材料</text><text x="48" y="82" font-size="18">示例：旧游标为 2，每次最多推进 3 个日志位置</text><rect x="50" y="115" width="130" height="65" rx="12" fill="#e7edf3"/><text x="115" y="157" text-anchor="middle" font-size="25">1</text><rect x="205" y="115" width="130" height="65" rx="12" fill="#e7edf3"/><text x="270" y="157" text-anchor="middle" font-size="25">2</text><rect x="360" y="115" width="130" height="65" rx="12" fill="#dceee6"/><text x="425" y="157" text-anchor="middle" font-size="25">3</text><rect x="515" y="115" width="130" height="65" rx="12" fill="#dceee6"/><text x="580" y="157" text-anchor="middle" font-size="25">4</text><rect x="670" y="115" width="130" height="65" rx="12" fill="#dceee6"/><text x="735" y="157" text-anchor="middle" font-size="25">5</text><rect x="825" y="115" width="130" height="65" rx="12" fill="#e1ecfc"/><text x="890" y="157" text-anchor="middle" font-size="25">6</text><rect x="980" y="115" width="130" height="65" rx="12" fill="#e1ecfc"/><text x="1045" y="157" text-anchor="middle" font-size="25">7</text><g font-size="18" text-anchor="middle"><text x="192" y="213">已处理</text><text x="580" y="213">本次窗口 (2, 5]</text><text x="967" y="213">留给后续处理</text></g><path d="M335 175 V250" stroke="#60758e" stroke-width="2"/><text x="335" y="280" text-anchor="middle" font-size="18">旧游标：2</text><path d="M800 175 V250" stroke="#60758e" stroke-width="2"/><text x="800" y="280" text-anchor="middle" font-size="18">成功后游标：5</text><path d="M1110 175 V250" stroke="#60758e" stroke-width="2"/><text x="1110" y="280" text-anchor="middle" font-size="18">日志末尾：7</text></g></svg>