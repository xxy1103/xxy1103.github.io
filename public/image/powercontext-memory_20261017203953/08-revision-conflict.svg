<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">旧引用为什么触发 409 冲突</title><desc id="desc">调用者甲取得 Memory 第二版引用后，调用者乙新增其他条目，使当前版本变成第三版。甲携带旧引用修改时，整份 Memory 版本检查失败，即使目标条目正文没有改变。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="620" rx="18" fill="#f8fafc"/>
<text x="40" y="48" class="title">409：你依据的 Memory 版本已经落后</text>
<text x="40" y="82" class="small">时间向下推进 · 甲想修改 E1，乙在此期间新增 E3</text>
<rect x="40" y="108" width="300" height="48" rx="12" fill="#eaf3ff"/><text x="190" y="139" text-anchor="middle" class="head">调用者甲</text>
<rect x="450" y="108" width="300" height="48" rx="12" fill="#edf8f2"/><text x="600" y="139" text-anchor="middle" class="head">服务端当前 Memory</text>
<rect x="860" y="108" width="300" height="48" rx="12" fill="#f2edfc"/><text x="1010" y="139" text-anchor="middle" class="head">调用者乙</text>
<path d="M190 165 V494 M600 165 V494 M1010 165 V494" stroke="#d6dfeb" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="40" y="180" width="300" height="82" rx="12" fill="#eaf3ff"/>
<text x="60" y="211" class="body">① 取得 E1 及 citation</text><text x="60" y="242" class="small">引用整份 Memory @ 2</text>
<rect x="450" y="180" width="300" height="82" rx="12" fill="#edf8f2"/>
<text x="470" y="211" class="head">Memory @ 2</text><text x="470" y="242" class="small">E1 → E1-v1</text>
<path d="M450 221 H340" class="line"/>
<rect x="860" y="288" width="300" height="82" rx="12" fill="#f2edfc"/>
<text x="880" y="319" class="body">② 新增 E3，提交成功</text><text x="880" y="350" class="small">E1 的正文没有变化</text>
<path d="M860 329 H750" class="line"/>
<rect x="450" y="288" width="300" height="82" rx="12" fill="#edf8f2"/>
<text x="470" y="319" class="head">Memory @ 3</text><text x="470" y="350" class="small">E1 → E1-v1；新增 E3</text>
<rect x="40" y="398" width="300" height="82" rx="12" fill="#eaf3ff"/>
<text x="60" y="429" class="body">③ 携带旧 citation 修改 E1</text><text x="60" y="460" class="small">仍然依据 Memory @ 2</text>
<path d="M340 439 H450" class="line"/>
<rect x="450" y="398" width="710" height="82" rx="12" fill="#fff0ed" stroke="#e9b4a9"/>
<text x="470" y="429" class="head">④ 版本检查：请求 @ 2 ≠ 当前 @ 3 → 409 冲突</text>
<text x="470" y="460" class="small">检查整份 Memory 的版本；目标 E1 正文未变，也会冲突。</text>
<rect x="40" y="514" width="1120" height="76" rx="14" fill="#ffffff" stroke="#d6dfeb"/>
<text x="62" y="545" class="head">下一步：重新取得当前条目与 citation，比较变化后再修改</text>
<text x="62" y="574" class="small">旧 citation 仍然能定位历史内容；修改当前状态时，需要依据当前版本。</text>
</svg>