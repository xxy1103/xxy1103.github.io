<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">一份 Memory 的快照，指向多条知识的具体版本</title><desc id="desc">不要把整份 Memory 的 Revision 与单条 Entry 的内容版本混为一谈。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.tiny{font-size:14px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="630" fill="#f8fafc"/><text x="40" y="48" class="title">一份 Memory 的快照，指向多条知识的具体版本</text><text x="40" y="82" class="small">不要把整份 Memory 的 Revision 与单条 Entry 的内容版本混为一谈。</text><rect x="40" y="112" width="1120" height="490" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="64" y="149" class="head">订单项目 Scope</text><rect x="65" y="175" width="635" height="320" rx="16" fill="#ffffff" stroke="#c0cfdf" stroke-width="1.5"/><text x="87" y="213" class="head">Memory · mem_orders @ 2</text><text x="87" y="246" class="small">这一版的 content</text><rect x="87" y="269" width="590" height="133" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="108" y="300" class="head">manifest · 条目目录</text><text x="108" y="338" class="body">E1 → E1-v2 · active</text><text x="108" y="374" class="body">E2 → E2-v1 · active</text><text x="87" y="447" class="body">changes · 本次新增、修订或状态变化</text><rect x="820" y="208" width="315" height="117" rx="16" fill="#fff6e5" stroke="#e6c683" stroke-width="1.5"/><text x="842" y="244" class="head">Entry 内容版本 E1-v2</text><text x="842" y="281" class="body">金额使用整数分；</text><text x="842" y="312" class="body">转换使用 Decimal。</text><rect x="820" y="369" width="315" height="117" rx="16" fill="#fff6e5" stroke="#e6c683" stroke-width="1.5"/><text x="842" y="405" class="head">Entry 内容版本 E2-v1</text><text x="842" y="442" class="body">错误包含原始行号。</text><path d="M677 331 H745 V267 H820" class="line"/><path d="M677 370 H775 V427 H820" class="line"/><text x="65" y="550" class="small">Memory 快照记录采用哪些条目版本；条目正文存放在独立的内容版本中。</text></svg>