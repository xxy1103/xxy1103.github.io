<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc"><title id="title">一条知识的完整使用循环</title><desc id="desc">从第一天保存约定，到后续会话继续工作，再到规则更新。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.tiny{font-size:14px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="695" fill="#f8fafc"/><text x="40" y="48" class="title">一条知识的完整使用循环</text><text x="40" y="82" class="small">从第一天保存约定，到后续会话继续工作，再到规则更新。</text><rect x="40" y="140" width="410" height="145" rx="16" fill="#eaf3ff" stroke="#93c5fd" stroke-width="1.5"/><text x="62" y="176" class="head">① 保存或提取</text><text x="62" y="213" class="body">明确的规则：直接保存</text><text x="62" y="244" class="body">原始材料：按配置提取</text><rect x="750" y="140" width="410" height="145" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="772" y="176" class="head">② 保留可追溯的状态</text><text x="772" y="213" class="body">Entry 内容版本 + Memory Revision</text><text x="772" y="244" class="body">保存引用，维护检索索引</text><rect x="750" y="415" width="410" height="145" rx="16" fill="#f2edfc" stroke="#c4aceb" stroke-width="1.5"/><text x="772" y="451" class="head">③ 新任务召回并使用</text><text x="772" y="488" class="body">同一个 Scope 中请求相关背景</text><text x="772" y="519" class="body">PreparedContext → Agent</text><rect x="40" y="415" width="410" height="145" rx="16" fill="#fff6e5" stroke="#e6c683" stroke-width="1.5"/><text x="62" y="451" class="head">④ 规则变化时维护</text><text x="62" y="488" class="body">用当前 citation 修订或停用</text><text x="62" y="519" class="body">冲突时重新读取，再决定修改</text><path d="M450 212 H750" class="line"/><text x="548" y="194" class="small">校验并提交</text><path d="M955 285 V415" class="line"/><text x="972" y="354" class="small">按需取回</text><path d="M750 487 H450" class="line"/><text x="553" y="469" class="small">发现变化</text><path d="M245 415 V285" class="line"/><text x="263" y="355" class="small">新的提交</text><rect x="40" y="610" width="1120" height="56" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="645" class="small">当前召回使用有效知识；历史版本保留当时的记录。新的任务与修改让这个过程持续进行。</text></svg>