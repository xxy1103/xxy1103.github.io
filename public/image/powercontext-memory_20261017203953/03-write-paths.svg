<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc"><title id="title">两条入口：直接保存，或从材料中提取</title><desc id="desc">启用向量索引时，写入仍可能调用 Embedding；生成模型与 Embedding 的职责不同。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.tiny{font-size:14px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="635" fill="#f8fafc"/><text x="40" y="48" class="title">两条入口：直接保存，或从材料中提取</text><text x="40" y="82" class="small">启用向量索引时，写入仍可能调用 Embedding；生成模型与 Embedding 的职责不同。</text><rect x="40" y="130" width="280" height="140" rx="16" fill="#eaf3ff" stroke="#93c5fd" stroke-width="1.5"/><text x="62" y="166" class="head">显式保存</text><text x="62" y="203" class="body">调用方确定 kind 与 text</text><text x="62" y="234" class="body">remember_memory</text><rect x="40" y="365" width="280" height="140" rx="16" fill="#eaf3ff" stroke="#93c5fd" stroke-width="1.5"/><text x="62" y="401" class="head">Source 提取</text><text x="62" y="438" class="body">先采集工作材料</text><text x="62" y="469" class="body">配置调度或请求 flush</text><rect x="410" y="365" width="320" height="140" rx="16" fill="#fff6e5" stroke="#e6c683" stroke-width="1.5"/><text x="432" y="401" class="head">模型提出候选</text><text x="432" y="438" class="body">结合证据与有效条目</text><text x="432" y="469" class="body">提出新增或修订</text><rect x="830" y="205" width="330" height="205" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="852" y="241" class="head">程序校验与提交</text><text x="852" y="278" class="body">检查内容、证据和目标</text><text x="852" y="309" class="body">保存条目版本与快照</text><text x="852" y="340" class="body">维护相应检索索引</text><path d="M320 200 H790 V260 H830" class="line"/><text x="405" y="180" class="small">无需生成模型概括正文</text><path d="M320 435 H410" class="line"/><path d="M730 435 H785 V360 H830" class="line"/><rect x="40" y="550" width="1120" height="56" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="585" class="small">显式写入与提取共用保存基础；没有有效变化时，可能不产生新的 Memory Revision。</text></svg>