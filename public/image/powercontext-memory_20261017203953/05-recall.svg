<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">从存储中的知识，到 Agent 本次使用的背景</title><desc id="desc">search_memory 负责查找；prepare_context 还会选择和组装。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.tiny{font-size:14px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="550" fill="#f8fafc"/><text x="40" y="48" class="title">从存储中的知识，到 Agent 本次使用的背景</text><text x="40" y="82" class="small">search_memory 负责查找；prepare_context 还会选择和组装。</text><rect x="40" y="140" width="300" height="165" rx="16" fill="#eaf3ff" stroke="#93c5fd" stroke-width="1.5"/><text x="62" y="176" class="head">当前有效条目</text><text x="62" y="213" class="body">按 Scope 选择 Memory</text><text x="62" y="244" class="body">在 head 的索引中搜索</text><text x="62" y="275" class="body">inactive 不进普通召回</text><rect x="450" y="140" width="300" height="165" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="472" y="176" class="head">检索命中</text><text x="472" y="213" class="body">相关正文与分数</text><text x="472" y="244" class="body">精确 citation</text><text x="472" y="275" class="body">可按引用读取条目</text><rect x="860" y="140" width="300" height="165" rx="16" fill="#f2edfc" stroke="#c4aceb" stroke-width="1.5"/><text x="882" y="176" class="head">PreparedContext</text><text x="882" y="213" class="body">按规则选取并组装</text><text x="882" y="244" class="body">遵守 max_bytes 预算</text><text x="882" y="275" class="body">返回本次临时上下文</text><path d="M340 223 H450" class="line"/><path d="M750 223 H860" class="line"/><rect x="860" y="405" width="300" height="110" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="882" y="441" class="head">客户端 → Agent</text><text x="882" y="478" class="body">结合当前任务和现场信息</text><path d="M1010 305 V405" class="line"/><text x="1025" y="355" class="small">提供上下文</text><rect x="40" y="365" width="710" height="150" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="64" y="402" class="head">本次上下文只是一份选择结果</text><text x="64" y="441" class="body">裁剪或跳过条目，不会删除存储中的完整记忆。</text><text x="64" y="477" class="body">empty 可以是正常结果；ready 不等于模型已经使用。</text></svg>