<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc"><title id="title">把会影响后续工作的内容，保存成独立条目</title><desc id="desc">Memory 以 Entry 组织知识，后续可以分别查询、修订和停用。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.tiny{font-size:14px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="565" fill="#f8fafc"/><text x="40" y="48" class="title">把会影响后续工作的内容，保存成独立条目</text><text x="40" y="82" class="small">Memory 以 Entry 组织知识，后续可以分别查询、修订和停用。</text><rect x="40" y="165" width="390" height="235" rx="16" fill="#eaf3ff" stroke="#93c5fd" stroke-width="1.5"/><text x="62" y="201" class="head">一段项目讨论</text><text x="62" y="238" class="body">金额使用整数分；</text><text x="62" y="269" class="body">转换使用 Decimal；</text><text x="62" y="300" class="body">错误需要原始行号。</text><path d="M430 280 H520" class="line"/><path d="M520 180 V410" stroke="#64748b" stroke-width="2"/><path d="M520 180 H610" class="line"/><rect x="610" y="130" width="550" height="95" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="632" y="166" class="head">Entry · 金额单位</text><text x="632" y="203" class="body">金额以整数分存储。</text><path d="M520 295 H610" class="line"/><rect x="610" y="245" width="550" height="95" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="632" y="281" class="head">Entry · 转换方式</text><text x="632" y="318" class="body">金额转换使用 Decimal。</text><path d="M520 410 H610" class="line"/><rect x="610" y="360" width="550" height="95" rx="16" fill="#edf8f2" stroke="#acd9bf" stroke-width="1.5"/><text x="632" y="396" class="head">Entry · 错误信息</text><text x="632" y="433" class="body">导入错误包含 CSV 原始行号。</text><rect x="40" y="485" width="1120" height="56" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="520" class="small">每条 Entry 表达一个可独立变化的知识点；这三条知识仍可归属于同一份 Memory。</text></svg>