<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc"><title id="title">两层版本：整份 Memory 的快照与每条知识的内容版本</title><desc id="desc">修订正文产生条目新版本；停用只改变新快照中该条目的状态。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.tiny{font-size:14px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="535" fill="#f8fafc"/><text x="40" y="48" class="title">两层版本：整份 Memory 的快照与每条知识的内容版本</text><text x="40" y="82" class="small">修订正文产生条目新版本；停用只改变新快照中该条目的状态。</text><rect x="40" y="150" width="320" height="175" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="186" class="head">Memory @ 1</text><text x="62" y="223" class="body">E1 → E1-v1 · active</text><text x="62" y="254" class="body">E2 → E2-v1 · active</text><rect x="440" y="150" width="320" height="175" rx="16" fill="#edf8f2" stroke="#d6dfeb" stroke-width="1.5"/><text x="462" y="186" class="head">Memory @ 2</text><text x="462" y="223" class="body">E1 → E1-v2 · active</text><text x="462" y="254" class="body">E2 → E2-v1 · active</text><rect x="840" y="150" width="320" height="175" rx="16" fill="#f2edfc" stroke="#d6dfeb" stroke-width="1.5"/><text x="862" y="186" class="head">Memory @ 3</text><text x="862" y="223" class="body">E1 → E1-v2 · active</text><text x="862" y="254" class="body">E2 → E2-v1 · inactive</text><path d="M360 232 H440" class="line"/><path d="M760 232 H840" class="line"/><text x="390" y="128" class="small">修订 E1</text><text x="790" y="128" class="small">停用 E2</text><text x="62" y="373" class="small">E1：金额以整数分存储。</text><text x="462" y="373" class="small">E1：增加 Decimal 转换要求。</text><text x="862" y="373" class="small">E2：退出当前有效召回。</text><text x="62" y="407" class="small">E2：错误保留原始行号。</text><text x="462" y="407" class="small">E2：继续使用原内容版本。</text><text x="862" y="407" class="small">E2-v1 正文和历史仍保留。</text><rect x="40" y="450" width="1120" height="56" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="485" class="small">同一 artifact_id：mem_orders。整份快照前进，不代表每条 Entry 的正文版本都改变。</text></svg>