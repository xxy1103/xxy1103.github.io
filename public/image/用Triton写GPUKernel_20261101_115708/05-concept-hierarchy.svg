<rect x="864" y="376" width="640" height="252" rx="16" fill="#f3faf5" stroke="#a9cdb5"/>
<text x="888" y="414" class="h">执行资源：num_warps = 4</text>
<text x="888" y="446" class="s">这个 Program 用多少个 Warp 来执行</text>
