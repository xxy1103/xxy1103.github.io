<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Grid、Program、Thread Block、BLOCK_SIZE、num_warps、Warp、SM 的关系</title>
<desc id="desc">Grid=(4,) 启动 4 个 Program。放大 Program 0：数据侧 BLOCK_SIZE=256 个元素，执行侧 num_warps=4 即 4 个 Warp 共 128 个线程，构成一个 CUDA Thread Block，由编译器把元素分给线程。硬件侧，Thread Block 被分配到 SM 上，一个 SM 可以同时驻留多个 Thread Block。</desc>
<defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#203b4d}.t{font-size:38px;font-weight:700}.h{font-size:26px;font-weight:700}.b{font-size:22px}.s{font-size:19px;fill:#4d6575}.m{font-family:Menlo,Consolas,monospace;font-size:20px;fill:#203b4d}.ms{font-family:Menlo,Consolas,monospace;font-size:16px;fill:#203b4d}</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7a8fa0"/></marker></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="72" class="t">分清相似的概念：从 Grid 到 SM</text>
<text x="64" y="112" class="b">例：N = 1000，grid = (4,)，BLOCK_SIZE = 256，num_warps = 4</text>
<rect x="64" y="136" width="1472" height="164" rx="20" fill="#fff" stroke="#c9d5de"/>
<text x="88" y="170" class="s" style="font-weight:700">① Triton：Kernel 怎样启动</text>
<rect x="96" y="190" width="300" height="90" rx="14" fill="#eef2f6" stroke="#9fb1be" stroke-width="2"/>
<text x="246" y="228" text-anchor="middle" class="h">Grid = (4,)</text>
<text x="246" y="262" text-anchor="middle" class="s">启动 4 个 Program</text>
<path d="M396 235H446" stroke="#7a8fa0" stroke-width="3" marker-end="url(#ar)"/>
<rect x="460" y="190" width="200" height="90" rx="14" fill="#fbefcc" stroke="#d9a53a" stroke-width="4"/><text x="560" y="228" text-anchor="middle" class="h">Program 0</text><text x="560" y="262" text-anchor="middle" class="m">pid = 0</text>
<rect x="684" y="190" width="200" height="90" rx="14" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="784" y="228" text-anchor="middle" class="h">Program 1</text><text x="784" y="262" text-anchor="middle" class="m">pid = 1</text>
<rect x="908" y="190" width="200" height="90" rx="14" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="1008" y="228" text-anchor="middle" class="h">Program 2</text><text x="1008" y="262" text-anchor="middle" class="m">pid = 2</text>
<rect x="1132" y="190" width="200" height="90" rx="14" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="1232" y="228" text-anchor="middle" class="h">Program 3</text><text x="1232" y="262" text-anchor="middle" class="m">pid = 3</text>
<text x="1380" y="228" class="s">同一份代码</text><text x="1380" y="260" class="s">运行 4 次</text>
<path d="M460 280L80 320M660 280L1520 320" stroke="#d9a53a" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
<rect x="64" y="320" width="1472" height="330" rx="20" fill="#fff" stroke="#d9a53a" stroke-width="2"/>
<text x="88" y="356" class="s" style="font-weight:700">② 放大 Program 0：一个 Program 有两组参数</text>
<rect x="96" y="376" width="664" height="252" rx="16" fill="#fffaf0" stroke="#e6c27a"/>
<text x="120" y="414" class="h">数据：BLOCK_SIZE = 256</text>
<text x="120" y="446" class="s">这个 Program 逻辑上要处理多少个元素</text>
<rect x="120" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="158.5" y="507" text-anchor="middle" class="ms">0～31</text>
<rect x="197" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="235.5" y="507" text-anchor="middle" class="ms">32～63</text>
<rect x="274" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="312.5" y="507" text-anchor="middle" class="ms">64～95</text>
<rect x="351" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="389.5" y="507" text-anchor="middle" class="ms">96～127</text>
<rect x="428" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="466.5" y="507" text-anchor="middle" class="ms">128～159</text>
<rect x="505" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="543.5" y="507" text-anchor="middle" class="ms">160～191</text>
<rect x="582" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="620.5" y="507" text-anchor="middle" class="ms">192～223</text>
<rect x="659" y="470" width="77" height="60" fill="#fbefcc" stroke="#d9a53a" stroke-width="2"/><text x="697.5" y="507" text-anchor="middle" class="ms">224～255</text>
<text x="120" y="574" class="b">256 个元素 = offsets 的长度</text>
<text x="120" y="608" class="s">由我们写的代码决定</text>
<path d="M856 500H772" stroke="#7a8fa0" stroke-width="3" marker-end="url(#ar)"/>
