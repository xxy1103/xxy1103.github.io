<text x="1096" y="764" class="s">空闲</text>
<text x="1310" y="748" class="s">一个 SM 可同时</text><text x="1310" y="776" class="s">驻留多个 Block</text>
<rect x="64" y="822" width="1472" height="56" rx="14" fill="#f6e0dd"/>
<text x="94" y="858" class="b" style="fill:#8e2a1f">两个“Block”不是一回事：Thread Block 是一组线程；BLOCK_SIZE 是一个 Program 处理的数据量。</text>
