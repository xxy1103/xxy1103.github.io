<text x="654.0" y="682" text-anchor="middle" class="b">232 个有效位置：正常读写</text>
<text x="1244.0" y="682" text-anchor="middle" class="b" style="fill:#c0392b">24 个越界位置</text>
<rect x="64" y="720" width="1472" height="140" rx="14" fill="#eef2f6"/>
<text x="94" y="762" class="m">mask = offsets &lt; N</text>
<text x="94" y="800" class="b">tl.load：mask 为 False 的位置不访问显存，直接填入 other（这里是 0）。</text>
<text x="94" y="836" class="b">tl.store：只写 mask 为 True 的位置。前三个 Program 的 mask 全为 True，不受影响。</text>
