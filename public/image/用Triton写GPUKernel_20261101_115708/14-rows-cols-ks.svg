<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">rows、cols、ks 各选中哪里</title>
<desc id="desc">Program (1,0) 第 1 轮：rows=[2,3]，cols=[0,1]，ks=[0,1]。A 中选中第 2、3 行和第 0、1 列，得到蓝块；B 中选中第 0、1 行和第 0、1 列，得到绿块；C 中第 2、3 行和第 0、1 列是这个 Program 要写的黄块。rows 和 cols 在 K 循环中不变，ks 每轮后移。</desc>
