<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="72" class="t">rows、cols、ks 各选中哪里</text>
<text x="64" y="114" class="b">以 Program (1, 0) 的第 1 轮为例。每个矩阵左边是行号，上边是列号，彩色的号码就是被选中的。</text>
