<rect x="274" y="360" width="92" height="56" rx="10" fill="#e3f1e7" stroke="#4f9a6a" stroke-width="2"/><text x="320.0" y="397" text-anchor="middle" class="h">10</text>
<rect x="714" y="360" width="92" height="56" rx="10" fill="#e3f1e7" stroke="#4f9a6a" stroke-width="2"/><text x="760.0" y="397" text-anchor="middle" class="h">26</text>
