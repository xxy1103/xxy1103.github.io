<rect x="329" y="720" width="92" height="56" rx="10" fill="#bcd6ef" stroke="#4f86b8" stroke-width="2"/><text x="375.0" y="757" text-anchor="middle" class="h">3</text>
<rect x="439" y="720" width="92" height="56" rx="10" fill="#bcd6ef" stroke="#4f86b8" stroke-width="2"/><text x="485.0" y="757" text-anchor="middle" class="h">4</text>
<rect x="549" y="720" width="92" height="56" rx="10" fill="#bcd6ef" stroke="#4f86b8" stroke-width="2"/><text x="595.0" y="757" text-anchor="middle" class="h">5</text>
<rect x="659" y="720" width="92" height="56" rx="10" fill="#bcd6ef" stroke="#4f86b8" stroke-width="2"/><text x="705.0" y="757" text-anchor="middle" class="h">6</text>
<rect x="769" y="720" width="92" height="56" rx="10" fill="#bcd6ef" stroke="#4f86b8" stroke-width="2"/><text x="815.0" y="757" text-anchor="middle" class="h">7</text>
<rect x="879" y="720" width="92" height="56" rx="10" fill="#bcd6ef" stroke="#4f86b8" stroke-width="2"/><text x="925.0" y="757" text-anchor="middle" class="h">8</text>
<rect x="164" y="540" width="92" height="56" rx="10" fill="#d7e6f5" stroke="#4f86b8" stroke-width="2"/><text x="210.0" y="577" text-anchor="middle" class="h">3</text>
