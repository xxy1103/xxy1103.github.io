<text x="1010" y="757" class="b">输入：8 个数</text>
<text x="1010" y="577" class="b">第 1 轮：8 → 4</text>
<text x="1010" y="397" class="b">第 2 轮：4 → 2</text>
<text x="1010" y="217" class="b">第 3 轮：2 → 1</text>
<rect x="1240" y="300" width="296" height="300" rx="18" fill="#fff" stroke="#c9d5de"/>
<text x="1264" y="346" class="h">对比</text>
<text x="1264" y="394" class="b">一个线程顺序累加</text>
<text x="1264" y="430" class="s">7 步，其他线程空闲</text>
<text x="1264" y="490" class="b">树形归约</text>
<text x="1264" y="526" class="s">3 轮；n 个数约 log₂n 轮</text>
<text x="1264" y="560" class="s">1024 个数只要 10 轮</text>
<rect x="64" y="812" width="1472" height="60" rx="14" fill="#eef2f6"/>
<text x="94" y="850" class="s">示意图：只说明归约为什么能并行。Triton 实际生成的指令（Warp Shuffle、Shared Memory、同步）由编译器决定。</text>
</svg>
