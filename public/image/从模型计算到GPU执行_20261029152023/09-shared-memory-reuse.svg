<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">同一批数据：反复远取，还是搬近了共用？</title>
<desc id="desc">左右对比同一个 Block 内的线程使用相同数据。左侧每个线程独立读取显存；右侧协作加载到 Shared Memory，同步后在片上重复读取。箭头表示数据流向，不表示线程请求方向。忽略硬件缓存，不代表实际显存事务次数。</desc>
<defs>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ce8957"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#489880"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#dde6ec" stroke-width="2"/></pattern>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#203b4d}.title{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:23px;font-weight:600}.s{font-size:20px}.tiny{font-size:18px}.far{fill:none;stroke:#ce8957;stroke-width:4;marker-end:url(#orange)}.near{fill:none;stroke:#489880;stroke-width:4;marker-end:url(#green)}</style>
</defs>
<rect width="1600" height="900" fill="#f5f8fb"/>
<text x="64" y="72" class="title">同一批数据，搬近了再共用</text>
<text x="64" y="112" class="s">同一个 Block 内的线程都需要这份数据。箭头表示数据流向：橙色是片外读取，绿色是片上复用。</text>
<rect x="64" y="152" width="712" height="632" rx="26" fill="#fff" stroke="#dfc4af" stroke-width="2"/>
<rect x="88" y="176" width="44" height="44" rx="14" fill="#fff0e3"/><text x="110" y="207" text-anchor="middle" class="h">A</text>
<text x="148" y="207" class="h">各自读取，重复搬运</text>
<text x="96" y="248" class="s">每个线程独立加载相同的数据</text>
<rect x="200" y="274" width="440" height="94" rx="17" fill="#f0f4f8" stroke="#a4b8c7" stroke-width="2"/>
<text x="224" y="311" class="b">显存</text><text x="224" y="342" class="tiny">同一份数据</text>
<rect x="384" y="297" width="44" height="44" rx="9" fill="#f3c78e"/><text x="406" y="326" text-anchor="middle" class="tiny">a</text><rect x="439" y="297" width="44" height="44" rx="9" fill="#edb574"/><text x="461" y="326" text-anchor="middle" class="tiny">b</text><rect x="494" y="297" width="44" height="44" rx="9" fill="#e7a56d"/><text x="516" y="326" text-anchor="middle" class="tiny">c</text><rect x="549" y="297" width="44" height="44" rx="9" fill="#d99563"/><text x="571" y="326" text-anchor="middle" class="tiny">d</text><rect x="86" y="414" width="668" height="40" fill="url(#hatch)"/><text x="109" y="441" class="tiny" fill="#708797">GPU 计算芯片边界</text>
<rect x="96" y="470" width="648" height="266" rx="20" fill="#f8fafc" stroke="#d4e1e7" stroke-width="1.5"/>
<text x="118" y="503" class="tiny" fill="#708797">SM 内 · 同一个 Block</text>
<path d="M350 373C350 456 224 540 224 650" class="far"/><rect x="183" y="526" width="82" height="34" rx="11" fill="#fff0e3" stroke="#e4b18a"/><text x="224" y="549" text-anchor="middle" class="tiny">a b c d</text><rect x="170" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#a7bac7" stroke-width="2"/><text x="224" y="690" text-anchor="middle" class="s">Thread 0</text><path d="M422 373C422 456 354 540 354 650" class="far"/><rect x="313" y="526" width="82" height="34" rx="11" fill="#fff0e3" stroke="#e4b18a"/><text x="354" y="549" text-anchor="middle" class="tiny">a b c d</text><rect x="300" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#a7bac7" stroke-width="2"/><text x="354" y="690" text-anchor="middle" class="s">Thread 1</text><path d="M494 373C494 456 484 540 484 650" class="far"/><rect x="443" y="526" width="82" height="34" rx="11" fill="#fff0e3" stroke="#e4b18a"/><text x="484" y="549" text-anchor="middle" class="tiny">a b c d</text><rect x="430" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#a7bac7" stroke-width="2"/><text x="484" y="690" text-anchor="middle" class="s">Thread 2</text><path d="M566 373C566 456 614 540 614 650" class="far"/><rect x="573" y="526" width="82" height="34" rx="11" fill="#fff0e3" stroke="#e4b18a"/><text x="614" y="549" text-anchor="middle" class="tiny">a b c d</text><rect x="560" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#a7bac7" stroke-width="2"/><text x="614" y="690" text-anchor="middle" class="s">Thread 3</text><text x="420" y="766" text-anchor="middle" class="s" fill="#a86b3e">相同输入被多个线程分别加载</text><rect x="824" y="152" width="712" height="632" rx="26" fill="#fff" stroke="#a4cbbc" stroke-width="2"/>
<rect x="848" y="176" width="44" height="44" rx="14" fill="#e0f0e8"/><text x="870" y="207" text-anchor="middle" class="h">B</text>
<text x="908" y="207" class="h">协作加载，片上共用</text>
<text x="856" y="248" class="s">先搬到 Shared Memory，再供线程反复使用</text>
<rect x="960" y="274" width="440" height="94" rx="17" fill="#f0f4f8" stroke="#a4b8c7" stroke-width="2"/>
<text x="984" y="311" class="b">显存</text><text x="984" y="342" class="tiny">同一份数据</text>
<rect x="1144" y="297" width="44" height="44" rx="9" fill="#f3c78e"/><text x="1166" y="326" text-anchor="middle" class="tiny">a</text><rect x="1199" y="297" width="44" height="44" rx="9" fill="#edb574"/><text x="1221" y="326" text-anchor="middle" class="tiny">b</text><rect x="1254" y="297" width="44" height="44" rx="9" fill="#e7a56d"/><text x="1276" y="326" text-anchor="middle" class="tiny">c</text><rect x="1309" y="297" width="44" height="44" rx="9" fill="#d99563"/><text x="1331" y="326" text-anchor="middle" class="tiny">d</text><rect x="846" y="414" width="668" height="40" fill="url(#hatch)"/><text x="869" y="441" class="tiny" fill="#708797">GPU 计算芯片边界</text>
<rect x="856" y="470" width="648" height="266" rx="20" fill="#f0f8f4" stroke="#d4e1e7" stroke-width="1.5"/>
<text x="878" y="503" class="tiny" fill="#708797">SM 内 · 同一个 Block</text>
<path d="M1180 373V522" class="far"/><rect x="1198" y="382" width="177" height="31" rx="12" fill="#fff0e3"/><text x="1212" y="404" class="tiny">① 协作加载一份</text>
<rect x="990" y="528" width="380" height="72" rx="16" fill="#dff0e6" stroke="#489880" stroke-width="2"/><text x="1180" y="560" text-anchor="middle" class="b">Shared Memory</text><text x="1180" y="586" text-anchor="middle" class="tiny">a · b · c · d　留在片上</text>
<text x="878" y="630" class="tiny" fill="#3d856f">② 同步后复用</text><path d="M1180 604C1180 626 984 622 984 650" class="near"/><rect x="930" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#78ae98" stroke-width="2"/><text x="984" y="690" text-anchor="middle" class="s">Thread 0</text><path d="M1180 604C1180 626 1114 622 1114 650" class="near"/><rect x="1060" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#78ae98" stroke-width="2"/><text x="1114" y="690" text-anchor="middle" class="s">Thread 1</text><path d="M1180 604C1180 626 1244 622 1244 650" class="near"/><rect x="1190" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#78ae98" stroke-width="2"/><text x="1244" y="690" text-anchor="middle" class="s">Thread 2</text><path d="M1180 604C1180 626 1374 622 1374 650" class="near"/><rect x="1320" y="656" width="108" height="54" rx="14" fill="#fff" stroke="#78ae98" stroke-width="2"/><text x="1374" y="690" text-anchor="middle" class="s">Thread 3</text><text x="1180" y="766" text-anchor="middle" class="s" fill="#3d856f">跨越片外的搬运减少，复用发生在 SM 内</text><text x="64" y="832" class="s">示意只画 4 个线程，并忽略 L1 / L2 缓存。左侧的独立读取可能命中缓存，不一定每次都访问显存。</text>
<text x="64" y="866" class="s" fill="#708797">Shared Memory 让程序明确组织数据复用；实际收益还取决于缓存、同步开销、容量和访问方式。</text>
</svg>
