<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Memory Coalescing：连续访问与分散访问</title>
<desc id="desc">上半部分，一个 Warp 的线程读取连续地址，这些地址集中在同一个内存段里，硬件可以合并成很少的内存事务。下半部分，线程读取的地址分散在许多个内存段里，硬件需要发出更多内存事务，搬来的数据大部分用不上。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56758a"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203b4d}.t{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:22px;font-weight:600}.s{font-size:20px}.xs{font-size:16px}.ar{fill:none;stroke:#56758a;stroke-width:2.5;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="72" class="t">读取同样多的数据，连续访问比分散访问更省事务</text>
<text x="64" y="114" class="s">显存按“一段一段”搬运数据。线程要的数据挤在少数几段里，搬几次就够；散落在很多段里，就要搬很多次。</text>
<rect x="64" y="150" width="1472" height="320" rx="22" fill="#ffffff" stroke="#b4c5cf" stroke-width="2"/>
<text x="94" y="194" class="h">连续访问：T0→A[0]，T1→A[1]，……</text>
<text x="94" y="250" class="b">Warp</text><text x="94" y="276" class="xs" fill="#56758a">（只画 8 个线程）</text>
<rect x="260" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="288" y="257" text-anchor="middle" class="xs">T0</text>
<rect x="330" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="358" y="257" text-anchor="middle" class="xs">T1</text>
<rect x="400" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="428" y="257" text-anchor="middle" class="xs">T2</text>
<rect x="470" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="498" y="257" text-anchor="middle" class="xs">T3</text>
<rect x="540" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="568" y="257" text-anchor="middle" class="xs">T4</text>
<rect x="610" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="638" y="257" text-anchor="middle" class="xs">T5</text>
<rect x="680" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="708" y="257" text-anchor="middle" class="xs">T6</text>
<rect x="750" y="228" width="56" height="44" rx="8" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="778" y="257" text-anchor="middle" class="xs">T7</text>
<text x="94" y="402" class="b">显存</text>
