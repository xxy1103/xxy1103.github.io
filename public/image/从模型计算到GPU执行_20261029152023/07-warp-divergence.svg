<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Warp Divergence：同一个 Warp 的线程走向不同分支</title>
<desc id="desc">上半部分是 32 个线程走同一条路径，一步完成。下半部分是线程 0 到 15 走 if 分支、线程 16 到 31 走 else 分支，两条分支要先后执行，每一步都有一半线程空闲，总共需要两步。</desc>
<defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203b4d}.t{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:22px;font-weight:600}.s{font-size:20px}.c{font-family:Menlo,Consolas,monospace;font-size:20px}</style></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="72" class="t">同一个 Warp 走不同分支，就要分两次执行</text>
<text x="64" y="114" class="s">一个 Warp 的 32 个线程通常一起执行同一条指令。线程走向不同分支时，两条分支只能先后执行。</text>
<rect x="64" y="150" width="1472" height="210" rx="22" fill="#ffffff" stroke="#b4c5cf" stroke-width="2"/>
<text x="94" y="194" class="h">情况 1：所有线程走同一条路径</text>
<text x="1000" y="194" class="c" fill="#56758a">C[i] = A[i] + B[i]</text>
<text x="94" y="262" class="b">第 1 步</text>
