<text x="1100" y="262" class="s">32 个线程同时干活</text>
<text x="220" y="320" class="s" fill="#56758a">线程 0 ………………………………………… 线程 31</text>
<text x="1100" y="320" class="b" fill="#3f7a57">共 1 步</text>

<rect x="64" y="390" width="1472" height="350" rx="22" fill="#ffffff" stroke="#b4c5cf" stroke-width="2"/>
<text x="94" y="434" class="h">情况 2：一半线程走 if，一半走 else</text>
<text x="860" y="434" class="c" fill="#56758a">if (x[i] &gt; 0) { 分支 A } else { 分支 B }</text>
<text x="94" y="508" class="b">第 1 步</text>
