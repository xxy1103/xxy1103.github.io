<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Roofline：两个上限取较小值</title><desc id="desc">线性坐标：横轴为算术强度，纵轴为性能。假设计算峰值20 TFLOP/s、带宽500 GB/s，拐点为40 FLOP/Byte。10与20处上限分别为5与10 TFLOP/s，80处上限为20。实测示意点位于屋顶下方。</desc><defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#203b4d}.t{font-size:38px;font-weight:700}.h{font-size:26px;font-weight:700}.b{font-size:22px}.s{font-size:19px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7985b7"/></marker></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="64" y="70" class="t">Roofline：带宽与计算峰值，谁先限制速度？</text><text x="64" y="112" class="b">假设 GPU：计算峰值 20 TFLOP/s · 显存带宽 500 GB/s　｜　Pmax = min(Pcompute, BW × AI)</text><rect x="64" y="150" width="1060" height="660" rx="24" fill="white" stroke="#b4c5cf"/><text x="104" y="190" class="s">性能（TFLOP/s）</text><line x1="170" y1="710" x2="1070" y2="710" stroke="#e1e8ee"/><text x="148" y="717" text-anchor="end" class="s">0</text><line x1="170" y1="610" x2="1070" y2="610" stroke="#e1e8ee"/><text x="148" y="617" text-anchor="end" class="s">5</text><line x1="170" y1="510" x2="1070" y2="510" stroke="#e1e8ee"/><text x="148" y="517" text-anchor="end" class="s">10</text><line x1="170" y1="410" x2="1070" y2="410" stroke="#e1e8ee"/><text x="148" y="417" text-anchor="end" class="s">15</text><line x1="170" y1="310" x2="1070" y2="310" stroke="#e1e8ee"/><text x="148" y="317" text-anchor="end" class="s">20</text><line x1="170" y1="230" x2="170" y2="710" stroke="#edf1f4"/><text x="170" y="746" text-anchor="middle" class="s">0</text><line x1="370" y1="230" x2="370" y2="710" stroke="#edf1f4"/><text x="370" y="746" text-anchor="middle" class="s">20</text><line x1="570" y1="230" x2="570" y2="710" stroke="#edf1f4"/><text x="570" y="746" text-anchor="middle" class="s">40</text><line x1="770" y1="230" x2="770" y2="710" stroke="#edf1f4"/><text x="770" y="746" text-anchor="middle" class="s">60</text><line x1="970" y1="230" x2="970" y2="710" stroke="#edf1f4"/><text x="970" y="746" text-anchor="middle" class="s">80</text><path d="M170 230V710H1070" fill="none" stroke="#486879" stroke-width="3"/><path d="M170 710L570 310" fill="none" stroke="#d58b56" stroke-width="7"/><path d="M570 310H1070" fill="none" stroke="#488b70" stroke-width="7"/><path d="M570 310V710" fill="none" stroke="#9badb9" stroke-width="2" stroke-dasharray="7 7"/><text x="665" y="283" class="b">计算屋顶：20 TFLOP/s</text><text x="255" y="430" class="b">带宽上限：BW × AI</text><text x="256" y="460" class="s">AI 翻倍，带宽支撑的计算量翻倍</text><text x="250" y="690" class="s">Memory-bound 区域</text><text x="700" y="690" class="s">Compute-bound 区域</text><text x="580" y="780" text-anchor="middle" class="b">算术强度 AI（FLOP/Byte，线性坐标）</text><circle cx="270" cy="610" r="8" fill="#203b4d" stroke="white" stroke-width="3"/><text x="255" y="586" class="s">(10, 5)</text><circle cx="370" cy="510" r="8" fill="#203b4d" stroke="white" stroke-width="3"/><text x="395" y="528" class="s">(20, 10)</text><circle cx="570" cy="310" r="8" fill="#203b4d" stroke="white" stroke-width="3"/><text x="490" y="270" class="s">拐点 (40, 20)</text><circle cx="970" cy="310" r="8" fill="#203b4d" stroke="white" stroke-width="3"/><text x="930" y="350" class="s">(80, 20)</text><circle cx="770" cy="530" r="9" fill="#7985b7"/><path d="M770 514V350" fill="none" stroke="#7985b7" stroke-width="3" marker-end="url(#arrow)"/><text x="795" y="494" class="s">同样 AI，提高利用率</text><text x="795" y="535" class="s">性能点向上靠近屋顶</text><text x="740" y="576" class="s">假想性能点（非实测）</text><rect x="1150" y="150" width="386" height="660" rx="24" fill="#eef3f6" stroke="#a9bdc9"/><text x="1180" y="202" class="h">怎样读这张图</text><text x="1180" y="258" class="b">① 左侧：受带宽项限制</text><text x="1180" y="295" class="s">复用数据、减少显存流量</text><text x="1180" y="326" class="s">→ AI 增大，向右移动</text><text x="1180" y="395" class="b">② 拐点：两个上限相等</text><text x="1180" y="432" class="s">20 × 10¹² ÷ (500 × 10⁹)</text><text x="1180" y="468" class="h">= 40 FLOP/Byte</text><text x="1180" y="537" class="b">③ 右侧：受计算峰值限制</text><text x="1180" y="574" class="s">继续提高 AI</text><text x="1180" y="605" class="s">不会抬高这个计算屋顶</text><line x1="1180" y1="645" x2="1504" y2="645" stroke="#bacbd5"/><text x="1180" y="688" class="b">屋顶上的点是理论上限</text><text x="1180" y="725" class="s">实际性能可能因为等待、同步</text><text x="1180" y="756" class="s">和资源占用而远低于它</text><text x="64" y="863" class="s">计算峰值须匹配数据类型与执行单元；AI 的显存流量需包含读取和写回。区域分类帮助提出假设，瓶颈仍需实测确认。</text></svg>
