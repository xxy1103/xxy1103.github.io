<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Tiling：一块数据搬一次，供多个输出使用</title>
<desc id="desc">以 2×2 矩阵乘法为例。朴素做法中 4 个输出各自从显存读取 4 个输入，共 16 次；Tiling 先把 8 个输入搬到 Shared Memory，只读 8 次，4 个输出共用。放大到 4×4 时，理想化读取次数从 128 次降到 32 次。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56758a"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203b4d}.t{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:22px;font-weight:600}.s{font-size:20px}.ar{fill:none;stroke:#56758a;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="72" class="t">Tiling：一块数据只搬一次，供多个输出使用</text>
<text x="64" y="114" class="s">例子：A = [1 2; 3 4]，B = [5 6; 7 8]。乘法和加法的次数不变，变的是从显存读取输入的次数。</text>
<rect x="64" y="150" width="720" height="490" rx="22" fill="#ffffff" stroke="#c49362" stroke-width="2"/>
<text x="94" y="194" class="h">朴素做法：每个输出自己去显存取数</text>
<text x="94" y="258" class="b">C₀₀ = 1×5 + 2×7 = 19</text><rect x="400" y="225" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="423" y="256" text-anchor="middle" class="s">1</text><rect x="452" y="225" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="475" y="256" text-anchor="middle" class="s">2</text><rect x="520" y="225" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="543" y="256" text-anchor="middle" class="s">5</text><rect x="572" y="225" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="595" y="256" text-anchor="middle" class="s">7</text><text x="640" y="256" class="s" fill="#8b5c36">读 4 次</text>
<text x="94" y="340" class="b">C₀₁ = 1×6 + 2×8 = 22</text><rect x="400" y="307" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="423" y="338" text-anchor="middle" class="s">1</text><rect x="452" y="307" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="475" y="338" text-anchor="middle" class="s">2</text><rect x="520" y="307" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="543" y="338" text-anchor="middle" class="s">6</text><rect x="572" y="307" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="595" y="338" text-anchor="middle" class="s">8</text><text x="640" y="338" class="s" fill="#8b5c36">读 4 次</text>
<text x="94" y="422" class="b">C₁₀ = 3×5 + 4×7 = 43</text><rect x="400" y="389" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="423" y="420" text-anchor="middle" class="s">3</text><rect x="452" y="389" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="475" y="420" text-anchor="middle" class="s">4</text><rect x="520" y="389" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="543" y="420" text-anchor="middle" class="s">5</text><rect x="572" y="389" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="595" y="420" text-anchor="middle" class="s">7</text><text x="640" y="420" class="s" fill="#8b5c36">读 4 次</text>
<text x="94" y="504" class="b">C₁₁ = 3×6 + 4×8 = 50</text><rect x="400" y="471" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="423" y="502" text-anchor="middle" class="s">3</text><rect x="452" y="471" width="46" height="46" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="475" y="502" text-anchor="middle" class="s">4</text><rect x="520" y="471" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="543" y="502" text-anchor="middle" class="s">6</text><rect x="572" y="471" width="46" height="46" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="595" y="502" text-anchor="middle" class="s">8</text><text x="640" y="502" class="s" fill="#8b5c36">读 4 次</text>
<text x="94" y="590" class="b" fill="#a0522d">合计 16 次显存读取，每个输入都被读了 2 次</text>
<rect x="816" y="150" width="720" height="490" rx="22" fill="#ffffff" stroke="#82ad94" stroke-width="2"/>
<text x="846" y="194" class="h">Tiling：先把整块搬进 Shared Memory</text>
<rect x="836" y="230" width="248" height="300" rx="16" fill="#f4f6f8" stroke="#9db1bb" stroke-width="2"/>
<text x="960" y="266" text-anchor="middle" class="b">显存</text><text x="900" y="316" text-anchor="middle" class="s">A</text><text x="1020" y="316" text-anchor="middle" class="s">B</text>
<rect x="852" y="330" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="874" y="360" text-anchor="middle" class="s">1</text><rect x="904" y="330" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="926" y="360" text-anchor="middle" class="s">2</text><rect x="852" y="382" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="874" y="412" text-anchor="middle" class="s">3</text><rect x="904" y="382" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="926" y="412" text-anchor="middle" class="s">4</text><rect x="972" y="330" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="994" y="360" text-anchor="middle" class="s">5</text><rect x="1024" y="330" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="1046" y="360" text-anchor="middle" class="s">6</text><rect x="972" y="382" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="994" y="412" text-anchor="middle" class="s">7</text><rect x="1024" y="382" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="1046" y="412" text-anchor="middle" class="s">8</text>
<path d="M1088 380H1140" class="ar"/><text x="1114" y="362" text-anchor="middle" font-size="16">读 8 次</text>
<rect x="1146" y="230" width="170" height="300" rx="16" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/>
<text x="1231" y="262" text-anchor="middle" class="s">Shared Memory</text>
<rect x="1180" y="284" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="1202" y="314" text-anchor="middle" class="s">1</text><rect x="1232" y="284" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="1254" y="314" text-anchor="middle" class="s">2</text><rect x="1180" y="336" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="1202" y="366" text-anchor="middle" class="s">3</text><rect x="1232" y="336" width="44" height="44" rx="6" fill="#fff0e5" stroke="#c49362" stroke-width="2"/><text x="1254" y="366" text-anchor="middle" class="s">4</text><rect x="1180" y="404" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="1202" y="434" text-anchor="middle" class="s">5</text><rect x="1232" y="404" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="1254" y="434" text-anchor="middle" class="s">6</text><rect x="1180" y="456" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="1202" y="486" text-anchor="middle" class="s">7</text><rect x="1232" y="456" width="44" height="44" rx="6" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/><text x="1254" y="486" text-anchor="middle" class="s">8</text>
<path d="M1322 380H1372" class="ar"/><text x="1347" y="362" text-anchor="middle" class="s">复用</text>
<text x="1440" y="320" text-anchor="middle" class="s">输出 C</text>
<rect x="1380" y="334" width="56" height="56" rx="6" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1408" y="370" text-anchor="middle" class="b">19</text><rect x="1442" y="334" width="56" height="56" rx="6" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1470" y="370" text-anchor="middle" class="b">22</text><rect x="1380" y="396" width="56" height="56" rx="6" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1408" y="432" text-anchor="middle" class="b">43</text><rect x="1442" y="396" width="56" height="56" rx="6" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1470" y="432" text-anchor="middle" class="b">50</text>
<text x="846" y="590" class="b" fill="#3f7a57">合计 8 次显存读取，4 个输出共用这 8 个数</text>
<rect x="64" y="670" width="1472" height="150" rx="22" fill="#ffffff" stroke="#b4c5cf" stroke-width="2"/>
<text x="94" y="712" class="h">放大到 4×4 矩阵乘法</text>
<text x="94" y="756" class="s">朴素：16 个输出 × (4 + 4)</text>
<rect x="420" y="736" width="1000" height="30" rx="6" fill="#f2c9a0" stroke="#c49362" stroke-width="1.5"/><text x="1440" y="759" class="b">128 次</text>
<text x="94" y="800" class="s">充分复用：16 + 16</text>
<rect x="420" y="780" width="250" height="30" rx="6" fill="#b9dcc5" stroke="#82ad94" stroke-width="1.5"/><text x="690" y="803" class="b">32 次</text>
<text x="64" y="862" class="s" fill="#56758a">理想化的逻辑读取次数：忽略了 L1/L2 缓存和写回结果的开销，实际显存流量不一定按同样比例减少。</text>
</svg>
