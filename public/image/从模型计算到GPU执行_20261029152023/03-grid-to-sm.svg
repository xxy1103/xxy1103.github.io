<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Block 怎样被分配到 SM</title>
<desc id="desc">左侧是一次 Kernel 启动产生的 Grid，包含 6 个 Block，每个 Block 由 4 个 Warp 组成。右侧是 3 个 SM：SM 0 同时驻留 Block 0 和 1，SM 1 驻留 Block 2 和 3，SM 2 驻留 Block 4，Block 5 等待有 SM 腾出资源后再分配。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56758a"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203b4d}.t{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:23px;font-weight:600}.s{font-size:20px}.xs{font-size:17px}.ar{fill:none;stroke:#56758a;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="72" class="t">Block 是软件的工作分组，SM 是执行它的硬件</text>
<text x="64" y="114" class="s">Kernel 启动后，GPU 把 Block 分给有空闲资源的 SM；放不下的 Block 先等待。W0–W3 表示一个 Block 里的 4 个 Warp。</text>
<rect x="64" y="150" width="640" height="620" rx="24" fill="#e8f1f9" stroke="#7c9db7" stroke-width="2"/>
<text x="94" y="194" class="h">软件：一次 Kernel 启动 = 一个 Grid</text>
<rect x="94" y="220" width="280" height="150" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="110" y="256" class="b">Block 0（128 线程）</text><rect x="110" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="136" y="301" text-anchor="middle" class="xs">W0</text><rect x="172" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="198" y="301" text-anchor="middle" class="xs">W1</text><rect x="234" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="260" y="301" text-anchor="middle" class="xs">W2</text><rect x="296" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="322" y="301" text-anchor="middle" class="xs">W3</text>
<text x="110" y="348" class="xs" fill="#56758a">4 个 Warp × 32 线程</text>
<rect x="394" y="220" width="280" height="150" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="410" y="256" class="b">Block 1（128 线程）</text><rect x="410" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="436" y="301" text-anchor="middle" class="xs">W0</text><rect x="472" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="498" y="301" text-anchor="middle" class="xs">W1</text><rect x="534" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="560" y="301" text-anchor="middle" class="xs">W2</text><rect x="596" y="276" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="622" y="301" text-anchor="middle" class="xs">W3</text>
<text x="410" y="348" class="xs" fill="#56758a">4 个 Warp × 32 线程</text>
<rect x="94" y="395" width="280" height="150" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="110" y="431" class="b">Block 2（128 线程）</text><rect x="110" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="136" y="476" text-anchor="middle" class="xs">W0</text><rect x="172" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="198" y="476" text-anchor="middle" class="xs">W1</text><rect x="234" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="260" y="476" text-anchor="middle" class="xs">W2</text><rect x="296" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="322" y="476" text-anchor="middle" class="xs">W3</text>
<text x="110" y="523" class="xs" fill="#56758a">4 个 Warp × 32 线程</text>
<rect x="394" y="395" width="280" height="150" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="410" y="431" class="b">Block 3（128 线程）</text><rect x="410" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="436" y="476" text-anchor="middle" class="xs">W0</text><rect x="472" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="498" y="476" text-anchor="middle" class="xs">W1</text><rect x="534" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="560" y="476" text-anchor="middle" class="xs">W2</text><rect x="596" y="451" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="622" y="476" text-anchor="middle" class="xs">W3</text>
<text x="410" y="523" class="xs" fill="#56758a">4 个 Warp × 32 线程</text>
<rect x="94" y="570" width="280" height="150" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="110" y="606" class="b">Block 4（128 线程）</text><rect x="110" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="136" y="651" text-anchor="middle" class="xs">W0</text><rect x="172" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="198" y="651" text-anchor="middle" class="xs">W1</text><rect x="234" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="260" y="651" text-anchor="middle" class="xs">W2</text><rect x="296" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="322" y="651" text-anchor="middle" class="xs">W3</text>
<text x="110" y="698" class="xs" fill="#56758a">4 个 Warp × 32 线程</text>
<rect x="394" y="570" width="280" height="150" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="410" y="606" class="b">Block 5（128 线程）</text><rect x="410" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="436" y="651" text-anchor="middle" class="xs">W0</text><rect x="472" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="498" y="651" text-anchor="middle" class="xs">W1</text><rect x="534" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="560" y="651" text-anchor="middle" class="xs">W2</text><rect x="596" y="626" width="52" height="36" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><text x="622" y="651" text-anchor="middle" class="xs">W3</text>
<text x="410" y="698" class="xs" fill="#56758a">4 个 Warp × 32 线程</text>
<path d="M716 460H824" class="ar"/><text x="770" y="440" text-anchor="middle" class="s">分配</text>
<rect x="836" y="150" width="700" height="620" rx="24" fill="#ffffff" stroke="#a9bdc9" stroke-width="2"/>
<text x="866" y="194" class="h">硬件：多个 SM</text>
<rect x="866" y="220" width="640" height="120" rx="16" fill="#f0eafb" stroke="#9b83bd" stroke-width="2"/><text x="890" y="270" class="h">SM 0</text><text x="890" y="306" class="xs" fill="#5b4a78">Warp Scheduler</text>
<rect x="1060" y="234" width="170" height="92" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1076" y="264" class="s">Block 0</text><rect x="1076" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1108" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1140" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1172" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/>
<rect x="1250" y="234" width="170" height="92" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1266" y="264" class="s">Block 1</text><rect x="1266" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1298" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1330" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1362" y="278" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/>
<rect x="866" y="360" width="640" height="120" rx="16" fill="#f0eafb" stroke="#9b83bd" stroke-width="2"/><text x="890" y="410" class="h">SM 1</text><text x="890" y="446" class="xs" fill="#5b4a78">Warp Scheduler</text>
<rect x="1060" y="374" width="170" height="92" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1076" y="404" class="s">Block 2</text><rect x="1076" y="418" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1108" y="418" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1140" y="418" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1172" y="418" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/>
