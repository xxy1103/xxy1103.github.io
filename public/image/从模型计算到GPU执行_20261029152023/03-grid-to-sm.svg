<rect x="1060" y="514" width="170" height="92" rx="12" fill="#e6f1eb" stroke="#82ad94" stroke-width="2"/><text x="1076" y="544" class="s">Block 4</text><rect x="1076" y="558" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1108" y="558" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1140" y="558" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1172" y="558" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/>
<text x="1250" y="566" class="xs" fill="#5b4a78">当前只驻留 1 个 Block</text>
<rect x="866" y="650" width="640" height="96" rx="16" fill="#fafbfc" stroke="#9db1bb" stroke-width="2" stroke-dasharray="8 7"/>
<text x="890" y="690" class="b" fill="#56758a">等待队列</text><rect x="1060" y="658" width="170" height="82" rx="12" fill="#f2f5f7" stroke="#9db1bb" stroke-width="2"/><text x="1076" y="688" class="s">Block 5</text><rect x="1076" y="702" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1108" y="702" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1140" y="702" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/><rect x="1172" y="702" width="26" height="22" rx="5" fill="#fff0e5" stroke="#c49362" stroke-width="1.5"/>
<text x="1250" y="690" class="xs" fill="#56758a">等某个 SM 上的 Block</text><text x="1250" y="716" class="xs" fill="#56758a">执行完、腾出资源后再分配</text>
<text x="64" y="820" class="b">一个 Block 执行期间只驻留在一个 SM 上；一个 SM 可以同时驻留多个 Block。</text>
<text x="64" y="860" class="s" fill="#56758a">简化示意：SM 数量和每个 SM 能驻留几个 Block，取决于 GPU 型号，以及每个 Block 占用的线程、寄存器和 Shared Memory。</text>
</svg>
