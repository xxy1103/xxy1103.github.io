<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">竖向图片展示</title>
  <desc id="desc">一张用于演示文章页竖向图片等比缩放效果的九比十六渐变插画。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3b"/>
      <stop offset="0.5" stop-color="#5c3b8f"/>
      <stop offset="1" stop-color="#f0926b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#ffe9af" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe9af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22355e"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#sky)"/>
  <rect width="900" height="1050" fill="url(#glow)"/>
  <circle cx="450" cy="535" r="180" fill="#fff1bf" opacity=".9"/>
  <circle cx="390" cy="470" r="25" fill="#101a3b" opacity=".12"/>
  <circle cx="530" cy="610" r="42" fill="#101a3b" opacity=".09"/>
  <path d="M0 1110 155 970l135 105 165-220 145 155 138-115L900 1030v570H0Z" fill="url(#hill)"/>
  <path d="M0 1260 185 1100l145 95 160-105 195 155 215-85v440H0Z" fill="#0a1228" opacity=".82"/>
  <g fill="#fff6d2">
    <circle cx="110" cy="195" r="4"/><circle cx="220" cy="310" r="6"/><circle cx="690" cy="210" r="5"/>
    <circle cx="780" cy="390" r="3"/><circle cx="135" cy="635" r="3"/><circle cx="725" cy="730" r="5"/>
  </g>
  <text x="450" y="1435" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="44" letter-spacing="7">PORTRAIT · 9:16</text>
  <text x="450" y="1505" text-anchor="middle" fill="#d8dcf1" font-family="system-ui, sans-serif" font-size="25">文章页竖向图片展示</text>
</svg>
