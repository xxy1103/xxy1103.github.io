<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">自建数据集与 MultiHop-RAG 的评测职责</title><desc id="desc">自建六十题用于模块诊断，MultiHop-RAG 二千二百五十五题用于陌生领域泛化，二者共同支持跨数据集结论。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.num{font:700 34px "Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/><text x="54" y="58" class="title">双数据集评测：既要能诊断，也要能泛化</text><text x="54" y="88" class="subtitle">同一个模块在不同语言、领域、问题结构与 Top-K 下可能产生不同作用。</text>
  <rect x="54" y="136" width="480" height="420" rx="20" fill="#e6effb" filter="url(#shadow)"/><text x="84" y="178" class="h2">自建诊断集</text><text x="84" y="226" class="num">60 题</text><text x="84" y="260" class="body">中文技术文档 · 已知证据位置 · Top-6</text>
  <rect x="84" y="294" width="200" height="62" rx="12" fill="#fff"/><text x="102" y="320" class="body">词法 12 · 语义 16</text><text x="102" y="343" class="small">观察 BM25 与 Dense</text><rect x="304" y="294" width="200" height="62" rx="12" fill="#fff"/><text x="322" y="320" class="body">多证据 12 · 歧义 10</text><text x="322" y="343" class="small">观察 Rerank 与 Rewrite</text><rect x="84" y="374" width="420" height="62" rx="12" fill="#fff"/><text x="102" y="400" class="body">无答案 10</text><text x="102" y="423" class="small">本轮只记录检索行为，不评价生成拒答</text><text x="84" y="486" class="h2">回答：为什么变好或变差？</text><text x="84" y="518" class="small">优势：问题类型可控，便于定位模块增量价值。</text>
  <rect x="746" y="136" width="480" height="420" rx="20" fill="#dff3e8" filter="url(#shadow)"/><text x="776" y="178" class="h2">MultiHop-RAG 压力测试</text><text x="776" y="226" class="num">2,255 题</text><text x="776" y="260" class="body">英文新闻 · 跨文档 Gold 事实 · Top-4 / Top-10</text>
  <rect x="776" y="294" width="420" height="62" rx="12" fill="#fff"/><text x="794" y="320" class="body">2,556 原始问题 − 301 null_query</text><text x="794" y="343" class="small">四个 Profile 全部完成，Advanced 未完成</text><rect x="776" y="374" width="128" height="62" rx="12" fill="#fff"/><text x="794" y="402" class="body">Inference</text><text x="794" y="423" class="small">推断问题</text><rect x="922" y="374" width="128" height="62" rx="12" fill="#fff"/><text x="940" y="402" class="body">Comparison</text><text x="940" y="423" class="small">比较问题</text><rect x="1068" y="374" width="128" height="62" rx="12" fill="#fff"/><text x="1086" y="402" class="body">Temporal</text><text x="1086" y="423" class="small">时序问题</text><text x="776" y="486" class="h2">回答：换领域后还成立吗？</text><text x="776" y="518" class="small">优势：陌生语料与多事实问题检验外部泛化。</text>
  <path d="M534 346 H624" class="arrow"/><path d="M746 346 H656" class="arrow"/><circle cx="640" cy="346" r="40" fill="#fff" stroke="#58708f" stroke-width="2"/><text x="620" y="342" class="body">交叉</text><text x="620" y="363" class="body">验证</text>
  <rect x="222" y="600" width="836" height="76" rx="16" fill="#e8eef6"/><text x="254" y="632" class="h2">共同结论</text><text x="408" y="632" class="body">不寻找脱离任务目标的“最佳 Profile”，而是判断模块适用条件与成本。</text><text x="408" y="657" class="small">诊断集提供解释，公开集检验解释是否能跨语言和领域复现。</text>
</svg>
