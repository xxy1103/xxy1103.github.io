<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 评测与消融闭环</title><desc id="desc">五种 Profile 在相同题集上运行，以召回、排序、答案和成本指标判断各模块的增量价值。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="690" rx="24" fill="#f5f8fc"/><text x="54" y="58" class="title">消融实验：每次只比较一个新增能力</text><text x="54" y="88" class="subtitle">相同语料、问题集和指标下，模块的运行成功与效果提升是两件不同的事。</text>
  <rect x="48" y="132" width="262" height="456" rx="19" fill="#fff" filter="url(#shadow)"/><text x="76" y="170" class="h2">冻结问题与证据</text><text x="76" y="208" class="body">question</text><text x="76" y="238" class="body">answerable</text><text x="76" y="268" class="body">source + evidence_contains</text><text x="76" y="298" class="body">expected_facts</text><text x="76" y="350" class="small">先校验证据仍映射到当前索引，</text><text x="76" y="374" class="small">避免语料变化后继续花费模型调用。</text>
  <path d="M310 360 H374" class="arrow"/><rect x="378" y="132" width="304" height="456" rx="19" fill="#e6effb" filter="url(#shadow)"/><text x="408" y="170" class="h2">五组 Profile</text><text x="408" y="210" class="code">dense</text><text x="408" y="250" class="code">bm25</text><text x="408" y="290" class="code">hybrid</text><text x="408" y="330" class="code">hybrid-rerank</text><text x="408" y="370" class="code">advanced</text><text x="408" y="430" class="small">失败题保留阶段和错误，</text><text x="408" y="454" class="small">可回答题按 0 计入检索指标。</text>
  <path d="M682 360 H746" class="arrow"/><rect x="750" y="132" width="482" height="456" rx="19" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="780" y="170" class="h2">四类观察</text>
  <rect x="780" y="198" width="420" height="70" rx="12" fill="#fff"/><text x="802" y="226" class="body">召回</text><text x="892" y="226" class="small">Source / Chunk Recall@6 / @20</text><text x="802" y="251" class="small">正确证据有没有进入候选与最终上下文</text>
  <rect x="780" y="282" width="420" height="70" rx="12" fill="#fff"/><text x="802" y="310" class="body">排序</text><text x="892" y="310" class="small">MRR@6 · nDCG@6</text><text x="802" y="335" class="small">正确证据排得是否足够靠前</text>
  <rect x="780" y="366" width="420" height="70" rx="12" fill="#fff"/><text x="802" y="394" class="body">答案</text><text x="892" y="394" class="small">Judge · Human Review</text><text x="802" y="419" class="small">正确、完整、依据充分、引用正确</text>
  <rect x="780" y="450" width="420" height="70" rx="12" fill="#fff"/><text x="802" y="478" class="body">成本</text><text x="892" y="478" class="small">Latency · Stage Calls</text><text x="802" y="503" class="small">提升是否值得额外模型调用与等待时间</text>
  <rect x="48" y="622" width="1184" height="42" rx="12" fill="#e8eef6"/><text x="74" y="649" class="body">预注册 Delta：Hybrid−Dense/BM25，Rerank−Hybrid，Advanced−Hybrid-Rerank；负向结果同样保留。</text>
</svg>
