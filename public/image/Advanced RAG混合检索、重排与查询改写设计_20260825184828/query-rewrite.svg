<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Query Rewrite 的输入输出与双路查询</title><desc id="desc">自然语言问题被整理为意图、改写查询和关键词，Dense 使用改写查询，BM25 使用改写查询与关键词。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="650" rx="24" fill="#f5f8fc"/><text x="54" y="58" class="title">Query Rewrite：整理问题，而不是提前回答问题</text><text x="54" y="88" class="subtitle">一次结构化改写产生完整语义查询和精确关键词，分别服务 Dense 与 BM25。</text>
  <rect x="48" y="142" width="254" height="150" rx="17" fill="#e6effb" filter="url(#shadow)"/><text x="76" y="180" class="h2">原始问题</text><text x="76" y="217" class="body">“那个比赛到底要人</text><text x="76" y="243" class="body">会干啥？”</text><text x="76" y="270" class="small">指代不清 · 口语化 · 缺少实体</text>
  <path d="M302 218 H370" class="arrow"/><rect x="374" y="142" width="348" height="300" rx="18" fill="#f0eafb" filter="url(#shadow)"/><text x="404" y="180" class="h2">LLM 查询理解器</text><text x="404" y="216" class="code">temperature = 0</text><text x="404" y="250" class="body">只输出严格 JSON：</text><text x="404" y="282" class="code">intent</text><text x="494" y="282" class="small">意图摘要，仅记录</text><text x="404" y="320" class="code">rewritten_query</text><text x="548" y="320" class="small">补全后的完整问题</text><text x="404" y="358" class="code">keywords[]</text><text x="504" y="358" class="small">实体、术语、缩写、限定词</text><text x="404" y="408" class="small">JSON 不合法时重试；连续失败则明确报错</text>
  <path d="M722 234 H798" class="arrow"/><path d="M760 234 V418 H798" class="arrow"/>
  <rect x="802" y="142" width="430" height="178" rx="18" fill="#e6effb" filter="url(#shadow)"/><text x="832" y="180" class="h2">Dense Query</text><text x="832" y="216" class="code">rewritten_query</text><text x="832" y="250" class="body">完整语义进入 Embedding</text><text x="832" y="280" class="small">例：KDD Cup 2026 Data Agents 核心能力</text>
  <rect x="802" y="360" width="430" height="178" rx="18" fill="#fff1dc" filter="url(#shadow)"/><text x="832" y="398" class="h2">BM25 Query</text><text x="832" y="434" class="code">rewritten_query + keywords</text><text x="832" y="468" class="body">完整问题后追加精确术语</text><text x="832" y="498" class="small">例：KDD Cup 2026 · Data Agents · 核心能力</text>
  <rect x="48" y="574" width="1184" height="42" rx="12" fill="#e8eef6"/><text x="74" y="601" class="body">风险：改写可能误解原意，所以它必须作为独立 Profile 评测，而不能默认视为正向增强。</text>
</svg>
