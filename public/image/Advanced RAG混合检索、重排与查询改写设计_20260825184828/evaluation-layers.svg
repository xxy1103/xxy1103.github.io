<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Advanced RAG 的四层评测对象</title><desc id="desc">从候选召回、最终排序、证据完整性到最终回答，展示每层能回答的问题和当前覆盖边界。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.badge{font:700 12px "Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/><text x="54" y="58" class="title">RAG 评测不能只看一个最终分数</text><text x="54" y="88" class="subtitle">越靠右越接近用户真正关心的正确回答，但每一层都依赖前一层提供可用证据。</text>
  <rect x="52" y="150" width="252" height="354" rx="18" fill="#e6effb" filter="url(#shadow)"/><circle cx="86" cy="184" r="16" fill="#356aa0"/><text x="82" y="189" class="badge">1</text><text x="112" y="190" class="h2">候选召回</text><text x="78" y="239" class="body">正确证据进入候选池了吗？</text><rect x="78" y="274" width="200" height="76" rx="12" fill="#fff"/><text x="94" y="305" class="body">Chunk Recall@20</text><text x="94" y="331" class="small">Coverage@10</text><text x="78" y="398" class="small">失败意味着后续模块</text><text x="78" y="422" class="small">没有正确证据可以处理。</text>
  <path d="M304 327 H342" class="arrow"/><rect x="344" y="150" width="252" height="354" rx="18" fill="#fff1dc" filter="url(#shadow)"/><circle cx="378" cy="184" r="16" fill="#d28a2e"/><text x="374" y="189" class="badge">2</text><text x="404" y="190" class="h2">最终排序</text><text x="370" y="239" class="body">正确证据排得足够靠前吗？</text><rect x="370" y="274" width="200" height="100" rx="12" fill="#fff"/><text x="386" y="305" class="body">Chunk Recall@6</text><text x="386" y="331" class="small">MRR · nDCG · MAP</text><text x="386" y="355" class="small">Hits@K</text><text x="370" y="422" class="small">区分“召回到了”与</text><text x="370" y="446" class="small">“真正送入上下文”。</text>
  <path d="M596 327 H634" class="arrow"/><rect x="636" y="150" width="252" height="354" rx="18" fill="#dff3e8" filter="url(#shadow)"/><circle cx="670" cy="184" r="16" fill="#438a62"/><text x="666" y="189" class="badge">3</text><text x="696" y="190" class="h2">证据完整性</text><text x="662" y="239" class="body">多条所需事实都找全了吗？</text><rect x="662" y="274" width="200" height="100" rx="12" fill="#fff"/><text x="678" y="305" class="body">Evidence Coverage</text><text x="678" y="331" class="small">Complete Evidence</text><text x="678" y="355" class="small">Gold fact coverage</text><text x="662" y="422" class="small">多跳问题不能只命中</text><text x="662" y="446" class="small">其中一篇相关文档。</text>
  <path d="M888 327 H926" class="arrow"/><rect x="928" y="150" width="300" height="354" rx="18" fill="#f0eafb" stroke="#9270bd" stroke-width="2" filter="url(#shadow)"/><circle cx="962" cy="184" r="16" fill="#7753a1"/><text x="958" y="189" class="badge">4</text><text x="988" y="190" class="h2">最终回答</text><text x="954" y="239" class="body">回答正确、完整且有依据吗？</text><rect x="954" y="274" width="248" height="124" rx="12" fill="#fff"/><text x="970" y="305" class="body">Correctness · Completeness</text><text x="970" y="331" class="small">Groundedness</text><text x="970" y="355" class="small">Citation Support</text><text x="970" y="379" class="small">Refusal Accuracy</text><text x="954" y="446" class="small">当前两次完整实验未执行生成，</text><text x="954" y="470" class="small">因此这一层仍待评测。</text>
  <rect x="52" y="548" width="836" height="102" rx="16" fill="#dff3e8"/><text x="78" y="584" class="h2">当前已验证：检索与证据层</text><text x="78" y="615" class="body">回答“证据有没有被找到、是否排得靠前、是否覆盖完整”。</text><rect x="928" y="548" width="300" height="102" rx="16" fill="#f0eafb"/><text x="954" y="584" class="h2">仍待验证：生成层</text><text x="954" y="615" class="body">不能把 Recall 或 MRR 写成答案正确率。</text>
</svg>
