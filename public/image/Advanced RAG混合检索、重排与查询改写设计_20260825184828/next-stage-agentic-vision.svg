<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">从固定 Advanced RAG 到 Agentic Multi-Hop RAG</title>
  <desc id="desc">简单问题继续使用单轮检索，多跳问题沿 A 到 B 到 C 的证据链逐步检索，最后组合证据并生成答案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.node{font:700 22px Consolas,"Microsoft YaHei",sans-serif;fill:#183153}.badge{font:700 12px "Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#8091a6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="760" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">下一阶段：让检索路径适应问题，而不是让问题适应固定流水线</text>
  <text x="54" y="88" class="subtitle">简单问题保持单轮效率；多跳问题沿中间实体逐步补齐证据。</text>

  <rect x="56" y="132" width="238" height="126" rx="18" fill="#e6effb" filter="url(#shadow)"/>
  <text x="84" y="176" class="h2">用户问题</text><text x="84" y="208" class="body">先判断需要直接回答，</text><text x="84" y="232" class="body">还是继续寻找下一跳。</text>
  <path d="M294 195 H372" class="arrow"/>
  <polygon points="458,132 548,195 458,258 368,195" fill="#fff" stroke="#58708f" stroke-width="2" filter="url(#shadow)"/>
  <text x="421" y="190" class="h2">问题路由</text><text x="424" y="216" class="small">单跳 / 多跳</text>

  <path d="M548 174 H650" class="arrow"/>
  <text x="574" y="154" class="small">简单问题</text>
  <rect x="654" y="118" width="250" height="112" rx="18" fill="#dff3e8" filter="url(#shadow)"/>
  <text x="682" y="160" class="h2">复用当前检索链路</text><text x="682" y="190" class="body">Hybrid / Hybrid-Rerank</text><text x="682" y="214" class="small">保持低延迟与已验证能力</text>
  <path d="M904 174 H1050" class="arrow"/>
  <rect x="1054" y="118" width="170" height="112" rx="18" fill="#f0eafb" stroke="#9270bd" stroke-width="2"/>
  <text x="1082" y="160" class="h2">直接回答</text><text x="1082" y="192" class="small">证据约束生成</text>

  <path d="M458 258 V332" class="arrow"/><text x="478" y="298" class="small">多跳问题</text>
  <rect x="56" y="336" width="1168" height="260" rx="20" fill="#fff" opacity=".96" filter="url(#shadow)"/>
  <text x="84" y="374" class="h2">沿证据链逐步检索</text>

  <circle cx="162" cy="468" r="56" fill="#e6effb" stroke="#356aa0" stroke-width="3"/><text x="147" y="476" class="node">A</text><text x="116" y="548" class="small">原问题中的实体</text>
  <path d="M218 468 H404" class="arrow"/><rect x="258" y="412" width="126" height="64" rx="13" fill="#e6effb"/><text x="280" y="441" class="body">检索第 1 跳</text><text x="280" y="463" class="small">发现中间关系</text>
  <circle cx="466" cy="468" r="56" fill="#fff1dc" stroke="#d28a2e" stroke-width="3"/><text x="451" y="476" class="node">B</text><text x="418" y="548" class="small">新发现的中间实体</text>
  <path d="M522 468 H708" class="arrow"/><rect x="562" y="412" width="126" height="64" rx="13" fill="#fff1dc"/><text x="584" y="441" class="body">检索第 2 跳</text><text x="584" y="463" class="small">围绕 B 查询</text>
  <circle cx="770" cy="468" r="56" fill="#dff3e8" stroke="#438a62" stroke-width="3"/><text x="755" y="476" class="node">C</text><text x="734" y="548" class="small">最终答案所在事实</text>
  <path d="M826 468 H966" class="arrow"/>
  <rect x="970" y="400" width="220" height="136" rx="18" fill="#f0eafb" stroke="#9270bd" stroke-width="2"/>
  <text x="998" y="440" class="h2">组合证据链</text><text x="998" y="471" class="body">A → B 与 B → C</text><text x="998" y="497" class="small">共同支持最终答案</text>

  <path d="M1080 536 V646 H642" class="dash"/>
  <rect x="340" y="628" width="604" height="76" rx="16" fill="#e8eef6"/>
  <text x="370" y="660" class="h2">受控决策</text><text x="490" y="660" class="body">继续下一跳 · 修复当前查询 · 生成答案 · 证据不足时结束</text><text x="490" y="684" class="small">动态选择路径，但不允许无限循环或无边界调用。</text>
</svg>
