<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Base RAG 与 Advanced RAG 链路对比</title>
  <desc id="desc">Base RAG 使用 Dense 检索直接选择 Top-K，Advanced RAG 在此基础上增加查询改写、BM25、RRF 和 Rerank。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 11px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.badge{font:700 10px "Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="650" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">从单路语义检索到多阶段 Advanced RAG</text>
  <text x="54" y="88" class="subtitle">回答目标没有改变；Phase 2 在检索前、召回层和排序层逐步增加可独立评测的能力。</text>

  <rect x="42" y="120" width="1196" height="190" rx="20" fill="#fff" opacity=".95"/>
  <text x="68" y="156" class="lane">Base RAG</text>
  <rect x="230" y="184" width="170" height="86" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="258" y="219" class="h2">Question</text><text x="258" y="246" class="body">用户原始问题</text>
  <path d="M400 227 H478" class="arrow"/>
  <rect x="480" y="184" width="170" height="86" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="508" y="219" class="h2">Dense</text><text x="508" y="246" class="body">向量语义检索</text>
  <path d="M650 227 H728" class="arrow"/>
  <rect x="730" y="184" width="150" height="86" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="758" y="219" class="h2">Top-K</text><text x="758" y="246" class="body">选择最终证据</text>
  <path d="M880 227 H958" class="arrow"/>
  <rect x="960" y="184" width="170" height="86" rx="14" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="988" y="219" class="h2">LLM</text><text x="988" y="246" class="body">基于证据回答</text>

  <rect x="42" y="334" width="1196" height="234" rx="20" fill="#fff" opacity=".95"/>
  <text x="68" y="370" class="lane">Advanced RAG</text>
  <rect x="56" y="416" width="132" height="96" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="78" y="452" class="h2">Question</text><text x="78" y="480" class="body">用户原始问题</text>
  <path d="M188 464 H217" class="arrow"/>
  <rect x="219" y="416" width="150" height="96" rx="14" fill="#f0eafb" filter="url(#shadow)"/><circle cx="345" cy="432" r="12" fill="#7655a6"/><text x="336" y="436" class="badge">新增</text><text x="241" y="452" class="h2">Rewrite</text><text x="241" y="480" class="body">补全指代与术语</text>
  <path d="M369 464 H398" class="arrow"/>
  <rect x="400" y="404" width="170" height="120" rx="14" fill="#fff1dc" filter="url(#shadow)"/><circle cx="546" cy="420" r="12" fill="#c78a32"/><text x="537" y="424" class="badge">新增</text><text x="422" y="442" class="h2">Dense + BM25</text><text x="422" y="470" class="body">语义 + 精确词召回</text><text x="422" y="497" class="small">两路 Top-20 候选</text>
  <path d="M570 464 H599" class="arrow"/>
  <rect x="601" y="416" width="132" height="96" rx="14" fill="#dff3e8" filter="url(#shadow)"/><circle cx="709" cy="432" r="12" fill="#40845f"/><text x="700" y="436" class="badge">新增</text><text x="623" y="452" class="h2">RRF</text><text x="623" y="480" class="body">融合两路名次</text>
  <path d="M733 464 H762" class="arrow"/>
  <rect x="764" y="416" width="150" height="96" rx="14" fill="#f0eafb" filter="url(#shadow)"/><circle cx="890" cy="432" r="12" fill="#7655a6"/><text x="881" y="436" class="badge">新增</text><text x="786" y="452" class="h2">Rerank</text><text x="786" y="480" class="body">候选相关性精排</text>
  <path d="M914 464 H943" class="arrow"/>
  <rect x="945" y="416" width="132" height="96" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="967" y="452" class="h2">Top-K</text><text x="967" y="480" class="body">最终 6 条证据</text>
  <path d="M1077 464 H1106" class="arrow"/>
  <rect x="1108" y="416" width="132" height="96" rx="14" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="1130" y="452" class="h2">LLM</text><text x="1130" y="480" class="body">基于证据回答</text>

  <rect x="42" y="596" width="1196" height="34" rx="11" fill="#e8eef6"/><text x="68" y="619" class="small">增量关系：Base RAG 的 Dense、Top-K 与证据约束生成仍然保留；新增模块只改善查询表达、召回覆盖和候选排序。</text>
</svg>
