<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">RRF 融合 Dense 与 BM25 排名</title>
  <desc id="desc">两路检索结果按 chunk id 合并，以倒数排名相加得到统一 RRF 分数和新排名。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 14px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="650" rx="24" fill="#f5f8fc"/><text x="54" y="58" class="title">RRF：不比较不同尺度的原始分数，只融合名次</text><text x="54" y="88" class="subtitle">同一 Chunk 同时被 Dense 与 BM25 排在前列时，会得到两路倒数排名加分。</text>
  <rect x="48" y="126" width="280" height="382" rx="19" fill="#e6effb" filter="url(#shadow)"/><text x="78" y="166" class="h2">Dense 排名</text><text x="78" y="204" class="code">1 · Chunk A</text><text x="78" y="244" class="code">2 · Chunk C</text><text x="78" y="284" class="code">3 · Chunk B</text><text x="78" y="324" class="code">4 · Chunk E</text><text x="78" y="386" class="small">原始分数：余弦相似度</text><text x="78" y="412" class="small">不能与 BM25 分数直接相加</text>
  <rect x="372" y="126" width="280" height="382" rx="19" fill="#fff1dc" filter="url(#shadow)"/><text x="402" y="166" class="h2">BM25 排名</text><text x="402" y="204" class="code">1 · Chunk D</text><text x="402" y="244" class="code">2 · Chunk B</text><text x="402" y="284" class="code">3 · Chunk C</text><text x="402" y="324" class="code">4 · Chunk F</text><text x="402" y="386" class="small">原始分数：词频与 IDF</text><text x="402" y="412" class="small">数值范围与 Dense 不同</text>
  <path d="M328 300 H700" class="arrow"/><path d="M652 300 H700" class="arrow"/>
  <rect x="704" y="126" width="528" height="382" rx="19" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="736" y="166" class="h2">合并 chunk_id，并计算 RRF 分数</text><text x="736" y="207" class="code">score(d) = Σ 1 / (60 + rank(d))</text>
  <rect x="736" y="238" width="462" height="52" rx="11" fill="#fff"/><text x="756" y="270" class="body">Chunk B：Dense #3 + BM25 #2 → 两路共同支持</text>
  <rect x="736" y="304" width="462" height="52" rx="11" fill="#fff"/><text x="756" y="336" class="body">Chunk C：Dense #2 + BM25 #3 → 两路共同支持</text>
  <rect x="736" y="370" width="462" height="52" rx="11" fill="#fff"/><text x="756" y="402" class="body">Chunk A：Dense #1 → 只获得一路加分</text>
  <text x="736" y="462" class="small">输出新的 rrf_score / rrf_rank，同时保留 dense_* 与 bm25_*</text>
  <rect x="48" y="548" width="1184" height="66" rx="14" fill="#e8eef6"/><text x="74" y="577" class="body">RRF 的目标是稳健召回：两路共同认可的候选优先，但只被一路找到的候选仍能保留。</text><text x="74" y="600" class="small">它不负责判断 Chunk 是否完整回答问题；精细相关性由下一阶段 Reranker 判断。</text>
</svg>
