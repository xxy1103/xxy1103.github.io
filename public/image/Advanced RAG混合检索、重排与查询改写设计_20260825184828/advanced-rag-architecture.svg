<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Advanced RAG Phase 2 完整架构</title><desc id="desc">离线阶段建立 FAISS 与 BM25 双索引，在线阶段经过查询改写、双路召回、RRF、重排、生成与评测。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 11px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.badge{font:700 11px "Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8091a6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="900" rx="24" fill="url(#bg)"/><text x="54" y="58" class="title">Advanced RAG Phase 2：双索引、多阶段排序、完整评测轨迹</text><text x="54" y="88" class="subtitle">离线阶段保证 Dense 与 BM25 使用同一批 Chunk；在线阶段按 Profile 选择实际执行路径。</text>
  <rect x="42" y="120" width="1196" height="258" rx="20" fill="#fff" opacity=".95"/><text x="66" y="154" class="lane">阶段 A · 离线双索引建库</text>
  <rect x="68" y="194" width="180" height="104" rx="14" fill="#e6effb" filter="url(#shadow)"/><circle cx="91" cy="217" r="12" fill="#356aa0"/><text x="88" y="221" class="badge">1</text><text x="114" y="221" class="h2">本地语料</text><text x="91" y="253" class="body">Markdown · HTML · PDF</text><text x="91" y="276" class="small">Loader 清洗并保留来源</text>
  <path d="M248 246 H286" class="arrow"/><rect x="288" y="194" width="180" height="104" rx="14" fill="#e6effb" filter="url(#shadow)"/><circle cx="311" cy="217" r="12" fill="#356aa0"/><text x="308" y="221" class="badge">2</text><text x="334" y="221" class="h2">标题感知 Chunk</text><text x="311" y="253" class="body">section · overlap</text><text x="311" y="276" class="small">共同的数据与语料哈希</text>
  <path d="M468 246 H524" class="arrow"/><path d="M496 246 V332 H524" class="arrow"/>
  <rect x="526" y="174" width="278" height="94" rx="14" fill="#f0eafb" filter="url(#shadow)"/><text x="552" y="208" class="h2">Embedding 批处理</text><text x="552" y="237" class="body">归一化向量 → FAISS IndexFlatIP</text><text x="552" y="258" class="small">index.faiss · chunks.jsonl · metadata</text>
  <rect x="526" y="284" width="278" height="74" rx="14" fill="#fff1dc" filter="url(#shadow)"/><text x="552" y="317" class="h2">BM25 统计</text><text x="552" y="344" class="body">tokenize · TF · DF · length → bm25.json</text>
  <path d="M804 221 H864" class="arrow"/><path d="M804 321 H834 Q846 321 846 309 V279 Q846 267 864 267" class="arrow"/>
  <rect x="868" y="194" width="340" height="104" rx="14" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="896" y="230" class="h2">一致的双索引</text><text x="896" y="260" class="body">同一 Chunk 列表 · 同一 corpus_hash</text><text x="896" y="283" class="small">不一致时拒绝加载并要求重新 ingest</text>
  <rect x="42" y="404" width="1196" height="360" rx="20" fill="#fff" opacity=".95"/><text x="66" y="438" class="lane">阶段 B · 在线多阶段问答</text>
  <rect x="66" y="486" width="146" height="90" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="88" y="520" class="h2">用户问题</text><text x="88" y="549" class="small">原始 Question</text>
  <path d="M212 531 H250" class="arrow"/><rect x="252" y="474" width="182" height="114" rx="14" fill="#f0eafb" filter="url(#shadow)"/><text x="274" y="508" class="h2">Query Rewrite</text><text x="274" y="538" class="body">rewritten_query</text><text x="274" y="563" class="body">keywords</text><text x="274" y="582" class="small">仅 Advanced</text>
  <path d="M434 515 H474" class="arrow"/><path d="M454 515 V655 H474" class="arrow"/>
  <rect x="476" y="466" width="178" height="100" rx="14" fill="#e6effb" filter="url(#shadow)"/><text x="498" y="500" class="h2">Dense Top-20</text><text x="498" y="530" class="body">语义向量相似度</text><text x="498" y="550" class="small">dense_score / rank</text>
  <rect x="476" y="610" width="178" height="100" rx="14" fill="#fff1dc" filter="url(#shadow)"/><text x="498" y="644" class="h2">BM25 Top-20</text><text x="498" y="674" class="body">词项统计相关性</text><text x="498" y="694" class="small">bm25_score / rank</text>
  <path d="M654 516 H706" class="arrow"/><path d="M654 660 H680 Q692 660 692 648 V552 Q692 540 706 540" class="arrow"/>
  <rect x="708" y="486" width="164" height="108" rx="14" fill="#dff3e8" filter="url(#shadow)"/><text x="730" y="520" class="h2">RRF Top-30</text><text x="730" y="550" class="body">融合两路名次</text><text x="730" y="574" class="small">rrf_score / rank</text>
  <path d="M872 540 H918" class="arrow"/><rect x="920" y="486" width="164" height="108" rx="14" fill="#f0eafb" filter="url(#shadow)"/><text x="942" y="520" class="h2">Rerank Top-6</text><text x="942" y="550" class="body">问题-候选精排</text><text x="942" y="574" class="small">rerank_score / rank</text>
  <path d="M1084 540 H1120" class="arrow"/><rect x="1122" y="486" width="94" height="108" rx="14" fill="#dff3e8" stroke="#6aa281" stroke-width="2"/><text x="1140" y="520" class="h2">证据</text><text x="1140" y="548" class="body">Top-6</text><text x="1140" y="574" class="small">Context</text>
  <path d="M1169 594 V662 H1018" class="arrow"/><rect x="780" y="632" width="286" height="92" rx="14" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="804" y="666" class="h2">证据约束生成</text><text x="804" y="694" class="body">Answer + Citations</text><text x="804" y="714" class="small">无证据时跳过 LLM 并拒答</text>
  <path d="M780 678 H366" class="dash"/><rect x="66" y="632" width="300" height="92" rx="14" fill="#e8eef6"/><text x="90" y="666" class="h2">Run Trace</text><text x="90" y="694" class="body">查询 · 候选 · Prompt</text><text x="90" y="714" class="small">耗时 · 调用 · 配置快照</text>
  <rect x="42" y="794" width="1196" height="70" rx="14" fill="#e8eef6"/><text x="68" y="824" class="body">评测层复用同一 ask()：Source/Chunk Recall、MRR、nDCG、无答案行为、Judge、人工复核、延迟与调用数。</text><text x="68" y="848" class="small">Profile 决定实际路径：未启用的 Rewrite、BM25、RRF 或 Rerank 不执行，不进行静默回退。</text>
</svg>
