<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">两阶段检索与 Cross-Encoder 精排</title><desc id="desc">快速召回从全库找到三十个候选，Cross-Encoder 将问题与候选逐对编码后选出六条最终证据。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="680" rx="24" fill="url(#bg)"/><text x="54" y="58" class="title">两阶段检索：先高召回，再高精度</text><text x="54" y="88" class="subtitle">Cross-Encoder 判断候选是否真正回答问题，但计算较重，因此只处理已经缩小的候选池。</text>
  <rect x="48" y="128" width="1184" height="454" rx="20" fill="#fff" opacity=".94"/>
  <text x="76" y="164" class="lane">第一阶段 · 快速召回</text><rect x="76" y="194" width="250" height="118" rx="16" fill="#e6effb" filter="url(#shadow)"/><text x="104" y="232" class="h2">完整知识库</text><text x="104" y="263" class="body">数千个 Chunk</text><text x="104" y="287" class="small">预计算 Dense / BM25 索引</text>
  <path d="M326 253 H392" class="arrow"/><rect x="396" y="194" width="276" height="118" rx="16" fill="#e6effb" filter="url(#shadow)"/><text x="424" y="232" class="h2">Dense + BM25 + RRF</text><text x="424" y="263" class="body">快速筛出 Top-30</text><text x="424" y="287" class="small">目标：尽量不漏掉正确证据</text>
  <path d="M672 253 H732" class="arrow"/><rect x="736" y="194" width="200" height="118" rx="16" fill="#fff1dc" filter="url(#shadow)"/><text x="764" y="232" class="h2">候选池</text><text x="764" y="263" class="body">30 个 SearchHit</text><text x="764" y="287" class="small">顺序仍可能不理想</text>
  <text x="76" y="374" class="lane">第二阶段 · Cross-Encoder 精排</text><rect x="76" y="402" width="330" height="116" rx="16" fill="#f0eafb" filter="url(#shadow)"/><text x="104" y="438" class="code">[Question] + [Candidate 1]</text><text x="104" y="469" class="code">[Question] + [Candidate 2]</text><text x="104" y="500" class="code">... × 30</text>
  <path d="M406 460 H476" class="arrow"/><rect x="480" y="402" width="296" height="116" rx="16" fill="#f0eafb" filter="url(#shadow)"/><text x="508" y="438" class="h2">qwen3-rerank</text><text x="508" y="469" class="body">逐对输出 relevance_score</text><text x="508" y="496" class="small">问题词与文本词可直接交互</text>
  <path d="M776 460 H846" class="arrow"/><rect x="850" y="402" width="330" height="116" rx="16" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><text x="878" y="438" class="h2">最终 Top-6 证据</text><text x="878" y="469" class="body">重写 score / rank</text><text x="878" y="496" class="small">保留 Dense、BM25、RRF 历史轨迹</text>
  <rect x="48" y="610" width="1184" height="42" rx="12" fill="#e8eef6"/><text x="74" y="637" class="body">能力边界：Reranker 只能重新排列候选池，正确 Chunk 没进入 Top-30 时无法被精排找回。</text>
</svg>
