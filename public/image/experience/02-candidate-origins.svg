<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">提案从哪里来，批准后写到哪里？</title><desc id="desc">直接提交、主动生成、Dream 可指定目标；普通孵化使用空目标。有效提案进入审核，空目标创建新身份，精确目标更新原身份。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#718798" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
<rect width="1000" height="1100" rx="24" fill="#F5F8FB"/>
<rect x="36" y="32" width="5" height="58" rx="2" fill="#087E82"/>
<text x="58" y="48" font-size="12" fill="#087E82" font-weight="600" text-anchor="start">POWERCONTEXT  /  EXPERIENCE  /  02</text>
<text x="58" y="86" font-size="30" fill="#183249" font-weight="650" text-anchor="start">提案从哪里来，批准后写到哪里？</text>
<path d="M 36 1043 L 964 1043" fill="none" stroke="#D6E1E9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="1072" font-size="15" fill="#566B7D" font-weight="400" text-anchor="start">创建规则 · target 表达写入意图；正式内容在批准后提交</text>
<text x="964" y="1072" font-size="15" fill="#087E82" font-weight="600" text-anchor="end">02</text>
<text x="36" y="127" font-size="19" fill="#566B7D" font-weight="400" text-anchor="start">先看创建入口，再看 target；普通孵化有自己的固定分支。</text>
<rect x="36" y="158" width="580" height="116" rx="16" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="58" y="193" font-size="23" fill="#183249" font-weight="600" text-anchor="start">调用方可明确指定 target</text>
<text x="58" y="230" font-size="20" fill="#183249" font-weight="400" text-anchor="start">直接提交  /  主动模型生成  /  Dream</text>
<rect x="644" y="158" width="320" height="116" rx="16" fill="#F0F4F7" stroke="#D6E1E9"/>
<text x="666" y="193" font-size="23" fill="#566B7D" font-weight="600" text-anchor="start">普通后台孵化</text>
<text x="666" y="230" font-size="20" fill="#183249" font-weight="400" text-anchor="start">任务结果 → 提炼新经验</text>
<path d="M 326 275 L 326 318" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 804 275 L 804 318" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="326" width="580" height="108" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="58" y="361" font-size="23" fill="#A56613" font-weight="600" text-anchor="start">有有效提案，且校验通过</text>
<text x="58" y="398" font-size="20" fill="#183249" font-weight="400" text-anchor="start">进入 pending；target 可为空或精确引用</text>
<rect x="644" y="326" width="320" height="108" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="666" y="361" font-size="23" fill="#A56613" font-weight="600" text-anchor="start">有有效提案</text>
<text x="666" y="398" font-size="20" fill="#183249" font-weight="400" text-anchor="start">进入 pending；target 为空</text>
<text x="36" y="474" font-size="18" fill="#566B7D" font-weight="400" text-anchor="start">模型生成 / Dream 未提出内容或证据不足 → 不创建 Candidate</text>
<rect x="36" y="513" width="928" height="96" rx="16" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="500" y="549" font-size="24" fill="#183249" font-weight="600" text-anchor="middle">读取 Candidate 的 target</text>
<text x="500" y="580" font-size="19" fill="#566B7D" font-weight="400" text-anchor="middle">引用某份经验作证据，并不自动表示要更新它</text>
<path d="M 326 435 V 447 H 20 V 561 H 29" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 804 435 V 447 H 984 V 561 H 971" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 280 610 V 654" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 720 610 V 654" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="661" width="444" height="139" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="58" y="696" font-size="23" fill="#A56613" font-weight="600" text-anchor="start">target 为空</text>
<text x="58" y="733" font-size="20" fill="#183249" font-weight="400" text-anchor="start">准备创建新的 Experience</text>
<text x="58" y="763" font-size="20" fill="#183249" font-weight="400" text-anchor="start">普通孵化走这一分支</text>
<rect x="520" y="661" width="444" height="139" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="542" y="696" font-size="23" fill="#A56613" font-weight="600" text-anchor="start">target = exp_01 @ 1</text>
<text x="542" y="733" font-size="20" fill="#183249" font-weight="400" text-anchor="start">准备更新已有 Experience</text>
<text x="542" y="763" font-size="20" fill="#183249" font-weight="400" text-anchor="start">目标必须是可用的当前版本</text>
<path d="M 258 801 L 258 865" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="195" y="813" width="126" height="30" rx="15" fill="#FFF4E4"/>
<text x="258.0" y="834" font-size="15" fill="#A56613" font-weight="600" text-anchor="middle">审核并批准</text>
<path d="M 742 801 L 742 865" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="679" y="813" width="126" height="30" rx="15" fill="#FFF4E4"/>
<text x="742.0" y="834" font-size="15" fill="#A56613" font-weight="600" text-anchor="middle">审核并批准</text>
<rect x="36" y="873" width="444" height="122" rx="16" fill="#EDF4FD" stroke="#D6E1E9"/>
<text x="58" y="908" font-size="23" fill="#2464B3" font-weight="600" text-anchor="start">新的 Artifact 身份</text>
<text x="58" y="945" font-size="20" fill="#183249" font-weight="400" text-anchor="start">例如：experience / exp_02 @ 1</text>
<rect x="520" y="873" width="444" height="122" rx="16" fill="#EDF4FD" stroke="#D6E1E9"/>
<text x="542" y="908" font-size="23" fill="#2464B3" font-weight="600" text-anchor="start">沿用原 Artifact 身份</text>
<text x="542" y="945" font-size="20" fill="#183249" font-weight="400" text-anchor="start">结果：experience / exp_01 @ 2</text>
</svg>
