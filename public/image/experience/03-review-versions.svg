<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="925" viewBox="0 0 1000 925" role="img" aria-labelledby="title desc">
<title id="title">提案改了几次，和正式版本分开计数</title><desc id="desc">第一个 Candidate 的第三版批准后创建 Experience 第一版，第二个 Candidate 的第二版批准后创建 Experience 第二版；拒绝不产生正式版本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#718798" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
<rect width="1000" height="925" rx="24" fill="#F5F8FB"/>
<rect x="36" y="32" width="5" height="58" rx="2" fill="#087E82"/>
<text x="58" y="48" font-size="12" fill="#087E82" font-weight="600" text-anchor="start">POWERCONTEXT  /  EXPERIENCE  /  03</text>
<text x="58" y="86" font-size="30" fill="#183249" font-weight="650" text-anchor="start">提案改了几次，和正式版本分开计数</text>
<path d="M 36 868 L 964 868" fill="none" stroke="#D6E1E9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="897" font-size="15" fill="#566B7D" font-weight="400" text-anchor="start">版本关系 · Candidate Version 记录提案修改；Artifact Revision 记录正式内容</text>
<text x="964" y="897" font-size="15" fill="#087E82" font-weight="600" text-anchor="end">03</text>
<text x="36" y="127" font-size="19" fill="#566B7D" font-weight="400" text-anchor="start">每次更新正式经验，创建新的提案；提案内部可以继续修订。</text>
<rect x="36" y="156" width="126" height="30" rx="15" fill="#F0F4F7"/>
<text x="99.0" y="177" font-size="15" fill="#566B7D" font-weight="600" text-anchor="middle">第一次提案</text>
<rect x="36" y="200" width="928" height="136" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="58" y="235" font-size="19" fill="#A56613" font-weight="600" text-anchor="start">提案 · cand_01</text>
<rect x="292" y="245" width="146" height="58" rx="10" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="365" y="283" font-size="24" fill="#A56613" font-weight="600" text-anchor="middle" class="mono">V1</text>
<rect x="502" y="245" width="146" height="58" rx="10" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="575" y="283" font-size="24" fill="#A56613" font-weight="600" text-anchor="middle" class="mono">V2</text>
<rect x="712" y="245" width="146" height="58" rx="10" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="785" y="283" font-size="24" fill="#A56613" font-weight="600" text-anchor="middle" class="mono">V3</text>
<path d="M 447 274 L 491 274" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 657 274 L 701 274" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 785 337 L 785 389" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="810" y="370" font-size="18" fill="#A56613" font-weight="600" text-anchor="start">批准</text>
<rect x="36" y="398" width="928" height="80" rx="16" fill="#EDF4FD" stroke="#D6E1E9"/>
<text x="58" y="444" font-size="20" fill="#2464B3" font-weight="600" text-anchor="start">正式制品</text>
<text x="939" y="444" font-size="24" fill="#2464B3" font-weight="600" text-anchor="end" class="mono">experience / exp_01 @ 1</text>
<rect x="36" y="502" width="150" height="30" rx="15" fill="#F0F4F7"/>
<text x="111.0" y="523" font-size="15" fill="#566B7D" font-weight="600" text-anchor="middle">新增验证证据</text>
<text x="210" y="524" font-size="20" fill="#566B7D" font-weight="400" text-anchor="start">发起新的 cand_02，明确 target = exp_01 @ 1</text>
<rect x="36" y="548" width="928" height="136" rx="16" fill="#FFF4E4" stroke="#D6E1E9"/>
<text x="58" y="583" font-size="19" fill="#A56613" font-weight="600" text-anchor="start">提案 · cand_02</text>
<rect x="502" y="594" width="146" height="58" rx="10" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="575" y="632" font-size="24" fill="#A56613" font-weight="600" text-anchor="middle" class="mono">V1</text>
<rect x="712" y="594" width="146" height="58" rx="10" fill="#FFFFFF" stroke="#D6E1E9"/>
<text x="785" y="632" font-size="24" fill="#A56613" font-weight="600" text-anchor="middle" class="mono">V2</text>
<path d="M 657 623 L 701 623" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 785 685 L 785 737" fill="none" stroke="#718798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="810" y="718" font-size="18" fill="#A56613" font-weight="600" text-anchor="start">批准</text>
<rect x="36" y="746" width="928" height="80" rx="16" fill="#EDF4FD" stroke="#D6E1E9"/>
<text x="58" y="792" font-size="20" fill="#2464B3" font-weight="600" text-anchor="start">正式制品</text>
<text x="939" y="792" font-size="24" fill="#2464B3" font-weight="600" text-anchor="end" class="mono">experience / exp_01 @ 2</text>
<text x="36" y="852" font-size="18" fill="#566B7D" font-weight="400" text-anchor="start">另一种决定：pending → rejected，保留拒绝理由，不产生正式版本。</text>
</svg>
