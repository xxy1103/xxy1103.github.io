<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Base RAG 离线建库与在线问答</title>
  <desc id="desc">离线阶段把本地文档转换为 FAISS 索引和 Chunk 元数据，在线阶段复用索引检索证据并生成回答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.badge{font:700 12px "Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="760" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">两阶段结构：语料变化时建库，用户提问时复用索引</text>
  <text x="54" y="88" class="subtitle">离线阶段计算成本较高但可复用；在线阶段只编码问题、检索少量证据并调用一次生成模型。</text>

  <rect x="42" y="122" width="1196" height="246" rx="20" fill="#fff" opacity=".94"/>
  <text x="66" y="156" class="lane">阶段 A · 离线建库 ingest</text>
  <rect x="70" y="198" width="190" height="108" rx="15" fill="#e6effb" filter="url(#shadow)"/><circle cx="94" cy="222" r="13" fill="#356aa0"/><text x="90" y="226" class="badge">1</text><text x="118" y="227" class="h2">本地语料</text><text x="94" y="257" class="body">PDF · MD · HTML</text><text x="94" y="280" class="small">递归扫描允许扩展名</text>
  <path d="M260 252 H304" class="arrow"/>
  <rect x="306" y="198" width="190" height="108" rx="15" fill="#e6effb" filter="url(#shadow)"/><circle cx="330" cy="222" r="13" fill="#356aa0"/><text x="326" y="226" class="badge">2</text><text x="354" y="227" class="h2">统一文档</text><text x="330" y="257" class="body">清洗正文 · 保留来源</text><text x="330" y="280" class="small">SourceDocument</text>
  <path d="M496 252 H540" class="arrow"/>
  <rect x="542" y="198" width="190" height="108" rx="15" fill="#e6effb" filter="url(#shadow)"/><circle cx="566" cy="222" r="13" fill="#356aa0"/><text x="562" y="226" class="badge">3</text><text x="590" y="227" class="h2">标题感知切块</text><text x="566" y="257" class="body">长度 · 自然边界</text><text x="566" y="280" class="small">overlap 保留边界上下文</text>
  <path d="M732 252 H776" class="arrow"/>
  <rect x="778" y="198" width="190" height="108" rx="15" fill="#f0eafb" filter="url(#shadow)"/><circle cx="802" cy="222" r="13" fill="#7655a6"/><text x="798" y="226" class="badge">4</text><text x="826" y="227" class="h2">Chunk Embedding</text><text x="802" y="257" class="body">title + section + text</text><text x="802" y="280" class="small">分批得到 N × d 向量矩阵</text>
  <path d="M968 252 H1012" class="arrow"/>
  <rect x="1014" y="198" width="194" height="108" rx="15" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><circle cx="1038" cy="222" r="13" fill="#40845f"/><text x="1034" y="226" class="badge">5</text><text x="1062" y="227" class="h2">持久化索引</text><text x="1038" y="257" class="body">FAISS · chunks.jsonl</text><text x="1038" y="280" class="small">metadata 记录构建身份</text>

  <path d="M1110 306 V404" class="arrow"/>
  <rect x="42" y="400" width="1196" height="246" rx="20" fill="#fff" opacity=".94"/>
  <text x="66" y="434" class="lane">阶段 B · 在线问答 ask</text>
  <rect x="70" y="476" width="190" height="108" rx="15" fill="#e6effb" filter="url(#shadow)"/><circle cx="94" cy="500" r="13" fill="#356aa0"/><text x="90" y="504" class="badge">1</text><text x="118" y="505" class="h2">用户问题</text><text x="94" y="535" class="body">同一模型编码问题</text><text x="94" y="558" class="small">确保处于同一向量空间</text>
  <path d="M260 530 H304" class="arrow"/>
  <rect x="306" y="476" width="190" height="108" rx="15" fill="#e6effb" filter="url(#shadow)"/><circle cx="330" cy="500" r="13" fill="#356aa0"/><text x="326" y="504" class="badge">2</text><text x="354" y="505" class="h2">Top-K 检索</text><text x="330" y="535" class="body">IndexFlatIP 精确搜索</text><text x="330" y="558" class="small">归一化内积 = 余弦相似度</text>
  <path d="M496 530 H540" class="arrow"/>
  <rect x="542" y="476" width="190" height="108" rx="15" fill="#e6effb" filter="url(#shadow)"/><circle cx="566" cy="500" r="13" fill="#356aa0"/><text x="562" y="504" class="badge">3</text><text x="590" y="505" class="h2">过滤与装配</text><text x="566" y="535" class="body">min_score · Context 预算</text><text x="566" y="558" class="small">高排名完整证据优先</text>
  <path d="M732 530 H776" class="arrow"/>
  <rect x="778" y="476" width="190" height="108" rx="15" fill="#f0eafb" filter="url(#shadow)"/><circle cx="802" cy="500" r="13" fill="#7655a6"/><text x="798" y="504" class="badge">4</text><text x="826" y="505" class="h2">证据约束生成</text><text x="802" y="535" class="body">Question + Context</text><text x="802" y="558" class="small">无命中时跳过 LLM</text>
  <path d="M968 530 H1012" class="arrow"/>
  <rect x="1014" y="476" width="194" height="108" rx="15" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/><circle cx="1038" cy="500" r="13" fill="#40845f"/><text x="1034" y="504" class="badge">5</text><text x="1062" y="505" class="h2">回答与运行记录</text><text x="1038" y="535" class="body">Answer · Citations</text><text x="1038" y="558" class="small">hits · prompt · elapsed</text>

  <rect x="42" y="680" width="1196" height="44" rx="12" fill="#e8eef6"/>
  <text x="68" y="708" class="body">索引复用边界：原始语料、Embedding 模型、维度或切块策略变化后，应重新执行 ingest。</text>
</svg>
