<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Base RAG 关键参数的影响路径</title>
  <desc id="desc">切块参数影响知识单元，检索参数影响候选证据，上下文预算影响模型实际阅读内容，生成参数影响答案表达。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="700" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">关键参数不是孤立旋钮，而是一条连续影响链</text>
  <text x="54" y="88" class="subtitle">前一阶段决定后一阶段的输入上限；生成参数无法补救没有被检索或没有进入 Context 的事实。</text>

  <rect x="42" y="128" width="268" height="460" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="68" y="166" class="h2">① 知识如何被切分</text>
  <rect x="68" y="198" width="216" height="92" rx="13" fill="#e8f1fb"/><text x="90" y="228" class="code">chunk_size</text><text x="90" y="255" class="body">控制一个 Chunk 的主题跨度</text><text x="90" y="278" class="small">太小破碎，太大混入多主题</text>
  <rect x="68" y="310" width="216" height="92" rx="13" fill="#e8f1fb"/><text x="90" y="340" class="code">chunk_overlap</text><text x="90" y="367" class="body">保留切分边界附近上下文</text><text x="90" y="390" class="small">过大增加重复和成本</text>
  <rect x="68" y="442" width="216" height="92" rx="13" fill="#dff3e8"/><text x="90" y="472" class="h2">直接结果</text><text x="90" y="499" class="body">Chunk 内容、数量与向量语义</text><text x="90" y="522" class="small">决定正确证据能否独立存在</text>

  <path d="M310 358 H350" class="arrow"/>
  <rect x="352" y="128" width="268" height="460" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="378" y="166" class="h2">② 哪些候选被召回</text>
  <rect x="378" y="198" width="216" height="92" rx="13" fill="#e8f1fb"/><text x="400" y="228" class="code">top_k</text><text x="400" y="255" class="body">保留最高分候选的数量</text><text x="400" y="278" class="small">太小漏事实，太大引入噪声</text>
  <rect x="378" y="310" width="216" height="92" rx="13" fill="#fff1dc"/><text x="400" y="340" class="code">min_score</text><text x="400" y="367" class="body">过滤绝对相似度过低结果</text><text x="400" y="390" class="small">需按模型与语料校准</text>
  <rect x="378" y="442" width="216" height="92" rx="13" fill="#dff3e8"/><text x="400" y="472" class="h2">直接结果</text><text x="400" y="499" class="body">SearchHit 集合与排名</text><text x="400" y="522" class="small">决定“找到哪些资料”</text>

  <path d="M620 358 H660" class="arrow"/>
  <rect x="662" y="128" width="268" height="460" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="688" y="166" class="h2">③ 哪些证据真正被阅读</text>
  <rect x="688" y="198" width="216" height="112" rx="13" fill="#e8f1fb"/><text x="710" y="228" class="code">max_context_characters</text><text x="710" y="257" class="body">按排名装入完整证据块</text><text x="710" y="281" class="small">超预算后停止，不截断当前块</text>
  <rect x="688" y="330" width="216" height="72" rx="13" fill="#fff1dc"/><text x="710" y="360" class="h2">风险</text><text x="710" y="385" class="body">命中不等于进入 Prompt</text>
  <rect x="688" y="442" width="216" height="92" rx="13" fill="#dff3e8"/><text x="710" y="472" class="h2">直接结果</text><text x="710" y="499" class="body">LLM 实际可见的 Context</text><text x="710" y="522" class="small">决定“模型读到了什么”</text>

  <path d="M930 358 H970" class="arrow"/>
  <rect x="972" y="128" width="266" height="460" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="998" y="166" class="h2">④ 答案如何表达</text>
  <rect x="998" y="198" width="214" height="92" rx="13" fill="#f0eafb"/><text x="1020" y="228" class="code">temperature</text><text x="1020" y="255" class="body">控制生成随机性</text><text x="1020" y="278" class="small">资料问答通常偏低</text>
  <rect x="998" y="310" width="214" height="92" rx="13" fill="#f0eafb"/><text x="1020" y="340" class="code">max_tokens</text><text x="1020" y="367" class="body">控制最大输出长度</text><text x="1020" y="390" class="small">不增加检索证据覆盖</text>
  <rect x="998" y="442" width="214" height="92" rx="13" fill="#dff3e8"/><text x="1020" y="472" class="h2">直接结果</text><text x="1020" y="499" class="body">答案稳定性与完整度</text><text x="1020" y="522" class="small">不能修复上游漏召回</text>

  <rect x="42" y="622" width="1196" height="44" rx="12" fill="#e8eef6"/>
  <text x="68" y="650" class="body">调参顺序建议：先确认正确证据是否存在于 Chunk，再看 Top-K 与排名，随后看 Context，最后才调整生成表达。</text>
</svg>
