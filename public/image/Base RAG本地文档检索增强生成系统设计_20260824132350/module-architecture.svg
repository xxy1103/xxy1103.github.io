<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Base RAG 工程模块架构</title>
  <desc id="desc">命令和配置进入 pipeline 编排层，再调用加载、切块、模型与向量存储模块，数据对象贯穿各层。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 14px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">模块边界围绕数据流划分，pipeline 只负责编排</text>
  <text x="54" y="88" class="subtitle">每个模块只承担一种变化：文件格式、切块算法、模型服务、向量存储或命令入口。</text>

  <rect x="42" y="122" width="1196" height="112" rx="20" fill="#fff" opacity=".94"/>
  <text x="66" y="154" class="lane">入口与配置层</text>
  <rect x="90" y="172" width="270" height="44" rx="12" fill="#e8f1fb" filter="url(#shadow)"/><text x="116" y="200" class="code">cli.py</text><text x="194" y="200" class="body">ingest · ask · eval</text>
  <rect x="470" y="172" width="340" height="44" rx="12" fill="#e8f1fb" filter="url(#shadow)"/><text x="496" y="200" class="code">config.py</text><text x="598" y="200" class="body">YAML、路径、参数校验</text>
  <rect x="920" y="172" width="250" height="44" rx="12" fill="#fff1dc" filter="url(#shadow)"/><text x="946" y="200" class="code">.env</text><text x="1000" y="200" class="body">仅保存 API Key</text>

  <path d="M225 216 V274 H520" class="arrow"/><path d="M640 216 V274" class="arrow"/>
  <rect x="42" y="270" width="1196" height="116" rx="20" fill="#fff" opacity=".94"/>
  <text x="66" y="302" class="lane">流程编排层</text>
  <rect x="330" y="320" width="620" height="48" rx="13" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="350" class="code">pipeline.py</text><text x="478" y="350" class="body">ingest() 串起建库 · ask() 串起检索、生成、引用与 runs</text>

  <path d="M640 368 V432" class="arrow"/>
  <rect x="42" y="428" width="1196" height="178" rx="20" fill="#fff" opacity=".94"/>
  <text x="66" y="460" class="lane">算法与外部能力层</text>
  <rect x="70" y="494" width="214" height="82" rx="14" fill="#e8f1fb" filter="url(#shadow)"/><text x="94" y="524" class="code">loaders.py</text><text x="94" y="550" class="body">格式读取与正文清洗</text><text x="94" y="570" class="small">输出 SourceDocument</text>
  <rect x="304" y="494" width="214" height="82" rx="14" fill="#e8f1fb" filter="url(#shadow)"/><text x="328" y="524" class="code">chunking.py</text><text x="328" y="550" class="body">章节、长度与 overlap</text><text x="328" y="570" class="small">输出 Chunk</text>
  <rect x="538" y="494" width="214" height="82" rx="14" fill="#f0eafb" filter="url(#shadow)"/><text x="562" y="524" class="code">embedding.py</text><text x="562" y="550" class="body">Embedding / LLM 客户端</text><text x="562" y="570" class="small">批量与指数退避</text>
  <rect x="772" y="494" width="214" height="82" rx="14" fill="#e8f1fb" filter="url(#shadow)"/><text x="796" y="524" class="code">store.py</text><text x="796" y="550" class="body">FAISS 建库、检索、持久化</text><text x="796" y="570" class="small">输出 SearchHit</text>
  <rect x="1006" y="494" width="202" height="82" rx="14" fill="#dff3e8" filter="url(#shadow)"/><text x="1030" y="524" class="code">models.py</text><text x="1030" y="550" class="body">跨模块数据对象</text><text x="1030" y="570" class="small">统一字段与序列化</text>

  <rect x="42" y="638" width="1196" height="46" rx="12" fill="#e8eef6"/>
  <text x="68" y="667" class="body">可替换点：pipeline 依赖 Embedder / Generator Protocol，测试可注入 Fake 实现，无需网络和真实模型。</text>
</svg>
