<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">主 Agent 运行前预处理总览</title>
  <desc id="desc">从任务选择、上下文规范化、视频摘要、DuckDB 异构数据统一查询面、全局数据巡检，到首轮上下文装配的完整流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58708f"/>
    </marker>
    <style>
      .title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}
      .subtitle{font:400 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}
      .lane{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}
      .node-title{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}
      .node-text{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}
      .badge{font:700 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#fff}
      .arrow{stroke:#58708f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="690" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" class="title">主 Agent 第一次推理之前，系统已经完成什么？</text>
  <text x="56" y="88" class="subtitle">灰色箭头表示执行顺序；蓝色区是确定性处理，紫色区是模型辅助处理，绿色区是主 Agent 的正式起点。</text>

  <rect x="42" y="126" width="1196" height="154" rx="20" fill="#fff" opacity=".88"/>
  <text x="64" y="157" class="lane">运行层</text>
  <rect x="160" y="152" width="230" height="92" rx="16" fill="#e6effb" filter="url(#shadow)"/>
  <circle cx="184" cy="176" r="14" fill="#356aa0"/><text x="180" y="181" class="badge">1</text>
  <text x="210" y="181" class="node-title">任务选择</text>
  <text x="184" y="209" class="node-text">task_ids · skip_completed · limit</text>
  <text x="184" y="230" class="node-text">建立任务输出目录</text>

  <path d="M390 198 H452" class="arrow"/>
  <rect x="454" y="152" width="270" height="92" rx="16" fill="#e6effb" filter="url(#shadow)"/>
  <circle cx="478" cy="176" r="14" fill="#356aa0"/><text x="474" y="181" class="badge">2</text>
  <text x="504" y="181" class="node-title">上下文规范化</text>
  <text x="478" y="209" class="node-text">普通文件登记 · PDF 转 Markdown</text>
  <text x="478" y="230" class="node-text">构造统一 ContextView</text>

  <path d="M724 198 H786" class="arrow"/>
  <rect x="788" y="152" width="280" height="92" rx="16" fill="#f0eafb" filter="url(#shadow)"/>
  <circle cx="812" cy="176" r="14" fill="#7655a6"/><text x="808" y="181" class="badge">3</text>
  <text x="838" y="181" class="node-title">视频材料压缩（按需）</text>
  <text x="812" y="209" class="node-text">时间线 · 稳定帧 · ASR</text>
  <text x="812" y="230" class="node-text">视频理解导航摘要</text>

  <rect x="42" y="304" width="1196" height="154" rx="20" fill="#fff" opacity=".88"/>
  <text x="64" y="335" class="lane">Agent 图内</text>
  <rect x="160" y="330" width="230" height="92" rx="16" fill="#e6effb" filter="url(#shadow)"/>
  <circle cx="184" cy="354" r="14" fill="#356aa0"/><text x="180" y="359" class="badge">4</text>
  <text x="210" y="359" class="node-title">初始化运行状态</text>
  <text x="184" y="387" class="node-text">系统提示词 · 计数器 · 空状态</text>
  <text x="184" y="408" class="node-text">开始时间与追踪容器</text>

  <path d="M390 376 H452" class="arrow"/>
  <rect x="454" y="330" width="270" height="92" rx="16" fill="#e8f1fb" filter="url(#shadow)"/>
  <circle cx="478" cy="354" r="14" fill="#356aa0"/><text x="474" y="359" class="badge">5</text>
  <text x="504" y="359" class="node-title">统一查询与全局巡检</text>
  <text x="478" y="387" class="node-text">DuckDB 逻辑表 · 类型校准</text>
  <text x="478" y="408" class="node-text">Semantic Catalog · 查询表面</text>

  <path d="M724 376 H786" class="arrow"/>
  <rect x="788" y="330" width="280" height="92" rx="16" fill="#f0eafb" filter="url(#shadow)"/>
  <circle cx="812" cy="354" r="14" fill="#7655a6"/><text x="808" y="359" class="badge">6</text>
  <text x="838" y="359" class="node-title">首轮上下文装配</text>
  <text x="812" y="387" class="node-text">问题 + 轻量目录 + 视频摘要</text>
  <text x="812" y="408" class="node-text">形成首个 HumanMessage</text>

  <path d="M928 422 V498" class="arrow"/>
  <rect x="788" y="506" width="280" height="102" rx="18" fill="#dff3e8" stroke="#4b936d" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="812" cy="534" r="14" fill="#40845f"/><text x="808" y="539" class="badge">7</text>
  <text x="838" y="539" class="node-title">model_step</text>
  <text x="812" y="568" class="node-text">主 Agent 第一次调用模型</text>
  <text x="812" y="590" class="node-text">从这里才开始实际求解任务</text>

  <path d="M160 557 H730" stroke="#9fb0c5" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="160" y="542" class="subtitle">预处理边界</text>
  <text x="160" y="580" class="node-text">边界左侧/上方产生的材料均可在运行日志和任务输出目录中复查。</text>
  <text x="56" y="656" class="subtitle">说明：视频分支只在任务上下文包含受支持视频时触发；其内部算法见独立的视频理解文档。</text>
</svg>
