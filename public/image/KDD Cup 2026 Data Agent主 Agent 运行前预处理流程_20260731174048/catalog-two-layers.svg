<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Catalog 的两层产物</title>
  <desc id="desc">全量目录保存字段、关系与视图证据，轻量目录只保留主 Agent 首轮决策所需的查询入口、文档、媒体和知识摘要。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60758e"/>
    </marker>
    <style>
      .h1{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}
      .h2{font:700 19px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}
      .body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}
      .code{font:500 14px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}
      .label{font:700 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#fff}
      .arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="660" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="h1">一次全局扫描，形成“详细索引 + 首轮地图”两层产物</text>
  <text x="52" y="88" class="body">详细信息留在工具可查询的目录中；主 Agent 首轮只接收压缩后的地图，避免把所有字段样本一次性塞入上下文。</text>

  <rect x="52" y="132" width="260" height="410" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="80" y="171" class="h2">ContextView</text>
  <text x="80" y="207" class="body">结构化数据</text>
  <text x="80" y="235" class="body">文档与知识文本</text>
  <text x="80" y="263" class="body">图片与视频派生材料</text>
  <text x="80" y="291" class="body">统一可见路径</text>
  <rect x="80" y="330" width="204" height="136" rx="14" fill="#edf3fa"/>
  <text x="100" y="361" class="code">iter_context_file_assets</text>
  <text x="100" y="391" class="body">逐资产识别类型</text>
  <text x="100" y="419" class="body">在采样预算内读取</text>
  <text x="100" y="447" class="body">记录扫描不确定项</text>

  <path d="M312 337 H402" class="arrow"/>

  <rect x="404" y="112" width="384" height="450" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="137" width="112" height="28" rx="14" fill="#356aa0"/>
  <text x="450" y="157" class="label">完整目录</text>
  <text x="430" y="197" class="h2">Semantic Catalog</text>
  <text x="430" y="235" class="code">assets</text><text x="570" y="235" class="body">文件类型、大小、推荐工具</text>
  <text x="430" y="269" class="code">schemas</text><text x="570" y="269" class="body">表、字段、类型与样例画像</text>
  <text x="430" y="303" class="code">relationships</text><text x="570" y="303" class="body">候选关联与证据</text>
  <text x="430" y="337" class="code">derived_views</text><text x="570" y="337" class="body">通过校验的查询视图</text>
  <text x="430" y="371" class="code">query_relevance</text><text x="570" y="371" class="body">问题与资产相关度</text>
  <text x="430" y="405" class="code">uncertainties</text><text x="570" y="405" class="body">未成功扫描的风险提示</text>
  <rect x="430" y="455" width="330" height="70" rx="12" fill="#fff" opacity=".9"/>
  <text x="452" y="483" class="body">保存到运行状态与任务产物</text>
  <text x="452" y="507" class="code">semantic_catalog.json</text>

  <path d="M788 337 H878" class="arrow"/>
  <text x="811" y="319" class="body">投影压缩</text>

  <rect x="880" y="132" width="348" height="410" rx="20" fill="#f1eafb" stroke="#a98ac8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="906" y="157" width="112" height="28" rx="14" fill="#7655a6"/>
  <text x="926" y="177" class="label">首轮地图</text>
  <text x="906" y="217" class="h2">Lightweight Catalog</text>
  <text x="906" y="259" class="code">query_surfaces</text>
  <text x="930" y="284" class="body">建议优先查询的原表或派生视图</text>
  <text x="906" y="320" class="code">documents</text>
  <text x="930" y="345" class="body">文档路径、标题结构、推荐工具</text>
  <text x="906" y="381" class="code">media</text>
  <text x="930" y="406" class="body">图片等媒体资产路径</text>
  <text x="906" y="442" class="code">knowledge_documents</text>
  <text x="930" y="467" class="body">knowledge.md 的限量文本</text>
  <text x="906" y="511" class="body">注入主 Agent 的首个用户消息</text>

  <rect x="52" y="592" width="1176" height="38" rx="12" fill="#e8eef6"/>
  <text x="77" y="617" class="body">主 Agent 先用轻量地图选入口，需要字段值域、关系证据或完整画像时，再通过工具访问完整目录。</text>
</svg>
