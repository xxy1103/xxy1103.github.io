<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img" aria-labelledby="title desc"><title id="title">从第一天保存到第二天继续</title><desc id="desc">从上到下按时间展示客户端与 Agent 和 PowerContext 服务端的交互：保存约定，积累成果，提交交接，新会话请求与接收背景，再继续工作并提交新材料。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.day{font-size:18px;font-weight:700;fill:#386494}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1280" height="1070" fill="#f8fafc"/><text x="40" y="48" class="title">从第一天保存，到第二天继续</text><text x="40" y="82" class="body">沿同一个项目 Scope，先积累工作背景，再把相关内容带回新会话。</text><text x="158" y="132" class="head">Agent 与客户端</text><text x="792" y="132" class="head">PowerContext 服务端</text><rect x="30" y="155" width="1220" height="410" rx="20" fill="#eff6ff"/><rect x="30" y="630" width="1220" height="350" rx="20" fill="#edf8f2"/><text x="50" y="190" class="day">第一天</text><text x="50" y="664" class="day">第二天</text><path d="M110 214 V536 M110 688 V950" stroke="#c0ccdb" stroke-width="2"/><circle cx="110" cy="254" r="17" fill="#ffffff" stroke="#b5c7da"/><text x="105" y="260" class="small">1</text><rect x="150" y="210" width="420" height="88" rx="14" fill="#ffffff" stroke="#bfd5ee"/><text x="170" y="243" class="head">确定项目约定</text><text x="170" y="274" class="small">金额使用整数分；提交材料或显式保存。</text><rect x="770" y="210" width="450" height="88" rx="14" fill="#ffffff" stroke="#b6d6c5"/><text x="790" y="243" class="head">接收并保存</text><text x="790" y="274" class="small">保存 Source，或提交明确的制品。</text><path d="M570 250 H770" class="arrow"/><text x="592" y="237" class="small">提交</text><circle cx="110" cy="384" r="17" fill="#ffffff" stroke="#b5c7da"/><text x="105" y="390" class="small">2</text><rect x="150" y="340" width="420" height="88" rx="14" fill="#ffffff" stroke="#bfd5ee"/><text x="170" y="373" class="head">推进开发工作</text><text x="170" y="404" class="small">完成 CSV 解析，提交支持采集的记录。</text><rect x="770" y="340" width="450" height="88" rx="14" fill="#ffffff" stroke="#b6d6c5"/><text x="790" y="373" class="head">按配置整理材料</text><text x="790" y="404" class="small">Runtime 组织处理，形成可复用成果。</text><path d="M570 380 H770" class="arrow"/><text x="592" y="367" class="small">提交</text><circle cx="110" cy="514" r="17" fill="#ffffff" stroke="#b5c7da"/><text x="105" y="520" class="small">3</text><rect x="150" y="470" width="420" height="88" rx="14" fill="#ffffff" stroke="#bfd5ee"/><text x="170" y="503" class="head">留下交接信息</text><text x="170" y="534" class="small">说明当前进度与下一步，发起交接。</text><rect x="770" y="470" width="450" height="88" rx="14" fill="#ffffff" stroke="#b6d6c5"/><text x="790" y="503" class="head">准备并提交 Handoff</text><text x="790" y="534" class="small">需要持久保存时，提交为正式版本。</text><path d="M570 510 H770" class="arrow"/><text x="592" y="497" class="small">交接</text><circle cx="110" cy="724" r="17" fill="#ffffff" stroke="#b5c7da"/><text x="105" y="730" class="small">4</text><rect x="150" y="680" width="420" height="88" rx="14" fill="#ffffff" stroke="#bfd5ee"/><text x="170" y="713" class="head">新会话请求项目背景</text><text x="170" y="744" class="small">沿用同一 Scope，提出“继续金额校验”。</text><rect x="770" y="680" width="450" height="88" rx="14" fill="#ffffff" stroke="#b6d6c5"/><text x="790" y="713" class="head">提供相关背景</text><text x="790" y="744" class="small">准备上下文，或按交接流程返回内容。</text><path d="M570 720 H770" class="arrow"/><text x="592" y="707" class="small">请求</text><path d="M770 805 H570" class="arrow"/><text x="592" y="792" class="small">返回</text><text x="170" y="809" class="small">客户端把相关内容提供给 Agent。</text><circle cx="110" cy="914" r="17" fill="#ffffff" stroke="#b5c7da"/><text x="105" y="920" class="small">5</text><rect x="150" y="870" width="420" height="88" rx="14" fill="#ffffff" stroke="#bfd5ee"/><text x="170" y="903" class="head">继续工作，并产生新材料</text><text x="170" y="934" class="small">结合当前代码执行任务，再提交工作记录。</text><rect x="770" y="870" width="450" height="88" rx="14" fill="#ffffff" stroke="#b6d6c5"/><text x="790" y="903" class="head">继续积累上下文</text><text x="790" y="934" class="small">保存新材料，供后续处理和使用。</text><path d="M570 910 H770" class="arrow"/><text x="592" y="897" class="small">提交</text><path d="M56 598 H1224" stroke="#c0ccdb" stroke-width="1.5" stroke-dasharray="7 6"/><rect x="390" y="578" width="500" height="40" rx="20" fill="#f8fafc"/><text x="423" y="604" class="small">会话结束 · 数据保留在服务端的项目范围内</text><text x="42" y="1025" class="small">时间从上向下推进；采集、处理和交接按实际配置与操作发生，不要求每轮对话都执行全部步骤。</text></svg>