<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Source：先留住材料，再按用途整理</title><desc id="desc">客户端提交工作材料，服务端在 Scope 中保存 Source。材料经过配置的处理流程，才可能形成 Artifact。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52627a}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="560" fill="#f8fafc"/>
<text x="40" y="48" class="title">Source：先留住材料，再按用途整理</text>
<text x="40" y="80" class="body">原始记录提供依据；可复用成果由后续流程形成。</text>
<rect x="355" y="110" width="725" height="320" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="378" y="145" class="head">订单系统 Scope</text>
<rect x="40" y="175" width="240" height="215" rx="16" fill="#ffffff" stroke="#d6dfeb"/>
<text x="62" y="214" class="head">工作材料</text>
<text x="62" y="257" class="body">用户输入</text>
<text x="62" y="290" class="body">任务结果记录</text>
<text x="62" y="323" class="body">文档中的相关文字</text>
<text x="62" y="365" class="small">由客户端采集并提交</text>
<rect x="378" y="175" width="270" height="215" rx="16" fill="#ffffff" stroke="#93c5fd"/>
<text x="400" y="214" class="head">Source · 原始依据</text>
<text x="400" y="257" class="body">“金额使用整数分。</text>
<text x="400" y="289" class="body">CSV 解析已完成，</text>
<text x="400" y="321" class="body">金额校验明天继续。”</text>
<text x="400" y="365" class="small">此例为采集下来的文本</text>
<path d="M280 280 H378" class="line"/><text x="293" y="261" class="small">接收保存</text>
<rect x="775" y="175" width="282" height="215" rx="16" fill="#edf8f2" stroke="#86c9a4"/>
<text x="797" y="214" class="head">Artifact · 可复用成果</text>
<text x="797" y="257" class="body">项目约定</text>
<text x="797" y="286" class="small">金额使用整数分</text>
<text x="797" y="326" class="body">交接内容</text>
<text x="797" y="355" class="small">解析已完成，金额校验待实现</text>
<path d="M648 280 H775" class="line"/><text x="681" y="240" class="small">按配置</text><text x="673" y="264" class="small">处理与提交</text>
<rect x="40" y="455" width="1040" height="77" rx="14" fill="#ffffff" stroke="#d6dfeb"/>
<text x="62" y="486" class="body">提交时指定 Scope，并提供材料标识、正文和可选的附加信息。</text>
<text x="62" y="513" class="small">保存 Source 不等于已经生成 Artifact；一份材料可以有多种后续用途。</text>
</svg>
