<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">会话换了，工作可以继续</title><desc id="desc">以订单开发为例：保存有用背景，再按后续任务取回。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#627087}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1120" height="420" fill="#f8fafc"/><text x="40" y="49" class="title">会话换了，工作可以继续</text><text x="40" y="79" class="sub">以订单开发为例：保存有用背景，再按后续任务取回。</text><rect x="40" y="118" width="300" height="178" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="153" class="head">第一天 · 会话 A</text><text x="62" y="186" class="body">确认：金额使用整数分</text><text x="62" y="214" class="body">完成：CSV 解析</text><text x="62" y="242" class="body">待办：金额校验</text><rect x="410" y="118" width="300" height="178" rx="16" fill="#edf8f2" stroke="#d6dfeb" stroke-width="1.5"/><text x="432" y="153" class="head">PowerContext</text><text x="432" y="186" class="body">在项目 Scope 中保存</text><text x="432" y="214" class="body">整理约定与工作进度</text><text x="432" y="242" class="body">会话结束后仍可保留</text><rect x="780" y="118" width="300" height="178" rx="16" fill="#f2edfc" stroke="#d6dfeb" stroke-width="1.5"/><text x="802" y="153" class="head">第二天 · 会话 B</text><text x="802" y="186" class="body">提出：继续金额校验</text><text x="802" y="214" class="body">取回：相关约定与进度</text><text x="802" y="242" class="body">结合当前代码继续工作</text><path d="M340 205 H410" class="line"/><text x="355" y="187" class="small">提交</text><path d="M710 205 H780" class="line"/><text x="725" y="187" class="small">取回</text><rect x="40" y="326" width="1040" height="64" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="63" y="365" class="body">连接两个会话的是同一个工作范围，以及已保存、可供后续使用的信息。</text></svg>