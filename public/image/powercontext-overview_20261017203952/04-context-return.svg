<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">从项目档案到本次任务的资料包</title><desc id="desc">长期保存与本次使用分开：只选择适合当前请求的内容。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#627087}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1120" height="600" fill="#f8fafc"/><text x="40" y="49" class="title">从项目档案到本次任务的资料包</text><text x="40" y="79" class="sub">长期保存与本次使用分开：只选择适合当前请求的内容。</text><rect x="40" y="125" width="260" height="150" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="160" class="head">任务与 Scope</text><text x="62" y="193" class="body">“继续实现金额校验”</text><text x="62" y="221" class="body">选择订单系统范围</text><text x="62" y="249" class="body">客户端发起请求</text><rect x="385" y="125" width="330" height="150" rx="16" fill="#edf8f2" stroke="#d6dfeb" stroke-width="1.5"/><text x="407" y="160" class="head">服务端检索与组装</text><text x="407" y="193" class="body">检索当前可用内容</text><text x="407" y="221" class="body">按规则选择相关材料</text><text x="407" y="249" class="body">控制本次输出大小</text><rect x="800" y="125" width="280" height="150" rx="16" fill="#f2edfc" stroke="#d6dfeb" stroke-width="1.5"/><text x="822" y="160" class="head">PreparedContext</text><text x="822" y="193" class="body">本次请求的临时资料包</text><text x="822" y="221" class="body">相关正文 + 引用</text><text x="822" y="249" class="body">无合适内容时可为空</text><path d="M300 200 H385" class="line"/><path d="M715 200 H800" class="line"/><rect x="385" y="350" width="330" height="120" rx="16" fill="#fff6e5" stroke="#d6dfeb" stroke-width="1.5"/><text x="407" y="385" class="head">已保存的成果</text><text x="407" y="418" class="body">Memory、Experience 等</text><text x="407" y="446" class="body">按各自规则参与上下文准备</text><path d="M550 350 V275" class="line"/><text x="566" y="318" class="small">读取</text><rect x="800" y="350" width="280" height="120" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="822" y="385" class="head">客户端 → Agent</text><text x="822" y="418" class="body">提供历史背景</text><text x="822" y="446" class="body">结合当前要求与现场信息</text><path d="M940 275 V350" class="line"/><text x="956" y="318" class="small">返回并接入</text><rect x="40" y="505" width="1040" height="65" rx="16" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.5"/><text x="62" y="545" class="body">Handoff 通过交接流程使用；Skill 可导出到宿主。各类成果有各自的消费方式。</text></svg>