<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">信息进入系统的两条路径</title><desc id="desc">可以先保存材料再处理，也可以直接提交明确的成果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#627087}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1120" height="590" fill="#f8fafc"/><text x="40" y="49" class="title">信息进入系统的两条路径</text><text x="40" y="79" class="sub">可以先保存材料再处理，也可以直接提交明确的成果。</text><rect x="40" y="110" width="1040" height="450" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="65" y="146" class="head">订单系统 Scope · 内容归属与访问范围</text><rect x="65" y="180" width="260" height="120" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="87" y="215" class="head">采集原始材料</text><text x="87" y="248" class="body">对话、任务结果</text><text x="87" y="276" class="body">或外部材料引用</text><rect x="420" y="180" width="260" height="120" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="442" y="215" class="head">Source</text><text x="442" y="248" class="body">保存证据</text><text x="442" y="276" class="body">供读取、处理和追溯</text><path d="M325 240 H420" class="line"/><text x="333" y="222" class="small">提交并保存</text><rect x="770" y="180" width="280" height="310" rx="16" fill="#edf8f2" stroke="#d6dfeb" stroke-width="1.5"/><text x="792" y="215" class="head">Artifact</text><text x="792" y="248" class="body">可复用的成果</text><text x="792" y="276" class="body"></text><text x="792" y="304" class="body">Memory：项目约定</text><text x="792" y="332" class="body">Handoff：任务交接</text><text x="792" y="360" class="body">Experience：经验</text><text x="792" y="388" class="body">Skill：操作方法</text><path d="M680 240 H770" class="line"/><text x="702" y="221" class="small">处理</text><text x="422" y="333" class="small">按配置触发；按需调用模型</text><text x="422" y="359" class="small">需要审核的提案先经过审核</text><rect x="65" y="390" width="260" height="120" rx="16" fill="#fff6e5" stroke="#d6dfeb" stroke-width="1.5"/><text x="87" y="425" class="head">显式提交成果</text><text x="87" y="458" class="body">已明确要保存的内容</text><text x="87" y="486" class="body">调用对应类型接口</text><path d="M325 450 H770" class="line"/><text x="365" y="429" class="small">内容校验后提交 · 仅限支持显式创建的类型</text><text x="65" y="537" class="small">Source 入库、成果生成和审核通过，是不同的处理状态。</text></svg>