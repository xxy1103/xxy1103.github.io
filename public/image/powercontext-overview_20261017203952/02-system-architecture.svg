<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">谁采集，谁处理，谁保存？</title><desc id="desc">客户端连接 Agent 与服务端；服务端组织上下文管理，并使用外部能力。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#627087}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52627a}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1120" height="580" fill="#f8fafc"/><text x="40" y="49" class="title">谁采集，谁处理，谁保存？</text><text x="40" y="79" class="sub">客户端连接 Agent 与服务端；服务端组织上下文管理，并使用外部能力。</text><rect x="40" y="115" width="300" height="380" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="62" y="149" class="head">Agent 所在的一侧</text><rect x="62" y="173" width="256" height="110" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="84" y="208" class="head">Agent</text><text x="84" y="241" class="body">理解任务、执行工作</text><rect x="62" y="350" width="256" height="110" rx="16" fill="#eaf3ff" stroke="#d6dfeb" stroke-width="1.5"/><text x="84" y="385" class="head">客户端 / 插件</text><text x="84" y="418" class="body">采集、提交、取回</text><path d="M165 283 V350" class="line"/><path d="M210 350 V283" class="line"/><rect x="440" y="300" width="300" height="190" rx="16" fill="#edf8f2" stroke="#d6dfeb" stroke-width="1.5"/><text x="462" y="335" class="head">PowerContext 服务端</text><text x="462" y="368" class="body">接收与管理上下文</text><text x="462" y="396" class="body">Runtime 组织处理与召回</text><text x="462" y="424" class="body">按规则准备返回内容</text><path d="M318 386 H440" class="line"/><text x="355" y="373" class="small">请求</text><path d="M440 433 H318" class="line"/><text x="355" y="456" class="small">返回</text><text x="349" y="324" class="small">HTTP / MCP</text><rect x="820" y="130" width="260" height="130" rx="16" fill="#fff6e5" stroke="#d6dfeb" stroke-width="1.5"/><text x="842" y="165" class="head">模型服务</text><text x="842" y="198" class="body">提炼 / 总结</text><text x="842" y="226" class="body">Embedding</text><rect x="820" y="365" width="260" height="130" rx="16" fill="#f2edfc" stroke="#d6dfeb" stroke-width="1.5"/><text x="842" y="400" class="head">数据库</text><text x="842" y="433" class="body">材料 / 制品 / 版本</text><text x="842" y="461" class="body">索引 / 处理状态</text><path d="M675 300 V195 H820" class="line"/><text x="691" y="181" class="small">按需调用</text><path d="M740 405 H820" class="line"/><path d="M820 455 H740" class="line"/><text x="42" y="548" class="small">图中表示职责分工；客户端、服务端和数据库可以部署在同一台机器上。</text></svg>