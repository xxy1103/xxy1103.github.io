<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720" role="img" aria-labelledby="title desc">
<title id="title">Source 经 Runtime 组织处理，形成不同用途的 Artifact</title>
<desc id="desc">左侧是 Source 材料，中间 Runtime 按配置组织对应处理流程，右侧是不同类型的成果。Experience 和 Skill 的生成提案经过 Candidate 审核；Handoff 由交接流程准备并提交。图中分支表示可用路径，不表示每份材料都会生成所有类型。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#23334d}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52627a}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.bus{fill:none;stroke:#64748b;stroke-width:2}</style>
<rect width="1360" height="720" fill="#f8fafc"/>
<text x="40" y="48" class="title">同一批材料，可以服务于不同用途</text>
<text x="40" y="82" class="body">Runtime 组织对应的处理流程，成果按各自规则形成并提交。</text>
<text x="40" y="145" class="small">输入 · 已采集材料</text>
<text x="440" y="145" class="small">组织 · 按配置与触发条件处理</text>
<text x="930" y="145" class="small">输出 · 不同类型的 Artifact</text>

<rect x="40" y="245" width="270" height="245" rx="18" fill="#eaf3ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="65" y="288" class="head">Source</text>
<text x="65" y="329" class="body">用户输入</text>
<text x="65" y="365" class="body">任务结果与测试记录</text>
<text x="65" y="401" class="body">从文档取得的文字</text>
<text x="65" y="457" class="small">保留原始依据</text>

<path d="M310 367 H440" class="line"/>
<text x="330" y="343" class="small">作为依据</text>
<rect x="440" y="220" width="330" height="295" rx="18" fill="#fff6e5" stroke="#e6c683" stroke-width="1.5"/>
<text x="465" y="263" class="head">Runtime</text>
<text x="465" y="307" class="body">选择符合条件的材料</text>
<text x="465" y="345" class="body">组织对应类型的处理流程</text>
<text x="465" y="383" class="body">按需调用模型，校验结果</text>
<text x="465" y="421" class="body">需要时进入审核流程</text>
<text x="465" y="478" class="small">按类型规则提交正式 Revision</text>

<path d="M770 367 H850 M850 205 V585" class="bus"/>
<path d="M850 205 H930" class="line"/><path d="M850 281 H930" class="line"/><path d="M850 357 H930" class="line"/><path d="M850 433 H930" class="line"/><path d="M850 509 H930" class="line"/><path d="M850 585 H930" class="line"/>

<rect x="930" y="172" width="390" height="66" rx="12" fill="#edf8f2" stroke="#acd9bf"/>
<text x="951" y="198" class="head">Memory</text><text x="951" y="223" class="small">事实、决定与约束</text>
<rect x="930" y="248" width="390" height="66" rx="12" fill="#edf8f2" stroke="#acd9bf"/>
<text x="951" y="274" class="head">Topic Memory</text><text x="951" y="299" class="small">按主题持续整理的摘要</text>
<rect x="930" y="324" width="390" height="66" rx="12" fill="#edf8f2" stroke="#acd9bf"/>
<text x="951" y="350" class="head">Experience</text><text x="951" y="375" class="small">可复用经验 · 生成提案经 Candidate 审核</text>
<rect x="930" y="400" width="390" height="66" rx="12" fill="#edf8f2" stroke="#acd9bf"/>
<text x="951" y="426" class="head">Skill</text><text x="951" y="451" class="small">操作方法 · 生成提案经 Candidate 审核</text>
<rect x="930" y="476" width="390" height="66" rx="12" fill="#edf8f2" stroke="#acd9bf"/>
<text x="951" y="502" class="head">Profile</text><text x="951" y="527" class="small">稳定背景 · 按策略提交或审核</text>
<rect x="930" y="552" width="390" height="66" rx="12" fill="#f2edfc" stroke="#c4aceb"/>
<text x="951" y="578" class="head">Handoff</text><text x="951" y="603" class="small">任务交接 · 交接流程准备，提交后持久保存</text>

<rect x="40" y="644" width="1280" height="48" rx="12" fill="#ffffff" stroke="#d6dfeb"/>
<text x="62" y="674" class="small">分支表示不同的形成路径；实际处理取决于配置、触发条件与材料，并非每份 Source 都生成所有类型。</text>
</svg>
