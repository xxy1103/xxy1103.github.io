<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">运行轨迹、证据包与校验请求的关系</title>
  <desc id="desc">完整运行轨迹经过筛选形成证据包；证据包、原始问题、候选答案、知识材料和近期轨迹压缩共同组装为校验请求，再发送给过程校验模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#26405f" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#52677f"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3b9b68"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#bd7b2d"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 32px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; fill: #5b6d80; }
      .card-title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 25px; font-weight: 700; fill: #204d73; }
      .card-body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 17px; fill: #4d6579; }
      .small { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; fill: #52677f; }
      .code { font-family: Consolas, "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">三个对象各司其职，共同构成一次可审计的过程校验</text>
  <text x="70" y="110" class="subtitle">运行轨迹保存事实，证据包筛选可引用材料，校验请求把所有必要上下文交给过程校验模型。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="315" height="350" rx="25" fill="#ffffff" stroke="#7fa9d3" stroke-width="3"/>
    <text x="227" y="235" text-anchor="middle" class="card-title">① 完整运行轨迹</text>
    <text x="227" y="271" text-anchor="middle" class="code" fill="#365d78">steps</text>
    <rect x="100" y="301" width="255" height="58" rx="14" fill="#edf4fb"/>
    <text x="127" y="337" class="card-body">模型步骤：计划与判断</text>
    <rect x="100" y="374" width="255" height="58" rx="14" fill="#edf4fb"/>
    <text x="127" y="410" class="card-body">工具步骤：请求与结果</text>
    <rect x="100" y="447" width="255" height="54" rx="14" fill="#f5f7fa"/>
    <text x="227" y="480" text-anchor="middle" class="small">包含成功、失败、截断和重复</text>

    <rect x="505" y="155" width="370" height="400" rx="28" fill="#fffdf8" stroke="#c99a39" stroke-width="3"/>
    <text x="690" y="214" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#735619">② 证据包</text>
    <text x="690" y="248" text-anchor="middle" class="small">从完整工具轨迹中筛选出的临时 JSON</text>
    <rect x="540" y="280" width="300" height="105" rx="18" fill="#eaf9f1" stroke="#3b996b" stroke-width="2"/>
    <text x="690" y="324" text-anchor="middle" class="code" fill="#286f4d">evidence_items</text>
    <text x="690" y="357" text-anchor="middle" class="small" fill="#46725b">成功、完整、未超预算的可用证据</text>
    <rect x="540" y="414" width="300" height="105" rx="18" fill="#fff1e8" stroke="#c47a2c" stroke-width="2"/>
    <text x="690" y="458" text-anchor="middle" class="code" fill="#914f16">omitted_or_unusable</text>
    <text x="690" y="491" text-anchor="middle" class="small" fill="#8b6b4e">失败、截断或超预算的排除项</text>

    <rect x="1010" y="180" width="300" height="350" rx="25" fill="#eef0ff" stroke="#706fd3" stroke-width="3"/>
    <text x="1160" y="235" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#3e3c89">③ 校验请求</text>
    <text x="1160" y="271" text-anchor="middle" class="small" fill="#55558a">发送给模型的完整上下文</text>
    <rect x="1040" y="301" width="240" height="48" rx="12" fill="#ffffff" opacity=".9"/>
    <text x="1160" y="332" text-anchor="middle" class="card-body" fill="#55558a">问题、候选答案、提交来源</text>
    <rect x="1040" y="364" width="240" height="48" rx="12" fill="#ffffff" opacity=".9"/>
    <text x="1160" y="395" text-anchor="middle" class="card-body" fill="#55558a">证据包与近期轨迹压缩</text>
    <rect x="1040" y="427" width="240" height="48" rx="12" fill="#ffffff" opacity=".9"/>
    <text x="1160" y="458" text-anchor="middle" class="card-body" fill="#55558a">知识文档、视频与语义账本</text>

    <rect x="1030" y="700" width="260" height="105" rx="24" fill="#ecfbf2" stroke="#46a66b" stroke-width="3"/>
    <text x="1160" y="744" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#257247">过程校验模型</text>
    <text x="1160" y="779" text-anchor="middle" class="small" fill="#48715a">审计语义与证据链</text>
  </g>

  <path d="M385 355 H505" fill="none" stroke="#52677f" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="445" y="335" text-anchor="middle" class="label" fill="#52677f">筛选</text>
  <path d="M875 355 H1010" fill="none" stroke="#52677f" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="943" y="335" text-anchor="middle" class="label" fill="#52677f">嵌入</text>

  <g filter="url(#shadow)">
    <rect x="70" y="640" width="220" height="78" rx="18" fill="#ffffff" stroke="#7fa9d3" stroke-width="2"/>
    <text x="180" y="688" text-anchor="middle" class="card-body">原始问题</text>
    <rect x="320" y="640" width="220" height="78" rx="18" fill="#ffffff" stroke="#7fa9d3" stroke-width="2"/>
    <text x="430" y="678" text-anchor="middle" class="card-body">候选答案</text>
    <text x="430" y="704" text-anchor="middle" class="small">与提交来源</text>
    <rect x="570" y="640" width="220" height="78" rx="18" fill="#ffffff" stroke="#7fa9d3" stroke-width="2"/>
    <text x="680" y="678" text-anchor="middle" class="card-body">知识文档</text>
    <text x="680" y="704" text-anchor="middle" class="small">与视频材料</text>
    <rect x="425" y="770" width="330" height="76" rx="18" fill="#edf4fb" stroke="#7fa9d3" stroke-width="2"/>
    <text x="590" y="816" text-anchor="middle" class="card-body">近期轨迹压缩</text>
  </g>

  <path d="M180 640 V590 H1045 V530" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M430 640 V610 H1080 V530" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M680 640 V630 H1120 V530" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M385 465 C435 465 405 808 425 808" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="605" text-anchor="middle" class="label" fill="#52677f">压缩</text>
  <path d="M755 808 H930 Q960 808 960 778 V590 Q960 560 1010 560 H1160 V530" fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 530 V700" fill="none" stroke="#3b9b68" stroke-width="4" marker-end="url(#greenArrow)"/>

  <text x="70" y="875" class="small">关键边界：运行轨迹是原始材料；证据包只收录可引用的工具观察；近期轨迹只用于诊断，不是正向来源证据。</text>
</svg>
