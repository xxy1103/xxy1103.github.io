<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">并发补齐、逐表投票与安全兜底</title><desc id="desc">默认并发收集五个成功模型轮次，失败后有限补发，再对每张表独立多数投票；平票、遗漏和全失败都偏向相关。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker><style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.yes{font:700 13px "Microsoft YaHei",sans-serif;fill:#347651}.no{font:700 13px "Microsoft YaHei",sans-serif;fill:#a05858}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/><text x="52" y="58" class="title">目标不是“发 5 次请求”，而是“尽量攒够 5 个成功轮”</text><text x="52" y="88" class="body">每轮判断全部候选表；超时、请求异常或结构化解析失败的轮次不计票。</text>
  <rect x="48" y="124" width="1184" height="206" rx="20" fill="#fff" opacity=".94"/><text x="72" y="158" class="h2">阶段一 · 并发调用与有限补齐</text>
  <rect x="76" y="188" width="280" height="104" rx="15" fill="#f0eafb" filter="url(#shadow)"/><text x="98" y="218" class="h2">批次 1：并发发 5 轮</text><text x="98" y="248" class="body">3 成功 · 1 超时 · 1 解析失败</text><text x="98" y="272" class="small">成功轮进入 ok_verdicts</text><path d="M356 240 H418" class="arrow"/>
  <rect x="420" y="188" width="280" height="104" rx="15" fill="#f0eafb" filter="url(#shadow)"/><text x="442" y="218" class="h2">批次 2：补发缺少的 2 轮</text><text x="442" y="248" class="body">1 成功 · 1 失败</text><text x="442" y="272" class="small">当前累计 4 个成功轮</text><path d="M700 240 H762" class="arrow"/>
  <rect x="764" y="188" width="280" height="104" rx="15" fill="#f0eafb" filter="url(#shadow)"/><text x="786" y="218" class="h2">批次 3：再补 1 轮</text><text x="786" y="248" class="body">成功 → 累计 5 轮</text><text x="786" y="272" class="small">默认最多 vote_rounds + 2 批</text><path d="M1044 240 H1090" class="arrow"/>
  <rect x="1092" y="194" width="112" height="92" rx="15" fill="#dff3e8" stroke="#6aa281" stroke-width="2"/><text x="1113" y="226" class="h2">5 轮</text><text x="1113" y="253" class="body">成功结果</text><text x="1113" y="274" class="small">开始聚合</text>
  <rect x="48" y="354" width="1184" height="252" rx="20" fill="#fff" opacity=".94"/><text x="72" y="388" class="h2">阶段二 · 每张表独立投票，而不是对整轮统一投票</text>
  <rect x="76" y="422" width="486" height="142" rx="16" fill="#e8f1fb" filter="url(#shadow)"/><text x="100" y="452" class="h2">company_profile 的有效票</text><text x="100" y="485" class="yes">true</text><text x="155" y="485" class="yes">true</text><text x="210" y="485" class="no">false</text><text x="272" y="485" class="yes">true</text><text x="327" y="485" class="yes">true</text><text x="100" y="520" class="code">yes=4, n_j=5 → 4×2 ≥ 5</text><text x="100" y="545" class="body">最终 relevant=true · vote_tally="4/5"</text>
  <path d="M562 494 H626" class="arrow"/><rect x="628" y="412" width="548" height="162" rx="16" fill="#fff1dc" filter="url(#shadow)"/><text x="652" y="442" class="h2">召回优先的三个兜底</text><text x="652" y="477" class="body">平票：yes × 2 = n_j → 判相关</text><text x="652" y="508" class="body">所有成功轮都遗漏某表：0/0 → 默认相关</text><text x="652" y="539" class="body">所有模型轮都失败：初始 per_table=true 保持不变</text><text x="652" y="562" class="small">有部分成功轮但未攒满目标轮数时，使用现有票数</text>
  <rect x="48" y="638" width="1184" height="42" rx="12" fill="#e8eef6"/><text x="74" y="664" class="body">理由选择：从与最终布尔结论一致的 verdict 中取第一条非空 reason，不会把五轮理由重新总结。</text>
</svg>
