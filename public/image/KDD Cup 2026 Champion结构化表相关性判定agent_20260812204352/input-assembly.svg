<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Table Relevance Agent 输入装配</title><desc id="desc">question、knowledge、视频文本与所有候选表的完整列清单和两行样例，被拼成一条用户输入。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker><style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="700" rx="24" fill="#f5f8fc"/><text x="52" y="58" class="title">模型看到的是“任务依据 + 全部候选表的结构化预览”</text><text x="52" y="88" class="body">一次横向比较全部表，才能同时检查筛选字段、输出列和必经映射是否都有来源。</text>
  <rect x="48" y="126" width="320" height="482" rx="20" fill="#fff" filter="url(#shadow)"/><text x="76" y="164" class="h2">输入来源</text>
  <rect x="76" y="190" width="264" height="54" rx="12" fill="#e8f1fb"/><text x="96" y="214" class="code">task.json.question</text><text x="96" y="234" class="small">筛选、计算和输出目标</text>
  <rect x="76" y="258" width="264" height="68" rx="12" fill="#e8f1fb"/><text x="96" y="283" class="code">context/knowledge.md</text><text x="96" y="304" class="small">字段语义与业务口径 · 最多 8,000 字</text>
  <rect x="76" y="340" width="264" height="82" rx="12" fill="#f0eafb"/><text x="96" y="365" class="code">video_input.json</text><text x="96" y="387" class="body">ASR 旁白 + hiccup 版面文字</text><text x="96" y="408" class="small">无图片输入 · 最多 6,000 字</text>
  <rect x="76" y="436" width="264" height="138" rx="12" fill="#fff1dc"/><text x="96" y="461" class="code">DuckDB state.tables</text><text x="96" y="485" class="body">CSV · JSON · SQLite 物理表</text><text x="96" y="508" class="body">完整 columns:name:type</text><text x="96" y="531" class="body">前 2 行样例</text><text x="96" y="554" class="small">每个样例单元格最多 80 字符</text>
  <path d="M368 368 H430" class="arrow"/><rect x="432" y="112" width="448" height="514" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/><text x="460" y="150" class="h2">拼成一条 user_input</text>
  <rect x="460" y="176" width="392" height="412" rx="14" fill="#fff" opacity=".96"/><text x="482" y="207" class="code">## task question</text><text x="482" y="230" class="body">列出 2025 年收入达标企业的名称</text>
  <text x="482" y="272" class="code">## knowledge</text><text x="482" y="295" class="body">收入在 financials；名称在 profile</text>
  <text x="482" y="337" class="code">## 视频口径（可选）</text><text x="482" y="360" class="body">以 revenue &gt; 1,000 万为准</text>
  <text x="482" y="402" class="code">## 候选表清单（共 N 张）</text><text x="482" y="429" class="code">### 表: company_financials</text><text x="482" y="451" class="small">company_id · revenue · year + 2 行</text><text x="482" y="485" class="code">### 表: company_profile</text><text x="482" y="507" class="small">company_id · company_name + 2 行</text><text x="482" y="541" class="code">### 表: employee_attendance</text><text x="482" y="563" class="small">employee_id · date · status + 2 行</text>
  <path d="M880 368 H942" class="arrow"/><rect x="944" y="174" width="286" height="388" rx="20" fill="#f0eafb" stroke="#a98ac8" stroke-width="2" filter="url(#shadow)"/><text x="972" y="214" class="h2">一条结构化回复</text><text x="972" y="254" class="code">verdicts[N]</text><rect x="972" y="278" width="230" height="218" rx="13" fill="#fff" opacity=".94"/><text x="992" y="310" class="code">table_name</text><text x="992" y="337" class="body">canonical 精确名称</text><text x="992" y="377" class="code">reason</text><text x="992" y="404" class="body">先说明不可替代用途</text><text x="992" y="444" class="code">relevant</text><text x="992" y="471" class="body">再给 true / false</text><text x="972" y="526" class="small">目标：覆盖清单中的每张表</text>
  <rect x="48" y="642" width="1182" height="36" rx="12" fill="#e8eef6"/><text x="73" y="666" class="body">注意：_doc_extracted.db 的表不进入候选清单，而是直接进入 always_keep，始终保留详细描述。</text>
</svg>
