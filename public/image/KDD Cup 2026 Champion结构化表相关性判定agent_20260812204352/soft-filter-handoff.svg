<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">软过滤只改变 Prompt，不改变数据可访问性</title><desc id="desc">相关性结果映射为折叠键，describe_context_dir 对相关表展开描述、对无关表保留一行提示，而 DuckDB 和 solver.py 仍加载全部表。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker><style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="700" rx="24" fill="#f5f8fc"/><text x="52" y="58" class="title">一份相关性结果，分成“Prompt 展示面”和“数据查询面”</text><text x="52" y="88" class="body">collapse_keys 只传给 describe_context_dir，从未传入 DuckDB 注册、explore_data 或 solver.py。</text>
  <rect x="50" y="134" width="280" height="432" rx="20" fill="#f0eafb" filter="url(#shadow)"/><text x="78" y="174" class="h2">TableRelevanceResult</text><rect x="78" y="204" width="224" height="126" rx="13" fill="#fff"/><text x="96" y="234" class="code">financials: true</text><text x="96" y="268" class="code">profile: true</text><text x="96" y="302" class="code">attendance: false</text><text x="78" y="367" class="body">skipped_describe_keys</text><text x="78" y="397" class="code">context/db/hr.db</text><text x="78" y="420" class="code">::employee_attendance</text><text x="78" y="468" class="small">CSV / JSON 用文件路径</text><text x="78" y="490" class="small">SQLite 用路径::物理表名</text>
  <path d="M330 300 H398" class="arrow"/><rect x="400" y="118" width="370" height="486" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/><text x="428" y="158" class="h2">Solver 初始 Prompt 展示面</text><rect x="428" y="188" width="314" height="154" rx="13" fill="#fff"/><text x="448" y="218" class="code">Table: financials</text><text x="448" y="243" class="body">rows · columns · types · samples</text><text x="448" y="278" class="code">Table: profile</text><text x="448" y="303" class="body">rows · columns · types · samples</text><rect x="428" y="366" width="314" height="116" rx="13" fill="#fff1dc"/><text x="448" y="397" class="code">Table: employee_attendance</text><text x="448" y="425" class="body">schema 已折叠省 token</text><text x="448" y="451" class="small">如需可用 explore_data 查询</text><text x="428" y="535" class="body">结果：减少初始噪声</text><text x="428" y="560" class="small">但保留被折叠表的存在提示</text>
  <path d="M770 300 H838" class="arrow"/><rect x="840" y="134" width="390" height="432" rx="20" fill="#dff3e8" stroke="#5d9d77" stroke-width="2" filter="url(#shadow)"/><text x="868" y="174" class="h2">数据查询面：三张表全部保留</text><rect x="868" y="204" width="334" height="154" rx="13" fill="#fff"/><text x="890" y="235" class="code">explore_data \tables</text><text x="890" y="268" class="body">financials</text><text x="890" y="296" class="body">profile</text><text x="890" y="324" class="body">employee_attendance</text><rect x="868" y="382" width="334" height="116" rx="13" fill="#fff"/><text x="890" y="414" class="code">solver.py run_sql(...)</text><text x="890" y="447" class="body">仍可查询任意成功注册的表</text><text x="890" y="474" class="small">共享 datasource_runtime</text><text x="868" y="535" class="body">结果：数据访问权限不变</text>
  <rect x="50" y="626" width="1180" height="42" rx="12" fill="#e8eef6"/><text x="76" y="652" class="body">即使 employee_attendance 被误判为无关，Solver 仍能用 \tables、\schema 或 SQL 把它找回来。</text>
</svg>
