<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">结构化表相关性判定总览</title><desc id="desc">从任务依据和全部结构化表预览，到五轮相关性投票、折叠键生成和 Solver prompt 软过滤的完整流程。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58708f"/></marker><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.badge{font:700 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#fff}.arrow{stroke:#58708f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/><text x="54" y="58" class="title">Table Relevance Agent：压缩初始 Prompt，不裁掉真实数据</text><text x="54" y="88" class="subtitle">蓝色是确定性处理，紫色是模型判断，绿色是交给 Solver 的结果。</text>
  <rect x="42" y="120" width="1196" height="220" rx="20" fill="#fff" opacity=".92"/><text x="64" y="153" class="lane">第一段：装配任务依据与全部候选表</text>
  <rect x="72" y="188" width="224" height="108" rx="16" fill="#e6effb" filter="url(#shadow)"/><circle cx="97" cy="212" r="13" fill="#356aa0"/><text x="93" y="216" class="badge">1</text><text x="121" y="217" class="h2">读取任务依据</text><text x="97" y="246" class="body">question · knowledge</text><text x="97" y="267" class="body">视频旁白 + hiccup 文本</text><text x="97" y="287" class="small">Knowledge 8k · 视频 6k</text>
  <path d="M296 242 H348" class="arrow"/><rect x="350" y="188" width="250" height="108" rx="16" fill="#e6effb" filter="url(#shadow)"/><circle cx="375" cy="212" r="13" fill="#356aa0"/><text x="371" y="216" class="badge">2</text><text x="399" y="217" class="h2">注册结构化数据</text><text x="375" y="246" class="body">CSV · JSON · SQLite</text><text x="375" y="267" class="body">统一进入内存 DuckDB</text><text x="375" y="287" class="small">生成 canonical 表名</text>
  <path d="M600 242 H652" class="arrow"/><rect x="654" y="188" width="250" height="108" rx="16" fill="#e6effb" filter="url(#shadow)"/><circle cx="679" cy="212" r="13" fill="#356aa0"/><text x="675" y="216" class="badge">3</text><text x="703" y="217" class="h2">逐表生成预览</text><text x="679" y="246" class="body">完整列名 + DuckDB 类型</text><text x="679" y="267" class="body">前 2 行 · 每格最多 80 字</text><text x="679" y="287" class="small">_doc_extracted → always_keep</text>
  <path d="M904 242 H956" class="arrow"/><rect x="958" y="188" width="250" height="108" rx="16" fill="#f0eafb" filter="url(#shadow)"/><circle cx="983" cy="212" r="13" fill="#7655a6"/><text x="979" y="216" class="badge">4</text><text x="1007" y="217" class="h2">Agent × 5 成功轮</text><text x="983" y="246" class="body">一次横向判断全部表</text><text x="983" y="267" class="body">逐表 reason + true / false</text><text x="983" y="287" class="small">超时或失败会有限补发</text>
  <path d="M1083 296 V380" class="arrow"/><rect x="42" y="370" width="1196" height="250" rx="20" fill="#fff" opacity=".92"/><text x="64" y="403" class="lane">第二段：聚合票数，并只改变 Solver 的初始描述</text>
  <rect x="112" y="446" width="250" height="112" rx="16" fill="#f0eafb" filter="url(#shadow)"/><circle cx="137" cy="470" r="13" fill="#7655a6"/><text x="133" y="474" class="badge">5</text><text x="161" y="475" class="h2">逐表多数投票</text><text x="137" y="504" class="body">平票 → relevant=true</text><text x="137" y="525" class="body">遗漏 / 全失败 → 默认相关</text><text x="137" y="546" class="small">召回优先</text>
  <path d="M362 502 H432" class="arrow"/><rect x="434" y="446" width="250" height="112" rx="16" fill="#e6effb" filter="url(#shadow)"/><circle cx="459" cy="470" r="13" fill="#356aa0"/><text x="455" y="474" class="badge">6</text><text x="483" y="475" class="h2">生成折叠键</text><text x="459" y="504" class="body">CSV / JSON：文件路径</text><text x="459" y="525" class="body">SQLite：文件路径::表名</text><text x="459" y="546" class="small">只包含 skipped_tables</text>
  <path d="M684 502 H754" class="arrow"/><rect x="756" y="426" width="412" height="152" rx="18" fill="#dff3e8" stroke="#5d9d77" stroke-width="2" filter="url(#shadow)"/><circle cx="782" cy="452" r="13" fill="#40845f"/><text x="778" y="456" class="badge">7</text><text x="806" y="457" class="h2">describe_context_dir → Solver Prompt</text><text x="782" y="490" class="body">相关表：展开 schema、样例与行数</text><text x="782" y="515" class="body">无关表：只留一行“可用 explore_data 找回”</text><text x="782" y="540" class="body">全部表：仍注册 DuckDB，仍可写入最终 SQL</text><text x="782" y="563" class="small">软过滤不进入数据访问层</text>
  <rect x="42" y="650" width="1196" height="42" rx="12" fill="#e8eef6"/><text x="68" y="676" class="body">关键边界：false 的含义是“初始 prompt 不展开”，不是“表被删除”或“禁止 Solver 查询”。</text>
</svg>
