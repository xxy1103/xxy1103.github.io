<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TableRelevanceResult 中各表集合的关系</title>
  <desc id="desc">all_tables 按 per_table 判断分为相关和跳过两路；相关普通表与 always_keep 汇合成为 relevant_tables，无关表形成 skipped_tables 并转换为折叠键。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4d8b68"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad7a35"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.green{font:700 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#347651}.amber{font:700 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#976522}.arrowBlue{stroke:#60758e;stroke-width:2.6;fill:none;marker-end:url(#arrowBlue)}.arrowGreen{stroke:#4d8b68;stroke-width:2.8;fill:none;marker-end:url(#arrowGreen)}.arrowAmber{stroke:#ad7a35;stroke-width:2.8;fill:none;marker-end:url(#arrowAmber)}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">普通候选表先分流，始终保留表再汇入相关集合</text>
  <text x="52" y="88" class="subtitle">关键区别：all_tables 参加模型投票；always_keep 不参加投票，也不会被折叠。</text>

  <rect x="52" y="132" width="300" height="432" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="172" class="h2">all_tables</text>
  <text x="80" y="198" class="body">参加模型判断的普通候选表</text>
  <rect x="80" y="228" width="244" height="64" rx="12" fill="#fff"/><text x="100" y="254" class="code">company_financials</text><text x="100" y="278" class="green">per_table = true</text>
  <rect x="80" y="310" width="244" height="64" rx="12" fill="#fff"/><text x="100" y="336" class="code">company_profile</text><text x="100" y="360" class="green">per_table = true</text>
  <rect x="80" y="392" width="244" height="64" rx="12" fill="#fff1dc"/><text x="100" y="418" class="code">employee_attendance</text><text x="100" y="442" class="amber">per_table = false</text>
  <text x="80" y="498" class="small">这里不包含 doc_company_rules</text>
  <text x="80" y="520" class="small">因为它属于 always_keep</text>

  <path d="M352 272 H440 V230 H520" class="arrowGreen"/>
  <path d="M352 350 H456 V250 H520" class="arrowGreen"/>
  <text x="383" y="211" class="green">true 路径</text>
  <path d="M352 424 H456 V480 H520" class="arrowAmber"/>
  <text x="382" y="466" class="amber">false 路径</text>

  <rect x="520" y="132" width="300" height="216" rx="20" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/>
  <text x="548" y="172" class="h2">相关普通表</text>
  <text x="548" y="198" class="body">all_tables 中 per_table=true</text>
  <rect x="548" y="224" width="244" height="86" rx="12" fill="#fff"/>
  <text x="568" y="252" class="code">company_financials</text>
  <text x="568" y="282" class="code">company_profile</text>

  <rect x="520" y="386" width="300" height="178" rx="20" fill="#fff1dc" stroke="#d1a15f" stroke-width="2" filter="url(#shadow)"/>
  <text x="548" y="426" class="h2">skipped_tables</text>
  <text x="548" y="452" class="body">all_tables 中 per_table=false</text>
  <rect x="548" y="478" width="244" height="50" rx="12" fill="#fff"/>
  <text x="568" y="509" class="code">employee_attendance</text>

  <rect x="52" y="592" width="300" height="82" rx="17" fill="#f0eafb" stroke="#a98ac8" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="624" class="h2">always_keep</text>
  <text x="78" y="650" class="code">doc_company_rules</text>
  <text x="204" y="650" class="small">不参加投票</text>
  <path d="M352 633 H874 V318 H928" class="arrowGreen"/>

  <path d="M820 240 H928" class="arrowGreen"/>
  <rect x="928" y="174" width="300" height="210" rx="20" fill="#dff3e8" stroke="#4b936d" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="956" y="214" class="h2">relevant_tables</text>
  <text x="956" y="240" class="body">相关普通表 + always_keep</text>
  <rect x="956" y="266" width="244" height="84" rx="12" fill="#fff"/>
  <text x="976" y="292" class="code">company_financials</text>
  <text x="976" y="316" class="code">company_profile</text>
  <text x="976" y="340" class="code">doc_company_rules</text>

  <path d="M820 478 H874 V500 H928" class="arrowAmber"/>
  <rect x="928" y="430" width="300" height="142" rx="20" fill="#fff1dc" stroke="#d1a15f" stroke-width="2" filter="url(#shadow)"/>
  <text x="956" y="470" class="h2">skipped_describe_keys</text>
  <text x="956" y="496" class="body">把无关表映射成折叠键</text>
  <rect x="956" y="518" width="244" height="34" rx="10" fill="#fff"/>
  <text x="972" y="540" class="code">context/db/hr.db::…</text>

  <rect x="420" y="606" width="808" height="68" rx="14" fill="#e8eef6"/>
  <text x="446" y="633" class="body">relevant_tables = 普通相关表 + always_keep</text>
  <text x="446" y="658" class="body">skipped_tables = 普通候选表中判为 false 的表；always_keep 永远不会进入这里。</text>
</svg>
