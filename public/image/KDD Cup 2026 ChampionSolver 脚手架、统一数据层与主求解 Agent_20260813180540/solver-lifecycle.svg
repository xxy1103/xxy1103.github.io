<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Solver Agent 的停止、重试与交付</title>
  <desc id="desc">模型通过返回最终文本结束单次 agent.run，外层再根据运行是否无异常以及本轮 prediction.csv 是否存在决定接受或重试。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <marker id="retryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c27a52"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.retry{stroke:#c27a52;stroke-width:2.5;fill:none;marker-end:url(#retryArrow)}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">两层停止：模型结束对话，外层决定是否停止重试</text>
  <text x="52" y="88" class="body">没有程序级“答案正确”终止条件；模型停止、CSV 产出和业务正确性是不同状态。</text>

  <rect x="48" y="126" width="550" height="250" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="76" y="162" class="h2">第一层：单次 agent.run()</text>
  <rect x="76" y="186" width="218" height="74" rx="13" fill="#e8f1fb"/>
  <text x="98" y="214" class="body">模型发起工具调用</text><text x="98" y="238" class="small">执行结果进入下一轮</text>
  <path d="M294 223 H346" class="arrow"/>
  <rect x="348" y="186" width="218" height="74" rx="13" fill="#f0eafb"/>
  <text x="370" y="214" class="body">模型返回最终文本</text><text x="370" y="238" class="small">不再调用工具</text>
  <path d="M457 260 V300" class="arrow"/>
  <rect x="348" y="302" width="218" height="48" rx="12" fill="#dff3e8"/>
  <text x="370" y="332" class="code">agent.run() 正常返回</text>
  <path d="M185 260 C185 322 316 322 316 223" class="retry"/>
  <text x="96" y="326" class="small">继续调用工具：保持在本次 run 内</text>

  <rect x="630" y="126" width="602" height="250" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="658" y="162" class="h2">Prompt 引导与程序事实</text>
  <rect x="658" y="186" width="258" height="146" rx="13" fill="#fff1dc"/>
  <text x="680" y="214" class="h2">Prompt 要求</text>
  <text x="680" y="242" class="body">结束前调用 run_solver</text>
  <text x="680" y="266" class="body">检查 CSV 行列与样例</text>
  <text x="680" y="300" class="small">这是行为引导</text>
  <rect x="944" y="186" width="258" height="146" rx="13" fill="#e8eef6"/>
  <text x="966" y="214" class="h2">程序实际检查</text>
  <text x="966" y="242" class="body">不要求调用过 run_solver</text>
  <text x="966" y="266" class="body">不判断 SQL 业务正确性</text>
  <text x="966" y="300" class="small">模型可能提前停止</text>

  <path d="M457 376 V420 H166" class="arrow"/>
  <rect x="48" y="422" width="1184" height="214" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="76" y="458" class="h2">第二层：外层 attempt 验收</text>
  <rect x="76" y="484" width="250" height="94" rx="13" fill="#fff"/>
  <text x="98" y="514" class="code">run_ok?</text><text x="98" y="540" class="body">agent.run 无异常</text><text x="98" y="562" class="small">超限或异常则为 false</text>
  <text x="344" y="540" class="h2">AND</text>
  <rect x="398" y="484" width="250" height="94" rx="13" fill="#fff"/>
  <text x="420" y="514" class="code">csv_exists?</text><text x="420" y="540" class="body">本轮 CSV 存在</text><text x="420" y="562" class="small">attempt 前已删除旧文件</text>
  <path d="M648 531 H718" class="arrow"/>
  <polygon points="810,474 900,531 810,588 720,531" fill="#fff" stroke="#82a8cc" stroke-width="2"/>
  <text x="770" y="526" class="h2">都满足？</text>
  <path d="M900 531 H952" class="arrow"/><text x="916" y="516" class="small">是</text>
  <rect x="954" y="484" width="244" height="94" rx="13" fill="#dff3e8"/>
  <text x="976" y="514" class="h2">接受 attempt</text><text x="976" y="540" class="body">停止重试并复制 CSV</text><text x="976" y="562" class="small">只证明完成交付</text>
  <path d="M810 588 V668 H516" class="retry"/><text x="826" y="622" class="small">否</text>
  <rect x="238" y="646" width="278" height="46" rx="12" fill="#fff1dc"/>
  <text x="258" y="674" class="body">恢复脚手架、删除旧 CSV、重试</text>
  <path d="M238 669 H86 V578" class="retry"/>
  <text x="564" y="676" class="small">最多五次；全部失败后直接执行当前 solver.py 兜底</text>
</svg>
