<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Solver 的口径决策模型</title>
  <desc id="desc">Solver 先判断原始记录、实体名单或聚合排名题，再决定目标列、重复值、空值、分组和并列规则。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="700" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">先判断一行代表什么，再决定 SQL 怎么写</text>
  <text x="52" y="88" class="body">题型决定重复值、NULL、DISTINCT、GROUP BY 与辅助列；不能看到表后直接套查询。</text>

  <rect x="430" y="126" width="420" height="98" rx="18" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="458" y="160" class="h2">解题前口径清单</text>
  <text x="458" y="188" class="body">目标列 · 字段映射 · 过滤/时间 · 行集粒度 · NULL · 排序/LIMIT</text>

  <path d="M640 224 V278 H220 V310" class="arrow"/><path d="M640 224 V310" class="arrow"/><path d="M640 278 H1060 V310" class="arrow"/>

  <rect x="48" y="312" width="350" height="260" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="76" y="350" class="h2">① 原始记录 / 指标列出</text>
  <text x="76" y="382" class="body">一行 = 一条原始观测</text>
  <rect x="76" y="406" width="294" height="114" rx="13" fill="#e8f1fb"/>
  <text x="98" y="434" class="body">保留重复值与 NULL</text>
  <text x="98" y="460" class="body">不擅自排序、去重或 LIMIT</text>
  <text x="98" y="486" class="small">只输出问题明确要求的列</text>
  <text x="76" y="548" class="code">task_15: SELECT 两个目标字段</text>

  <rect x="465" y="312" width="350" height="260" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="493" y="350" class="h2">② 实体名单 / 成员判定</text>
  <text x="493" y="382" class="body">一行 = 一个实体</text>
  <rect x="493" y="406" width="294" height="114" rx="13" fill="#f0eafb"/>
  <text x="515" y="434" class="body">按名称 / ID / 代码去重</text>
  <text x="515" y="460" class="body">过滤字段不等于输出字段</text>
  <text x="515" y="486" class="small">常用 SELECT DISTINCT entity</text>
  <text x="493" y="548" class="code">同一实体多条母表记录 → 一行</text>

  <rect x="882" y="312" width="350" height="260" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="910" y="350" class="h2">③ 聚合 / 排名 / 计数</text>
  <text x="910" y="382" class="body">一行 = 一个统计粒度</text>
  <rect x="910" y="406" width="294" height="114" rx="13" fill="#fff1dc"/>
  <text x="932" y="434" class="body">明确 GROUP BY 与聚合函数</text>
  <text x="932" y="460" class="body">处理 NULL、TopN 与极值并列</text>
  <text x="932" y="486" class="small">必要时输出分组标签</text>
  <text x="910" y="548" class="code">task_1: 行业 × 公司去重计数</text>

  <path d="M223 572 V618 H640" class="arrow"/><path d="M640 572 V618" class="arrow"/><path d="M1057 572 V618 H640" class="arrow"/>
  <rect x="394" y="610" width="492" height="58" rx="15" fill="#dff3e8" stroke="#6aa281" stroke-width="2"/>
  <text x="424" y="636" class="h2">把口径写成查询区注释 + run_sql(...)</text>
  <text x="424" y="657" class="small">语义判断显式化，最终计算交给 DuckDB</text>
</svg>
