<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
  <title id="title">Solver Agent 输入装配</title>
  <desc id="desc">静态系统指令、任务级 Knowledge 与视频规则，以及当前任务的数据描述、文档表和多模态证据共同组成 Solver 上下文。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="710" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">Solver 看到三层上下文，而不是只有 question</text>
  <text x="52" y="88" class="body">通用规则负责约束行为，任务级材料负责解释口径，多模态输入负责提供当前证据。</text>

  <rect x="48" y="128" width="330" height="474" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="76" y="166" class="h2">输入来源</text>
  <rect x="76" y="194" width="274" height="104" rx="13" fill="#e8f1fb"/><text x="98" y="222" class="code">System instruction</text><text x="98" y="246" class="body">输出 · 题型 · SQL · 工具规则</text><text x="98" y="270" class="small">注入当前 task 真实目录树</text>
  <rect x="76" y="316" width="274" height="104" rx="13" fill="#f0eafb"/><text x="98" y="344" class="code">Run instructions</text><text x="98" y="368" class="body">Knowledge 全文 · 视频规则</text><text x="98" y="392" class="small">video_result 建议仅供参考</text>
  <rect x="76" y="438" width="274" height="132" rx="13" fill="#fff1dc"/><text x="98" y="466" class="code">User input</text><text x="98" y="490" class="body">context 描述 · doc 表说明</text><text x="98" y="514" class="body">question · scaffold 提示</text><text x="98" y="538" class="small">有视频时前置帧 + hiccup + ASR</text>

  <path d="M378 365 H454" class="arrow"/>
  <rect x="456" y="128" width="410" height="474" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="484" y="166" class="h2">按任务创建的 Solver Agent</text>
  <rect x="484" y="194" width="354" height="82" rx="13" fill="#fff"/><text x="506" y="222" class="h2">多轮语义求解</text><text x="506" y="247" class="body">理解题意 · 探查数据 · 修正查询</text>
  <rect x="484" y="294" width="354" height="116" rx="13" fill="#fff"/><text x="506" y="322" class="h2">四个专用工具</text><text x="506" y="348" class="body">explore_data · read_solver</text><text x="506" y="372" class="body">edit_solver · run_solver</text><text x="506" y="395" class="small">工具反馈进入下一轮上下文</text>
  <rect x="484" y="428" width="354" height="132" rx="13" fill="#fff"/><text x="506" y="456" class="h2">证据权重</text><text x="506" y="482" class="body">字段语义：Knowledge / 视频定义优先</text><text x="506" y="506" class="body">视频：图像 + hiccup 高于 ASR</text><text x="506" y="530" class="small">前置 Agent 结论可采纳、复核或忽略</text>

  <path d="M866 365 H942" class="arrow"/>
  <rect x="944" y="178" width="286" height="374" rx="20" fill="#f0eafb" stroke="#a98ac8" stroke-width="2" filter="url(#shadow)"/>
  <text x="972" y="216" class="h2">输出的不是口头答案</text>
  <rect x="972" y="246" width="230" height="76" rx="12" fill="#fff"/><text x="994" y="274" class="body">口径决策</text><text x="994" y="298" class="small">目标列 · 行集 · 过滤 · 聚合</text>
  <path d="M1087 322 V360" class="arrow"/>
  <rect x="972" y="362" width="230" height="76" rx="12" fill="#fff"/><text x="994" y="390" class="code">edit solver.py</text><text x="994" y="414" class="small">把决策固化成 SQL</text>
  <path d="M1087 438 V476" class="arrow"/>
  <rect x="972" y="478" width="230" height="48" rx="12" fill="#dff3e8"/><text x="994" y="508" class="code">prediction.csv</text>

  <rect x="48" y="642" width="1182" height="38" rx="12" fill="#e8eef6"/>
  <text x="74" y="667" class="body">table_relevance 只折叠 Prompt 描述；所有表仍在统一数据层中，Solver 可以重新发现。</text>
</svg>
