<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">异构数据统一注册到 DuckDB</title>
  <desc id="desc">CSV、统一格式 JSON 和 SQLite 通过不同读取方式注册为 canonical View，再经统一命名和 SQL 归一提供给探查与 solver.py。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">异构文件通过不同入口，最终成为同一种 DuckDB View</text>
  <text x="52" y="88" class="body">文档抽取表已经是 SQLite，因此不需要为 Solver 设计第四套查询接口。</text>

  <rect x="48" y="132" width="302" height="416" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="76" y="170" class="h2">context/ 中的数据源</text>
  <rect x="76" y="198" width="246" height="74" rx="13" fill="#e8f1fb"/><text x="98" y="226" class="code">csv/*.csv</text><text x="98" y="250" class="body">DuckDB read_csv_auto</text>
  <rect x="76" y="290" width="246" height="92" rx="13" fill="#f0eafb"/><text x="98" y="318" class="code">json/*.json</text><text x="98" y="342" class="body">records → Pandas DF</text><text x="98" y="364" class="small">保留 _df_refs 强引用</text>
  <rect x="76" y="400" width="246" height="112" rx="13" fill="#fff1dc"/><text x="98" y="428" class="code">db/*.db · *.sqlite</text><text x="98" y="452" class="body">只读列出内部表</text><text x="98" y="474" class="body">DuckDB ATTACH READ_ONLY</text><text x="98" y="496" class="small">包括 doc_prepare 产物</text>

  <path d="M350 340 H426" class="arrow"/>
  <rect x="428" y="132" width="398" height="416" rx="20" fill="#e7f0fb" stroke="#82a8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="170" class="h2">build_datasource_state</text>
  <rect x="456" y="198" width="342" height="92" rx="13" fill="#fff"/><text x="478" y="226" class="h2">统一命名</text><text x="478" y="251" class="body">stem_to_ident → canonical</text><text x="478" y="274" class="small">df_ 别名 · casefold 冲突检测</text>
  <rect x="456" y="308" width="342" height="92" rx="13" fill="#fff"/><text x="478" y="336" class="h2">统一注册</text><text x="478" y="361" class="body">每个来源映射为 DuckDB View</text><text x="478" y="384" class="small">RegisteredTable 保留来源元数据</text>
  <rect x="456" y="418" width="342" height="92" rx="13" fill="#fff"/><text x="478" y="446" class="h2">统一 SQL 边界</text><text x="478" y="471" class="body">反引号 / 方括号 → 双引号</text><text x="478" y="494" class="small">唯一可判定的列名空格纠正</text>

  <path d="M826 340 H902" class="arrow"/>
  <rect x="904" y="132" width="326" height="416" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="932" y="170" class="h2">两个独立消费者</text>
  <rect x="932" y="210" width="270" height="112" rx="14" fill="#f0eafb"/><text x="954" y="240" class="h2">explore_data</text><text x="954" y="266" class="body">按 task 缓存连接</text><text x="954" y="289" class="body">限制展示行数并报告总数</text><text x="954" y="310" class="small">用于验证字段与查询</text>
  <rect x="932" y="352" width="270" height="126" rx="14" fill="#dff3e8" stroke="#6aa281" stroke-width="2"/><text x="954" y="382" class="h2">solver.py / run_sql</text><text x="954" y="408" class="body">每次子进程新建连接</text><text x="954" y="431" class="body">返回完整 DataFrame</text><text x="954" y="454" class="small">写入 prediction.csv</text>
  <text x="932" y="514" class="small">共享代码，不共享物理连接</text>

  <rect x="48" y="590" width="1182" height="82" rx="14" fill="#e8eef6"/>
  <text x="74" y="620" class="h2">一致性来自同一实现</text>
  <text x="74" y="648" class="body">build_datasource_state + stem_to_ident + normalize_query 同时服务探查和最终执行，减少“探查通过、脚本报错”的漂移。</text>
</svg>
