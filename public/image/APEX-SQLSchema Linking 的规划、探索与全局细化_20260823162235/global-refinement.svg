<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">全局细化的两轮增量流程</title>
  <desc id="desc">裁剪后的候选表和逐表判断先进入 Round 0 组装第一版 Schema，随后记录已确认字段并在 Round 1 从剩余候选中补充缺口，最终取并集并执行同名连接键保护。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c27a52"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.verify{stroke:#c27a52;stroke-width:2.5;fill:none;marker-end:url(#orangeArrow)}</style>
  </defs>
  <rect width="1280" height="760" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">Round 0 先组装，Round 1 再沿着第一版结果补漏</text>
  <text x="52" y="88" class="body">两个外层轮次职责相近但不并列：Round 1 只增量补充，不删除 Round 0 已选字段。</text>

  <rect x="52" y="126" width="1176" height="174" rx="20" fill="#fff" opacity=".94"/>
  <text x="76" y="158" class="h2">进入全局细化前已经具备的两类输入</text>
  <rect x="82" y="188" width="302" height="78" rx="15" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="108" y="219" class="h2">filtered_tables_dict</text><text x="108" y="245" class="small">裁剪后仍可选择的最大表列范围</text>
  <rect x="420" y="188" width="342" height="78" rx="15" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="446" y="219" class="h2">table_judgments</text><text x="446" y="245" class="small">逐表探索产生的 MARKED 状态与证据</text>
  <rect x="798" y="188" width="380" height="78" rx="15" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="824" y="219" class="h2">语义初始化 + question + evidence</text><text x="824" y="245" class="small">提供表角色、任务目标与外部知识</text>

  <path d="M590 300 V350" class="arrow"/>
  <rect x="402" y="352" width="376" height="112" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="432" y="388" class="h2">Round 0：组装第一版 Schema</text>
  <text x="432" y="418" class="body">从全部候选表和逐表标记中选择必要表列</text>
  <text x="432" y="444" class="small">覆盖过滤、连接、聚合、分组和直接输出</text>

  <path d="M402 408 H294" class="verify"/>
  <rect x="64" y="350" width="228" height="116" rx="18" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="90" y="386" class="h2">本轮内部 SQL 验证</text>
  <text x="90" y="416" class="body">执行 exploration_queries</text>
  <text x="90" y="442" class="small">结果反馈给同一模型会话</text>
  <path d="M178 350 C178 316 472 316 472 352" class="verify"/>
  <text x="222" y="329" class="small">需要验证时循环；[CONFIRM] 只结束本轮内部验证</text>

  <path d="M778 408 H852" class="arrow"/>
  <rect x="854" y="352" width="344" height="112" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="882" y="388" class="h2">记录 Round 0 状态</text>
  <text x="882" y="418" class="body">Currently Confirmed Columns</text>
  <text x="882" y="444" class="small">同时构造尚未选中的 Remaining Candidates</text>

  <path d="M1026 464 V524" class="arrow"/>
  <rect x="738" y="526" width="460" height="116" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="768" y="562" class="h2">Round 1：Gap Analysis 与增量补漏</text>
  <text x="768" y="592" class="body">检查关系图是否缺少 ID、外键、Bridge Table 或替代路径</text>
  <text x="768" y="618" class="small">不重新逐表探索；只从 Remaining Candidates 中恢复字段</text>

  <path d="M738 584 H636" class="arrow"/>
  <rect x="332" y="526" width="302" height="116" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="360" y="562" class="h2">确定性合并</text>
  <text x="360" y="592" class="code">final = Round 0 ∪ Round 1</text>
  <text x="360" y="618" class="small">外层状态只增加，不删除已确认字段</text>

  <path d="M332 584 H230" class="arrow"/>
  <rect x="54" y="526" width="174" height="116" rx="18" fill="#dff3e8" stroke="#4b936d" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="562" class="h2">refined_schema</text>
  <text x="78" y="592" class="body">同名连接键保护</text>
  <text x="78" y="618" class="small">最终高召回子图</text>

  <rect x="64" y="688" width="1152" height="42" rx="12" fill="#e8eef6"/>
  <text x="90" y="714" class="body">退出语义：Round 0 的 [CONFIRM] 不会跳过 Round 1；当前实现固定完成两个外层轮次后交付累计并集。</text>
</svg>
