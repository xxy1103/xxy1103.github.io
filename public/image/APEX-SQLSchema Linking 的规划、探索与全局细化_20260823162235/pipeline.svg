<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Schema Linking 完整算法流水线</title>
  <desc id="desc">完整 Schema 经分组、逻辑计划、双视角裁剪、语义初始化、逐表探索和全局细化，形成最终关系子图。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.badge{font:700 12px "Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#60758e;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">从完整 Schema 到查询级关系子图</text>
  <text x="52" y="88" class="body">先缩小候选空间，再用真实数据验证局部判断，最后从全局恢复连接缺口。</text>

  <rect x="58" y="132" width="1164" height="204" rx="20" fill="#fff" opacity=".92"/>
  <text x="80" y="164" class="h2">阶段 A：建立候选空间</text>
  <rect x="82" y="194" width="200" height="102" rx="16" fill="#e8f1fb" filter="url(#shadow)"/><circle cx="106" cy="218" r="13" fill="#356aa0"/><text x="102" y="222" class="badge">1</text><text x="130" y="223" class="h2">加载与分组</text><text x="106" y="254" class="body">完整表列与样例</text><text x="106" y="276" class="small">相同结构表成组</text>
  <path d="M282 245 H334" class="arrow"/>
  <rect x="336" y="194" width="200" height="102" rx="16" fill="#f0eafb" filter="url(#shadow)"/><circle cx="360" cy="218" r="13" fill="#7655a6"/><text x="356" y="222" class="badge">2</text><text x="384" y="223" class="h2">抽象计划</text><text x="360" y="254" class="body">只看问题</text><text x="360" y="276" class="small">两份草稿合并</text>
  <path d="M536 245 H588" class="arrow"/>
  <rect x="590" y="194" width="232" height="102" rx="16" fill="#f0eafb" filter="url(#shadow)"/><circle cx="614" cy="218" r="13" fill="#7655a6"/><text x="610" y="222" class="badge">3</text><text x="638" y="223" class="h2">双视角裁剪</text><text x="614" y="254" class="body">负向删除 + 正向选择</text><text x="614" y="276" class="small">高召回合并</text>
  <path d="M822 245 H874" class="arrow"/>
  <rect x="876" y="194" width="250" height="102" rx="16" fill="#f0eafb" filter="url(#shadow)"/><circle cx="900" cy="218" r="13" fill="#7655a6"/><text x="896" y="222" class="badge">4</text><text x="924" y="223" class="h2">语义初始化</text><text x="900" y="254" class="body">Target · Filter · Bridge</text><text x="900" y="276" class="small">为每张表建立预期角色</text>

  <path d="M1002 296 V390" class="arrow"/>
  <rect x="58" y="376" width="1164" height="242" rx="20" fill="#fff" opacity=".92"/>
  <text x="80" y="408" class="h2">阶段 B：证据验证与全局收敛</text>
  <rect x="110" y="450" width="280" height="118" rx="18" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="138" y="484" class="h2">5. 逐表 SQL 探索</text><text x="138" y="514" class="body">语义 · 粒度 · 连接 · NULL</text><text x="138" y="540" class="small">每张候选表最多两轮</text>
  <path d="M390 509 H494" class="arrow"/>
  <rect x="496" y="450" width="288" height="118" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="524" y="484" class="h2">6. 初始组装 → 增量补漏</text><text x="524" y="514" class="body">Round 0 组装，Round 1 检查缺口</text><text x="524" y="540" class="small">最终结果取两轮字段并集</text>
  <path d="M784 509 H888" class="arrow"/>
  <rect x="890" y="450" width="280" height="118" rx="18" fill="#dff3e8" stroke="#4b936d" stroke-width="2" filter="url(#shadow)"/>
  <text x="918" y="484" class="h2">7. refined_schema</text><text x="918" y="514" class="body">相关表列 + 功能理由</text><text x="918" y="540" class="small">缓存逐步落盘，可断点复用</text>

  <rect x="70" y="654" width="1140" height="38" rx="11" fill="#e8eef6"/>
  <text x="94" y="679" class="body">两层循环：逐表探索解决局部事实；全局细化解决跨表连接与完整性。</text>
</svg>
