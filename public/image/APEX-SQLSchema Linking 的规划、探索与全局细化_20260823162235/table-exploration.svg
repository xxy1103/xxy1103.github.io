<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">逐表探索闭环</title>
  <desc id="desc">模型根据表的预期角色生成探索 SQL，数据库返回真实结果，再由模型补查或输出相关性判断。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.back{stroke:#c27a52;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="690" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">逐表判断不是“看名字”，而是“提出假设并查数据”</text>
  <text x="52" y="88" class="body">每张候选表拥有独立会话和 SQL 环境，最多进行两轮探索。</text>

  <rect x="72" y="148" width="238" height="112" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="98" y="182" class="h2">候选表上下文</text><text x="98" y="212" class="body">字段 · 描述 · Evidence</text><text x="98" y="238" class="small">全局语义初始化给出预期角色</text>
  <path d="M310 204 H402" class="arrow"/>
  <rect x="404" y="148" width="254" height="112" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="430" y="182" class="h2">生成 3～8 条探索 SQL</text><text x="430" y="212" class="body">语义 · 粒度 · 连接 · NULL</text><text x="430" y="238" class="small">查询必须围绕预期角色</text>
  <path d="M658 204 H750" class="arrow"/>
  <rect x="752" y="148" width="230" height="112" rx="18" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="778" y="182" class="h2">Snowflake 执行</text><text x="778" y="212" class="body">返回真实值与错误</text><text x="778" y="238" class="small">单次结果长度受限</text>
  <path d="M982 204 H1062" class="arrow"/>
  <polygon points="1144,140 1220,204 1144,268 1068,204" fill="#fff" stroke="#82a8cc" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1100" y="198" class="h2">证据充分？</text><text x="1112" y="222" class="small">能判断相关性</text>

  <path d="M1144 268 V372" class="arrow"/><text x="1158" y="326" class="small">是</text>
  <rect x="978" y="374" width="288" height="130" rx="18" fill="#dff3e8" stroke="#4b936d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006" y="410" class="h2">结构化单表判断</text><text x="1006" y="440" class="body">relevant + relevant_columns</text><text x="1006" y="466" class="small">理由、观察、摘要、exploration_log</text>

  <path d="M1068 204 C1010 204 1014 322 866 322 V262" class="back"/><text x="900" y="310" class="small">否：反馈结果并补查</text>

  <rect x="72" y="360" width="790" height="198" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="100" y="396" class="h2">四类探索证据</text>
  <rect x="100" y="424" width="164" height="94" rx="14" fill="#e8f1fb"/><text x="122" y="454" class="h2">语义对齐</text><text x="122" y="480" class="small">DISTINCT 值</text><text x="122" y="500" class="small">是否匹配题意</text>
  <rect x="286" y="424" width="164" height="94" rx="14" fill="#e8f1fb"/><text x="308" y="454" class="h2">粒度范围</text><text x="308" y="480" class="small">一行代表什么</text><text x="308" y="500" class="small">聚合是否重复</text>
  <rect x="472" y="424" width="164" height="94" rx="14" fill="#e8f1fb"/><text x="494" y="454" class="h2">连接能力</text><text x="494" y="480" class="small">键是否非空</text><text x="494" y="500" class="small">桥接是否可用</text>
  <rect x="658" y="424" width="164" height="94" rx="14" fill="#e8f1fb"/><text x="680" y="454" class="h2">数据质量</text><text x="680" y="480" class="small">NULL 与值域</text><text x="680" y="500" class="small">关键列是否可用</text>

  <rect x="70" y="610" width="1140" height="38" rx="11" fill="#e8eef6"/>
  <text x="94" y="635" class="body">算法边界：探索 SQL 提供证据，但最终“是否相关”仍由模型结合题目与表角色判断。</text>
</svg>
