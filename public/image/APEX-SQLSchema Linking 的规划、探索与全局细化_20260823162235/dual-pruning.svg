<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">双视角高召回裁剪</title>
  <desc id="desc">相同 Schema 批次分别执行负向裁剪和正向选择，删除取保守交集，保留取宽松并集。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 29px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19324c}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52677f}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#667b91}.code{font:500 13px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="650" rx="24" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">删除要求共识，保留允许分歧</text>
  <text x="52" y="88" class="body">Schema Linking 优先防止漏列：误留增加成本，误删可能切断唯一正确路径。</text>

  <rect x="62" y="158" width="238" height="124" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="90" y="194" class="h2">Schema 批次</text><text x="90" y="224" class="body">问题 + Master Plan</text><text x="90" y="250" class="small">8K～12K Token 动态分批</text>
  <path d="M300 220 C370 220 370 162 438 162" class="arrow"/><path d="M300 220 C370 220 370 388 438 388" class="arrow"/>

  <rect x="440" y="116" width="292" height="144" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="470" y="152" class="h2">负向裁剪 × 2</text><text x="470" y="184" class="body">只删除 100% 无关项</text><text x="470" y="211" class="code">remove = sample₁ ∩ sample₂</text><text x="470" y="238" class="small">不确定、ID、Code、Name 倾向保留</text>
  <rect x="440" y="340" width="292" height="144" rx="18" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="470" y="376" class="h2">正向选择 × 2</text><text x="470" y="408" class="body">任一用途成立即可选中</text><text x="470" y="435" class="code">keep = sample₁ ∪ sample₂</text><text x="470" y="462" class="small">过滤、连接、聚合、输出均算相关</text>

  <path d="M732 188 H846" class="arrow"/><path d="M732 412 H846" class="arrow"/>
  <polygon points="956,126 1070,300 956,474 842,300" fill="#fff" stroke="#82a8cc" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="900" y="272" class="h2">合并冲突</text><text x="882" y="302" class="body">正向命中优先保留</text><text x="900" y="330" class="small">宁可多留，不可错删</text>
  <path d="M1070 300 H1164" class="arrow"/>
  <rect x="996" y="510" width="210" height="78" rx="16" fill="#dff3e8" stroke="#4b936d" stroke-width="2"/>
  <text x="1022" y="542" class="h2">候选 Schema</text><text x="1022" y="568" class="small">进入语义初始化与探索</text>
  <path d="M1100 474 V508" class="arrow"/>

  <rect x="60" y="538" width="738" height="50" rx="13" fill="#e8eef6"/>
  <text x="86" y="569" class="body">当候选仍超过 2000 列时才采用更强的正向保留，防止超大 Schema 无法继续处理。</text>
</svg>
